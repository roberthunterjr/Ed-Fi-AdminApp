<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ed-Fi Admin App &mdash; Certification Automation Platform (MVP prototype)</title>
<style>
/* ============================================================
   Ed-Fi Admin App shell — visual vocabulary lifted from the
   existing application screenshots. Prototype only.
   ============================================================ */
:root{
  --teal:#2e7d6a; --teal-dark:#246455; --teal-soft:#a9cfc5; --teal-bg:#eef6f3;
  --red:#e5342a; --red-dark:#c42b22; --red-bg:#fdeeed;
  --ink:#1f2a37; --ink-2:#39424e; --muted:#6b7480; --muted-2:#8b929c;
  --line:#e3e6ea; --line-2:#eceef1; --page:#f4f5f7; --thead:#eef0f3;
  --amber:#b7791f; --amber-bg:#fdf6e6; --blue:#2b6cb0; --blue-bg:#ebf3fb;
  --indigo:#5a4b9e; --indigo-bg:#f0edf9; --green:#2f7d54; --green-bg:#ecf6f0;
  --accent:var(--teal); --accent-dark:var(--teal-dark); --accent-bg:var(--teal-bg);
  --radius:6px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
body.scope-global{ --accent:var(--red); --accent-dark:var(--red-dark); --accent-bg:var(--red-bg); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:14px;line-height:1.45}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit}

/* ---------- header ---------- */
.appbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:16px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.3px;font-size:15px}
.logo .dot{width:22px;height:22px;border-radius:50%;
  background:conic-gradient(#e5342a,#f6a623,#7ab800,#00a3b5,#5a4b9e,#e5342a);
  box-shadow:inset 0 0 0 6px #fff}
.logo small{display:block;font-size:7px;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.appbar .divider{width:1px;height:26px;background:var(--line)}
.scope-title{font-weight:700;font-size:16px}
.appbar .spacer{flex:1}
.proto-pill{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:#8a5a00;background:#fff4d6;border:1px solid #f0dca8;border-radius:999px;padding:3px 9px}
.persona{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.persona select{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;color:var(--ink)}
.help{color:var(--muted);font-size:17px;cursor:default}
.avatar{width:28px;height:28px;border-radius:50%;background:#d7dae0;color:#4a5460;display:grid;
  place-items:center;font-size:12px;font-weight:700}

/* ---------- layout ---------- */
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:252px;flex:0 0 252px;background:#fff;border-right:1px solid var(--line);padding:16px 0 28px}
.main{flex:1;min-width:0;padding:18px 26px 60px}
.scopepick{margin:0 14px 14px}
.scopepick select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink)}
.navsec{font-size:12px;font-weight:700;color:var(--muted);padding:14px 18px 6px;letter-spacing:.2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 18px;color:var(--ink-2);font-size:13.5px;
  border-left:3px solid transparent}
.nav a:hover{background:#f7f8f9;text-decoration:none}
.nav a.on{color:var(--accent);font-weight:700;background:var(--accent-bg);border-left-color:var(--accent)}
.nav a .ic{width:17px;text-align:center;opacity:.75;font-size:13px}
.nav .sub a{padding-left:42px;font-size:13px}
.navsearch{margin:0 14px 8px;position:relative}
.navsearch input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:999px;
  font-family:inherit;font-size:13px}
.navsearch:before{content:"\1F50D";position:absolute;left:10px;top:7px;font-size:11px;opacity:.5}
.sidenote{margin:22px 16px 0;padding-top:12px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted-2)}

/* ---------- page furniture ---------- */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs span{margin:0 6px;color:#c3c8cf}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin:0 0 16px}
.pagehead h1{font-size:26px;margin:0;letter-spacing:-.4px}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:15.5px;margin:0 0 14px}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.cardhead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.cardhead h2{margin:0}
.cardhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.summary{display:flex;gap:56px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.summary div{min-width:120px}
.summary .k{color:var(--muted);font-size:13px}
.summary .v{font-size:14.5px;margin-top:2px}
.tools{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:0 1 360px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:999px;
  font-family:inherit;font-size:13px}
.search:before{content:"\1F50D";position:absolute;left:12px;top:8px;font-size:11px;opacity:.5}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.chip{border:1px solid var(--teal-soft);background:var(--teal-bg);color:var(--teal-dark);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip select{border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--teal-dark);outline:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius);
  border:1px solid transparent;background:var(--teal);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--teal-dark)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:#f7f8f9}
.btn.quiet{background:var(--teal-soft);color:#fff;cursor:not-allowed}
.btn[disabled]{background:var(--teal-soft);color:#fff;cursor:not-allowed;border-color:transparent}
body.scope-global .btn[disabled]{background:#f0b3ae}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--thead);color:#5a6472;font-size:11px;letter-spacing:.7px;text-transform:uppercase;
  text-align:left;padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.group td{background:#fafbfc;font-weight:700;font-size:13px;color:var(--ink-2)}
table.t td.num,table.t th.num{text-align:right}
table.t td.act{text-align:right;white-space:nowrap}
.t .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.empty{padding:22px 14px;color:var(--muted);font-style:italic}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 0 2px;color:var(--muted);font-size:13px}
.pager button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px}
.pager select{border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px;font-family:inherit;font-size:12.5px}

/* ---------- badges / pills ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:#eef0f3;color:#5a6472}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-indigo{background:var(--indigo-bg);color:var(--indigo)}
.b-orange{background:#fdf0e6;color:#b45309}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red-dark)}
.dotstate{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.dotstate i{width:8px;height:8px;border-radius:50%;background:#c3c8cf;display:inline-block}
.dotstate.run i{background:var(--blue);animation:pulse 1s infinite}
.dotstate.ok i{background:var(--green)} .dotstate.bad i{background:var(--red)}
.dotstate.warn i{background:var(--amber)}
@keyframes pulse{50%{opacity:.25}}
.legend{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap}
.legend .badge{font-weight:600}
.tag{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f2f4f6;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2)}

/* ---------- banners ---------- */
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:#fbfcfd;border-radius:var(--radius);
  padding:14px 18px;margin-bottom:18px}
.banner h3{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:10px}
.banner p{margin:4px 0 0;color:var(--ink-2)}
.banner ul{margin:8px 0 0 18px;padding:0;color:var(--ink-2)}
.banner li{margin:3px 0}
.banner.amber{border-left-color:var(--amber);background:var(--amber-bg)}
.banner.blue{border-left-color:var(--blue);background:var(--blue-bg)}
.banner.green{border-left-color:var(--green);background:var(--green-bg)}
.banner.red{border-left-color:var(--red);background:var(--red-bg)}
.banner.indigo{border-left-color:var(--indigo);background:var(--indigo-bg)}
.scenariohead{border:1px solid var(--line);border-left:4px solid var(--blue);background:#f7fafd;
  border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;gap:56px}
.scenariohead .k{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
.scenariohead .v{font-size:17px;font-weight:700;margin-top:2px}

/* ---------- product / dashboard cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.tile.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.tile h3{margin:0 0 2px;font-size:15px}
.tile .meta{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.tile .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.tile .row .mdl{font-weight:600}
.tile .row .sp{margin-left:auto}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.hot .n{color:var(--red)}
.asof{color:var(--muted-2);font-size:12px;margin:-6px 0 16px}

/* ---------- forms ---------- */
.paramgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.paramgrid .field{margin-bottom:0;max-width:none}
.field{margin-bottom:16px;max-width:520px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:13.5px}
.field input[type=text],.field input[type=password],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;font-size:13.5px}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:#2b6cb0;box-shadow:0 0 0 2px #dbe8f6}
.field .help{color:var(--muted);font-size:12.5px;margin-top:5px}
.field.wide{max-width:none}
.radios label{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:0 0 9px;font-size:13.5px}
.radios input{margin-top:3px}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);
  background:#fafbfc;margin-bottom:14px;font-size:13px}

/* ---------- history ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted);width:130px;flex:0 0 130px;font-size:12.5px}
.hist .who{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}

/* ---------- modal / toast ---------- */
.veil{position:fixed;inset:0;background:rgba(24,32,41,.42);display:grid;place-items:center;z-index:100;padding:24px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:580px;max-height:88vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.24)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:20px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#1f2a37;color:#fff;padding:12px 16px;
  border-radius:var(--radius);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px}
.err{color:var(--red-dark)}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.stale{font-size:11.5px}
</style>
</head>
<body class="scope-team">
<div class="appbar">
  <div class="logo"><span class="dot"></span><span>ed&middot;fi<small>ALLIANCE</small></span></div>
  <div class="divider"></div>
  <div class="scope-title" id="scopeTitle">Test Vendor Dev Team</div>

  <div class="spacer"></div>
  <div class="persona">
    <label for="personaSel">Viewing as</label>
    <select id="personaSel">
      <option value="vendor">Vendor &mdash; Test Vendor Dev Team</option>
      <option value="reviewer">Ed-Fi Alliance staff &mdash; global scope</option>
    </select>
  </div>
  <span class="help">?</span>
  <div class="avatar" id="avatar">A</div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>

<script>
/* ==============================================================
   Certification Automation Platform — MVP clickable prototype
   Mock data only. No network calls, no persistence.
   Behaviours traceable to docs/PRD-Platform-Automation-MVP.md:
     §8 status model, §8.1 run completeness, §9 artifacts,
     §9.1 value reconciliation, FR7/FR8/FR9/FR10/FR11/FR12/FR13/FR14/FR15/FR17
   ============================================================== */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW = new Date('2026-09-15T14:20:00');
let clock = new Date(NOW);
const tick = () => { clock = new Date(clock.getTime() + 61000); return new Date(clock); };
const fmt = d => d ? new Date(d).toLocaleString('en-US',
  {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const fmtShort = d => d ? new Date(d).toLocaleString('en-US',
  {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const dur = (a,b) => !a||!b ? '—' : Math.max(1, Math.round((new Date(b)-new Date(a))/1000)) + 's';
let seq = 100; const uid = p => p + '-' + (++seq);

/* ---------- reference data ---------- */
const MODELS = {
  sis: {id:'sis', label:'SIS v5', kind:'bruno', tag:'sis-v5.0.3', sha:'a7f3c19d'},
  assessments: {id:'assessments', label:'Assessments v5', kind:'assessments', tag:'assessments-v5.1.0', sha:'6c02b4ae'},
  mtss: {id:'mtss', label:'MTSS / Interventions v5', kind:'bruno', tag:'mtss-v1.0.0', sha:'4b1e08d2'}
};
const ARTIFACTS = [
  {id:'mapping', label:'Vendor mapping CSV', validation:'Structural / schema validation on upload',
   note:'Source of truth for Assessments scope (D2).'},
  {id:'sample',  label:'Sample data', validation:'Parseable and non-empty',
   note:'Expected-result set for value reconciliation — not a load source (D17).'},
  {id:'docs',    label:'Product documentation', validation:'Not validated — human review',
   note:'For Assessments: an example score report from the vendor’s application.'}
];
const STATUS = {
  draft:      {label:'Draft',                 cls:'b-gray',   who:'Vendor'},
  incomplete: {label:'Submission Incomplete',  cls:'b-amber',  who:'Vendor'},
  ready:      {label:'Ready for Review',       cls:'b-blue',   who:'Reviewer picks it up'},
  inreview:   {label:'In Review',              cls:'b-indigo', who:'Reviewer'},
  changes:    {label:'Changes Requested',      cls:'b-orange', who:'Vendor'},
  approved:   {label:'Approved',               cls:'b-green',  who:'Terminal'},
  rejected:   {label:'Rejected',               cls:'b-red',    who:'Terminal'}
};
const badge = k => `<span class="badge ${STATUS[k].cls}">${esc(STATUS[k].label)}</span>`;
const completenessBadge = c => c === 'Complete'
  ? '<span class="badge b-green">Complete</span>'
  : '<span class="badge b-amber">Incomplete &middot; trial run</span>';

/* ------------------------------------------------------------------
   Bruno scenario content.

   SIS is the real v5 collection: areas, scenarios, step names, step counts and
   element assertions are parsed from Ed-Fi-Alliance-OSS/certification-testing at
   bruno/SIS/v5. Every step there is a GET — the vendor loads the data into their
   own SIS by hand first, and the suite reads it back and asserts on it.

   A step's element spec is a ';'-separated list of "path:type" tokens. The type
   letter implies the canonical assertion pair the collection uses almost
   everywhere; a '?' suffix carries an unusual operator set verbatim.
     S -> String   isString, isNotEmpty      A -> Array    isArray, isNotEmpty
     N -> Number   isNumber, neq 0           O -> Object   isDefined
     B -> Boolean  isBoolean
   '=' reuses the previous step's spec (steps in a scenario mostly assert the
   same shape); '' means the step asserts on status alone, as Delete steps do.

   Each step is [name, expectedStatus, changedField, elementSpec]. changedField
   is the one real value check in the collection — expectChanged() in the
   post-response script of an Update step.
   ------------------------------------------------------------------ */
const ASSERT_TYPE = {
  S:['String',  'isString, isNotEmpty'],
  N:['Number',  'isNumber, neq 0'],
  A:['Array',   'isArray, isNotEmpty'],
  O:['Object',  'isDefined'],
  B:['Boolean', 'isBoolean']
};
const SIS_V5 = [
 ['Contact','Contacts',[
  ['01 - 1st Contact is valid',200,'','id:S;contactUniqueId:S;firstName:S;lastSurname:S;sexDescriptor:S;addresses:A;addresses[0].addressTypeDescriptor:S;addresses[0].city:S;addresses[0].postalCode:S;addresses[0].stateAbbreviationDescriptor:S;addresses[0].streetNumberName:S;addresses[0].apartmentRoomSuiteNumber:S;addresses[0].nameOfCounty:S;addresses[0].doNotPublishIndicator:B;electronicMails:A;electronicMails[0].electronicMailAddress:S;electronicMails[0].electronicMailTypeDescriptor:S;electronicMails[0].primaryEmailAddressIndicator:B'],
  ['02 - 2nd Contact is valid',200,'','id:S;contactUniqueId:S;firstName:S;lastSurname:S;sexDescriptor:S;addresses:A;addresses[0].addressTypeDescriptor:S;addresses[0].city:S;addresses[0].postalCode:S;addresses[0].stateAbbreviationDescriptor:S;addresses[0].streetNumberName:S;addresses[0].nameOfCounty:S;electronicMails:A;electronicMails[0].electronicMailAddress:S;electronicMails[0].electronicMailTypeDescriptor:S'],
  ['03 - 1st Contact - electronicMailAddress was Updated',200,'electronicMailAddress','id:S;contactUniqueId:S;firstName:S;lastSurname:S;sexDescriptor:S;addresses:A;addresses[0].addressTypeDescriptor:S;addresses[0].city:S;addresses[0].postalCode:S;addresses[0].stateAbbreviationDescriptor:S;addresses[0].streetNumberName:S;addresses[0].apartmentRoomSuiteNumber:S;addresses[0].nameOfCounty:S;addresses[0].doNotPublishIndicator:B;electronicMails:A;electronicMails[0].electronicMailAddress:S;electronicMails[0].electronicMailTypeDescriptor:S;electronicMails[0].primaryEmailAddressIndicator:B'],
  ['04 - 2nd Contact - streetNumberName was Updated',200,'streetNumberName','id:S;contactUniqueId:S;firstName:S;lastSurname:S;sexDescriptor:S;addresses:A;addresses[0].addressTypeDescriptor:S;addresses[0].city:S;addresses[0].postalCode:S;addresses[0].stateAbbreviationDescriptor:S;addresses[0].streetNumberName:S;addresses[0].nameOfCounty:S;electronicMails:A;electronicMails[0].electronicMailAddress:S;electronicMails[0].electronicMailTypeDescriptor:S']],
  {seq:1,prereqs:[],tasks:[
  [1,'CREATE the first Contact',0],
  [2,'CREATE the second Contact',0],
  [3,'UPDATE the electronicMailAddress on the first added Contact',0],

function scenarioTasks(rawSteps, meta){
  const stepNumber = s => parseInt(s[0], 10);
  if (!meta.tasks.length){
    return rawSteps.map((s, i) => ({n: stepNumber(s), text: s[0], outOfScope: false, stepIndex: i}));
  }
  return meta.tasks.map(([n, text, outOfScope]) => ({
    n, text, outOfScope: !!outOfScope,
    stepIndex: rawSteps.findIndex(s => stepNumber(s) === n)
  }));
}

/* ---------- result builders ---------- */
function mockObserved(path, letter, key){
  const leaf = path.split('.').pop().replace(/\[\d+\]$/, '');
  if (SAMPLE_VALUES[leaf]) return SAMPLE_VALUES[leaf];
  const h = seedOf(key + '|' + path);
  if (letter === 'B') return h % 2 ? 'true' : 'false';
  if (letter === 'N') return String(h % 40 + 1);
  if (letter === 'O') return '{ … }';
  if (letter === 'A') return '[ ' + (h % 3 + 1) + ' item(s) ]';
  if (/Descriptor$/.test(leaf)) return 'uri://ed-fi.org/' + leaf.charAt(0).toUpperCase() + leaf.slice(1) +
    '#' + (DESCRIPTOR_VALUES[leaf] || leaf.replace(/Descriptor$/, '').replace(/([A-Z])/g, ' $1')
      .trim().replace(/^./, c => c.toUpperCase()));
  if (/Date$/.test(leaf)) return '2016-09-' + String(h % 28 + 1).padStart(2, '0');
  if (/Time$/.test(leaf)) return String(h % 12 + 8).padStart(2, '0') + ':00:00';
  if (leaf === 'id') return h.toString(16).padStart(8, '0') + '-4a1c-9f2e-' + (h % 9999);
  return leaf.replace(/([A-Z])/g, ' $1').trim().replace(/^./, c => c.toUpperCase()) + ' ' + (h % 90 + 10);
}
/* Decode one "path:type[?ops]" token into a displayable element row. */
function decodeElement(token, key, changedField, f, isFailStep){
  const [path, rest] = token.split(':');
  const letter = rest.charAt(0);
  const explicit = rest.indexOf('?') >= 0 ? rest.slice(rest.indexOf('?') + 1) : null;
  const meta = ASSERT_TYPE[letter] || ASSERT_TYPE.S;
  const leaf = path.split('.').pop().replace(/\[\d+\]$/, '');
  const type = /Descriptor$/.test(leaf) && letter === 'S' ? 'Descriptor' : meta[0];
  const el = {el:path, type, assertions: explicit ? explicit.split(',').join(', ') : meta[1],
              observed: mockObserved(path, letter, key), st:'pass'};
  /* The one real value check the collection makes. */
  if (changedField && path === changedField){
    const before = seedOf(key + path) % 5 + 1;
    el.assertions = 'changed from ' + before;
    el.observed = String(before + 1);
  }
  if (isFailStep && f.el === path){
    el.st = f.kind;
    el.why = f.msg;
    if (f.kind === 'fail-absent') el.observed = '(absent)';
    if (f.kind === 'fail-unchanged') el.observed = (el.assertions.match(/\d+$/) || ['1'])[0];
    if (f.kind === 'fail-assert') el.observed = '"' + el.observed + '"';
  }
  return el;
}
/* A Bruno run materializes its whole scenario tree at start with every task
   unchecked, and runCheck() fills one task's slot in place. That keeps "latest
   check per task" structurally true — there is one slot per task, and
   re-checking overwrites it. */
function brunoRunState(model){
  return {kind:'bruno', scenarios: COLLECTION[model].map(([area, scenario, rawSteps, meta]) => {
    let spec = '';
    const steps = rawSteps.map(([name, status, changed, elementSpec]) => {
      if (elementSpec && elementSpec !== '=') spec = elementSpec;
      return {name, status, changed, spec: elementSpec === '' ? '' : spec};
    });
    return {
      area, scenario, seq: meta.seq, prereqs: meta.prereqs, params: {},
      tasks: scenarioTasks(rawSteps, meta).map(t => ({
        n: t.n, text: t.text, outOfScope: t.outOfScope,
        step: t.stepIndex >= 0 ? steps[t.stepIndex] : null,
        check: null
      }))
    };
  })};
}
/* A function declaration, not a const arrow: seed() runs at load and reaches
   this through runCheck, before a const in this position would initialize. */
function scenarioOf(run, key){
  return run.results.scenarios.find(s => s.area + '/' + s.scenario === key);
}

/* Executes one task's verification step and records the result. The run keeps
   only the latest check per task plus a count of attempts (ID3) — enough for a
   reviewer to see that a passing task took five tries, without retaining a
   history we have decided not to show. */
function runCheck(run, scenarioKey, taskNo){
  const scen = scenarioOf(run, scenarioKey);
  if (!scen) return null;
  const task = scen.tasks.find(t => t.n === taskNo);
  if (!task || !task.step) return null;

  /* The prototype's outcome switch reaches a single check as well as a whole run;
     without it an interactive run could never demonstrate the distinction FR8
     exists for, because it never executes as a batch. */
  if (run.mode === 'infra' || run.mode === 'auth'){
    const infra = run.mode === 'infra';
    task.check = {
      st:'fail', kind: infra ? 'fail-infra' : 'fail-auth',
      msg: infra ? 'Executor could not reach the environment ' + run.env
                 : '401 from the environment ' + run.env,
      observedStatus: infra ? 0 : 401, elements: [],
      params: Object.assign({}, scen.params), at: tick(), by: me(),
      attempts: (task.check ? task.check.attempts : 0) + 1
    };
    return task.check;
  }

  const fails = run.mode === 'pass' ? {} : (BRUNO_FAILS[run.model] || {});
  const f = fails[scenarioKey];
  const isFail = !!f && f.step === taskNo;
  const statusFailed = isFail && f.kind === 'fail-status';

  task.check = {
    st: isFail ? 'fail' : 'pass',
    kind: isFail ? f.kind : 'pass',
    msg: isFail ? f.msg : '',
    observedStatus: statusFailed ? 404 : task.step.status,
    elements: statusFailed || !task.step.spec ? []
      : task.step.spec.split(';').map(tok =>
          decodeElement(tok, scenarioKey, task.step.changed, f, isFail)),
    params: Object.assign({}, scen.params),
    at: tick(), by: me(),
    attempts: (task.check ? task.check.attempts : 0) + 1
  };
  return task.check;
}

/* Runs a scenario's tasks in order and stops at the first failure, matching the
   collection's own dependency behaviour — 03 calls validateDependency() against
   variables 01 sets, so continuing past a failure would only produce noise. */
function checkAll(run, scenarioKey){
  const scen = scenarioOf(run, scenarioKey);
  if (!scen) return 0;
  let n = 0;
  for (const task of scen.tasks){
    if (!task.step || task.outOfScope) continue;
    const check = runCheck(run, scenarioKey, task.n);
    n++;
    if (check && check.st === 'fail') break;
  }
  return n;
}

/* Sealing a partial run is allowed (ID9), so the action says plainly what is
   being frozen rather than letting it happen by accident. */
function sealSummary(run){
  const t = resultTally(run.results);
  const checked = t.pass + t.fail;
  return checked + ' of ' + t.total + ' scenarios checked' +
    (t.notAttempted ? ', ' + t.notAttempted + ' not attempted' : '');
}

/* Sealing freezes the latest check per task and re-executes nothing (ID2). The
   accumulated checks are the evidence. A run may be sealed with tasks never
   checked (ID9) — whether partial evidence suffices is the reviewer's call, not
   the platform's (§12, D25). */
function sealRun(run){
  if (run.state !== 'open') return run;
  const sub = submission(run.submissionId);
  run.state = 'sealed';
  run.ended = tick();
  const t = resultTally(run.results);
  run.outcome = t.fail > 0 ? 'failed' : (t.pass > 0 ? 'passed' : 'not-attempted');
  hist(sub, 'Run ' + run.id + ' sealed — ' + run.completeness + ' — ' +
    t.pass + ' passed, ' + t.fail + ' failed, ' + t.notAttempted + ' not attempted');
  recomputeStatus(sub);
  return run;
}
/* Abandoning is the honest option when a run has gone the wrong way. Forcing a
   seal instead would push a meaningless record into the review queue (ID5). */
function abandonRun(run){
  if (run.state !== 'open') return run;
  const sub = submission(run.submissionId);
  run.state = 'abandoned';
  run.ended = tick();
  run.results = null;
  run.outcome = 'abandoned';
  hist(sub, 'Run ' + run.id + ' abandoned — its checks were discarded');
  recomputeStatus(sub);
  return run;
}

/* Builds the run state a vendor would have arrived at by working every scenario
   through to the end. Used only to seed the prototype's run history, so the
   sealed runs on screen have real checks behind them. */
function seededBrunoResults(model, mode){
  const run = {model, mode, results: brunoRunState(model)};
  run.results.scenarios.forEach(s => {
    const key = s.area + '/' + s.scenario;
    for (const task of s.tasks){
      if (!task.step || task.outOfScope) continue;
      const c = runCheck(run, key, task.n);
      if (c && c.st === 'fail') break;   /* the collection's own dependency behaviour */
    }
  });
  return run.results;
}
function assessmentResults(mode){
  const groups = ASSESSMENT_RESULTS.map(g => ({
    domain:g.domain, resource:g.resource,
    emptyResource: mode === 'pass' ? false : !!g.emptyResource,
    elements: g.elements.map(e => mode === 'pass'
      ? Object.assign({}, e, {st:'pass', observed: e.st === 'pass' ? e.observed : e.expected,
          why: e.st === 'pass' ? e.why : ''})
      : Object.assign({}, e))
  }));
  return {kind:'assessments', groups};
}
function resultTally(r){
  if (!r) return {pass:0, fail:0, notAttempted:0, total:0, unit:'scenarios'};
  if (r.kind === 'bruno'){
    let pass = 0, fail = 0, notAttempted = 0;
    r.scenarios.forEach(s => {
      const checked = s.tasks.filter(t => t.check);
      if (!checked.length) notAttempted++;
      else if (checked.some(t => t.check.st === 'fail')) fail++;
      else pass++;
    });
    return {pass, fail, notAttempted, total:r.scenarios.length, unit:'scenarios'};
  }
  let pass = 0, fail = 0;
  r.groups.forEach(g => g.elements.forEach(e => e.st === 'pass' ? pass++ : fail++));
  return {pass, fail, notAttempted:0, total:pass + fail, unit:'element checks'};
}

/* ---------- mapping tool: model ----------
   Pure functions over a MappingDoc. None of them touch APP or the DOM. */
function normalizeType(raw){
  const s = String(raw == null ? '' : raw).trim().toLowerCase();
  const type = DATA_TYPES.find(t => t.toLowerCase() === s) || TYPE_ALIASES[s] || null;
  return {type, corrected: !!type && type.toLowerCase() !== s};
}
function targetByPath(path){ return EDFI_V5_TARGETS.find(t => t.path === path); }
function resolveTargets(completeName){
  const parts = String(completeName == null ? '' : completeName).trim().split('/')
    .map(s => s.trim()).filter(Boolean);
  return {paths: parts.filter(p => targetByPath(p)), unresolved: parts.filter(p => !targetByPath(p))};
}
function descriptorTypeName(raw){
  const s = String(raw || '').trim();
  return DESCRIPTOR_TYPE_ALIASES[s] || (/Descriptor$/.test(s) ? s : s + 'Descriptor');
}
function emptyMappingDoc(){
  const doc = {product:{name:'', namespace:'', description:''}, assessments:[],
    bank:{types:[], values:[]}, elements:[], issueNotes:{}, orphanNotes:[], importReport:null};
  STANDARD_DESCRIPTORS.forEach(d => {
    doc.bank.types.push({type:d.type, definition:d.definition});
    d.values.forEach(v => doc.bank.values.push({id:uid('mval'), type:d.type, ns:'edfi',
      uri:'uri://ed-fi.org/' + d.type + '#' + v.code, code:v.code, short:v.short, desc:'', enabled:false}));
  });
  return doc;
}
/* Turn on a standard value named by its full uri. Returns the value, or null. */
function enableStandardByUri(doc, uri, report){
  const v = doc.bank.values.find(x => x.ns === 'edfi' && x.uri === uri);
  if (v && !v.enabled){ v.enabled = true; if (report) report.standardEnabled++; }
  return v || null;
}
function parseWorkbook(wb){
  const tabs = (wb && wb.tabs) || {};
  const errors = [];
  Object.keys(WB_REQUIRED_COLS).forEach(name => {
    const rows = tabs[name];
    if (!rows){ errors.push('Tab "' + name + '" is missing.'); return; }
    const head = rows[0] || [];
    WB_HEADERS[name].slice(0, WB_REQUIRED_COLS[name]).forEach(col => {
      if (!head.includes(col)) errors.push('Tab "' + name + '": expected column "' + col + '".');
    });
  });
  if (errors.length) return {ok:false, errors};

  const doc = emptyMappingDoc();
  const report = {source:'workbook', resolved:0, needsTarget:0, typesCorrected:0, valuesAdded:0,
    standardEnabled:0, placeholders:[]};
  const body = name => tabs[name].slice(1).filter(r => r.some(c => String(c == null ? '' : c).trim()));
  const col = (name, row, header) => {
    const i = tabs[name][0].indexOf(header);
    return i < 0 ? '' : String(row[i] == null ? '' : row[i]).trim();
  };

  const prod = body('Product')[0] || [];
  doc.product = {name:col('Product', prod, 'Vendor Product'), namespace:col('Product', prod, 'Namespace'),
    description:col('Product', prod, 'Description')};

  body('Assessments').forEach(r => {
    const c = h => col('Assessments', r, h);
    const a = {id:uid('masm'), type:c('Assessment Type'), description:c('Description'),
      title:c('assessmentTitle'), identifier:c('assessmentIdentifier'),
      adaptive:c('adaptiveAssessment') === '1' || /^true$/i.test(c('adaptiveAssessment')),
      category:c('assessmentCategoryDescriptor'), family:c('assessmentFamily'), maxRawScore:c('maxRawScore')};
    doc.assessments.push(a);
    if (/^uri:\/\/ed-fi\.org\//.test(a.category)) enableStandardByUri(doc, a.category, report);
  });

  body('EnumerationDefinitions').forEach(r => {
    const type = descriptorTypeName(col('EnumerationDefinitions', r, 'Enumeration'));
    if (!doc.bank.types.some(t => t.type === type))
      doc.bank.types.push({type, definition:col('EnumerationDefinitions', r, 'Definition')});
  });

  body('EnumerationItems').forEach(r => {
    const c = h => col('EnumerationItems', r, h);
    const type = descriptorTypeName(c('Enumeration'));
    const code = c('Code Value');
    if (code === 'CustomValue'){
      if (!report.placeholders.includes(type)) report.placeholders.push(type);
      return;
    }
    if (/^uri:\/\/ed-fi\.org\//.test(code)){ enableStandardByUri(doc, code, report); return; }
    if (!doc.bank.types.some(t => t.type === type)) doc.bank.types.push({type, definition:''});
    doc.bank.values.push({id:uid('mval'), type, ns:'vendor', uri:doc.product.namespace + type + '#' + code,
      code, short:c('Short Description'), desc:c('Description'), enabled:true});
    report.valuesAdded++;
  });

  const asmFor = t => doc.assessments.find(a => a.type === t) ||
    doc.assessments.find(a => t.includes(a.type)) || null;
  body('ElementDefinitions').forEach(r => {
    const c = h => col('ElementDefinitions', r, h);
    const rawType = c('Data Type');
    const nt = normalizeType(rawType);
    const complete = c('Ed-Fi ODS/API Element Complete Name');
    const res = resolveTargets(complete);
    const corrections = [];
    if (nt.corrected){ corrections.push(rawType + ' → ' + nt.type); report.typesCorrected++; }
    const m = /"assessmentReportingMethodDescriptor"\s*:\s*"([^"]+)"/.exec(String(r[7] || ''));
    let key = null;
    if (m){
      key = /^uri:\/\/ed-fi\.org\//.test(m[1]) ? enableStandardByUri(doc, m[1], report)
        : doc.bank.values.find(v => v.uri === m[1]) || null;
    }
    const name = c('Element');
    const isObjective = res.paths.some(p => /^(studentO|o)bjectiveAssessment\./.test(p));
    let objective = null;
    if (isObjective){
      objective = key && name.toLowerCase().endsWith(key.code.toLowerCase())
        ? name.slice(0, name.length - key.code.length).trim() : name;
    }
    const targets = res.paths.map(path => ({path,
      entryKey: SCORE_COLLECTIONS.includes(path) && key ? key.id : null}));
    const firstDesc = res.paths.map(targetByPath).find(t => t.type === 'Descriptor');
    const asm = asmFor(c('Assessment Type'));
    doc.elements.push({id:uid('mel'), assessmentId:asm ? asm.id : null, objective, name,
      definition:c('Definition'), type:nt.type,
      enumType: nt.type === 'Enumeration' && firstDesc ? firstDesc.descriptor : null,
      targets, notes:'',
      importNote:{originalTarget:complete, unresolved:res.unresolved, corrections}});
    if (res.unresolved.length) report.needsTarget++; else report.resolved++;
  });

  doc.importReport = report;
  return {ok:true, doc, report};
}

/* ---------- derived state ---------- */
/* D26 — product identity is the application record, so a product lookup is an
   application lookup. `productId` on a submission or run is an application id. */
const product = id => APP.applications.find(p => p.id === id);
const certStarted = appId => APP.submissions.some(s => s.productId === appId);
/* §8 / D22 — a product may hold one open submission per certification model. */
const openModels = appId => APP.submissions.filter(s => s.productId === appId &&
  !['approved','rejected'].includes(s.status)).map(s => s.model);
const startableModels = appId => Object.values(MODELS)
  .filter(m => !openModels(appId).includes(m.id));
const submission = id => APP.submissions.find(s => s.id === id);
const run = id => APP.runs.find(r => r.id === id);
const runsFor = sub => APP.runs.filter(r => r.submissionId === sub.id)
  .sort((a,b) => new Date(b.started) - new Date(a.started));
/* An open run is the vendor's workspace, so the queue holds sealed ones. A
   reviewer may opt in to give feedback on work in progress (ID8). An abandoned
   run has no results and is never shown. */
function reviewerRuns(sub, includeOpen){
  return runsFor(sub).filter(r => r.state !== 'abandoned' &&
    (includeOpen || r.state === 'sealed' || r.state === 'completed'));
}
/* A Bruno run is open until sealed; Assessments keeps queued/running/completed. */
const runStateBadge = r =>
  r.state === 'open'      ? '<span class="badge b-amber">Open</span>' :
  r.state === 'sealed'    ? '<span class="badge b-green">Sealed</span>' :
  r.state === 'abandoned' ? '<span class="badge b-red">Abandoned</span>' :
  '<span class="badge">' + esc(r.state.charAt(0).toUpperCase() + r.state.slice(1)) + '</span>';
const currentVersion = (sub, type) => {
  const list = sub.artifacts[type];
  return list && list.length ? list[list.length - 1] : null;
};
const mySubmissions = () => APP.submissions.filter(s => !product(s.productId).foreign);

/* FR13 — deterministic readiness gate. */
/* A finished run stamped Complete. Bruno models finish by sealing; Assessments
   finishes on its own. An open run is still being worked and an abandoned one
   has no results, so neither qualifies. */
const isFinished = r => r.state === 'sealed' || r.state === 'completed';
const isQualifying = r => r.completeness === 'Complete' &&
  (r.state === 'sealed' || r.state === 'completed');
function gate(sub){
  const missing = ARTIFACTS.filter(a => !currentVersion(sub, a.id));
  const qualifying = runsFor(sub).find(isQualifying);
  return {missing, qualifying, artifactsComplete: missing.length === 0,
          met: missing.length === 0 && !!qualifying};
}
/* §8.1 — completeness is decided from artifacts alone, at run start. */
const wouldStamp = sub => gate(sub).artifactsComplete ? 'Complete' : 'Incomplete';
/* D22 as revised (ID6) — one check executing per environment at a time. An open
   run is idle between checks, so it does not hold the slot; blocking a product
   for the days a SIS run takes would serialize independent certifications for no
   benefit. A prototype check is synchronous, so no Bruno run is ever mid-check
   when this is read; a real executor would also test for that. */
const busyEnv = env => APP.runs.find(r => r.env === env &&
  (r.state === 'queued' || r.state === 'running'));
/* FR11 — a run is stale when its pinned versions are no longer current. */
function isStale(sub, r){
  return ARTIFACTS.some(a => {
    const cur = currentVersion(sub, a.id);
    return (cur ? cur.v : null) !== (r.pinned ? r.pinned[a.id] : null);
  });
}
const hasUnseenChanges = sub => !!(sub.artifactsChangedAt && sub.reviewerSeenAt &&
  new Date(sub.artifactsChangedAt) > new Date(sub.reviewerSeenAt));

function recomputeStatus(sub){
  if (['inreview','changes','approved','rejected'].includes(sub.status)) return;
  const g = gate(sub);
  const anything = ARTIFACTS.some(a => currentVersion(sub, a.id)) || runsFor(sub).length > 0;
  const next = g.met ? 'ready' : (anything ? 'incomplete' : 'draft');
  if (next !== sub.status){
    sub.status = next;
    hist(sub, next === 'ready'
      ? 'Status changed to Ready for Review (readiness gate met)'
      : 'Status changed to ' + STATUS[next].label + ' (readiness gate not met)', 'Platform');
  }
}

/* ---------- actions ---------- */

/* FR5 — starting certification from an application registers it as a product and
   opens a Draft submission for the chosen model (§8). Nothing about the
   application is copied or re-entered; the submission points at it. */
function startCertification(appId, model){
  const sub = mkSubmission({productId:appId, model, status:'draft',
    artifacts:artifactSet([]), created:tick()});
  hist(sub, 'Submission created — certification started from application ' +
    product(appId).name + ' (' + MODELS[model].label + ')');
  return sub;
}

function uploadArtifact(sub, type, name, malformed){
  if (type === 'mapping' && malformed){
    hist(sub, 'Vendor mapping CSV upload rejected — structural validation failed (' + name + ')');
    return {ok:false, errors:[
      'Row 1: required column "EdFiResource" is missing.',
      'Row 1: unexpected column "Resource Name" — not in the published template.',
      'Row 14: "EdFiElement" is empty but "VendorField" is populated.',
      'Row 22: "IsRequired" must be TRUE or FALSE; found "yes".'
    ]};
  }
  const list = sub.artifacts[type];
  const replacing = list.length > 0;
  list.push({v:list.length + 1, name, by:me(), at:tick()});
  const label = ARTIFACTS.find(a => a.id === type).label;
  hist(sub, (replacing
    ? 'Artifact replaced: ' + label + ' → v' + list.length + ' (' + name + ')'
    : 'Artifact uploaded: ' + label + ' v1 (' + name + ')') +
    (type === 'mapping' ? ' — structural validation passed' : ''));
  sub.artifactsChangedAt = tick();
  recomputeStatus(sub);
  return {ok:true};
}

function startRun(sub, outcomeMode){
  const m = MODELS[sub.model];
  const r = {
    id:uid('run'), submissionId:sub.id, productId:sub.productId, model:sub.model,
    state:'queued', outcome:null, completeness:wouldStamp(sub),
    pinned:{}, tag:m.tag, sha:m.sha, initiator:me(), env:product(sub.productId).env,
    started:tick(), ended:null, results:null, mode:outcomeMode
  };
  ARTIFACTS.forEach(a => { const c = currentVersion(sub, a.id); r.pinned[a.id] = c ? c.v : null; });
  /* A Bruno run is worked through by the vendor, so it opens and waits. An
     Assessments run is a batch the platform executes, so it keeps its timers. */
  if (MODELS[sub.model].kind === 'bruno'){
    r.state = 'open';
    r.results = brunoRunState(sub.model);
    APP.runs.push(r);
    hist(sub, 'Run opened — ' + m.label + ' — stamped ' + r.completeness +
      '. Check each task as its data lands.');
    return r;
  }
  APP.runs.push(r);
  hist(sub, 'Run started — ' + m.label + ' — stamped ' + r.completeness +
    (r.completeness === 'Incomplete'
      ? ' (' + gate(sub).missing.map(a => a.label).join(', ') + ' missing)' : ''));
  setTimeout(() => { if (r.state === 'queued'){ r.state = 'running'; render(); } }, 1400);
  setTimeout(() => finishRun(r), 5200);
  return r;
}
function finishRun(r){
  if (r.state === 'completed') return;
  if (MODELS[r.model].kind === 'bruno') return;   /* Bruno runs seal, they do not finish */
  const sub = submission(r.submissionId);
  r.state = 'completed';
  r.ended = tick();
  if (r.mode === 'infra'){
    r.outcome = 'infra-error';
    hist(sub, 'Run ' + r.id + ' failed — infrastructure error (executor could not reach ' + r.env + ')', 'Platform');
  } else if (r.mode === 'auth'){
    r.outcome = 'auth-error';
    hist(sub, 'Run ' + r.id + ' failed — authentication error (401 from environment ' + r.env + ')', 'Platform');
  } else {
    const mode = r.mode === 'pass' ? 'pass' : 'realistic';
    r.results = assessmentResults(mode);   /* Bruno runs returned above */
    const t = resultTally(r.results);
    r.outcome = t.fail === 0 ? 'passed' : 'failed';
    hist(sub, 'Run ' + r.id + ' completed — ' + r.completeness + ' — ' +
      (t.fail === 0 ? 'all ' + t.unit + ' passed' : t.fail + ' of ' + t.total + ' ' + t.unit + ' failed'), 'Platform');
  }
  recomputeStatus(sub);
  render();
}

function reviewerOpen(sub){
  sub.reviewerSeenAt = tick();
  if (sub.status === 'ready'){ sub.status = 'inreview'; hist(sub, 'Status changed to In Review'); }
}
function requestChanges(sub, text){
  sub.comments.push({by:me(), at:tick(), text});
  sub.status = 'changes';
  sub.reviewerSeenAt = tick();
  hist(sub, 'Changes requested with comment');
}
function decide(sub, kind, reason){
  sub.status = kind;
  sub.decision = {kind, by:me(), at:tick(), reason:reason || ''};
  hist(sub, (kind === 'approved' ? 'Approved' : 'Rejected') + (reason ? ' — ' + reason : ''));
}

        <tbody>${rows.map(p => {
          const subs = APP.submissions.filter(s => s.productId === p.id);
          return `<tr>
            <td><a href="#/application/${p.id}">${esc(p.name)}</a></td>
            <td>${esc(p.vendor)}</td>
            <td><span class="tag">${esc(p.ods)}</span></td>
            <td>${esc(p.claimset)}</td>
            <td class="act">${certButton(p, subs)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <div class="card"><h2>What the button does</h2>
      <div class="muted">Starting a certification registers this application as a product under
        <a href="#/products">My products</a> and opens a <strong>Draft</strong> submission for the
        certification model you pick. The product's name, vendor, environment and ODS are the
        application's own &mdash; they are never re-entered, and a certification cannot be pointed at an
        application Ed-Fi did not provision (D6, D26). A single application may certify against more than
        one model at a time (§8, D22).</div></div>`;
}

/* The green button in the Certification column. One button per application,
   regardless of how many models are in flight. */
function certButton(p, subs){
  if (!subs.length) return `<button class="btn sm" data-act="startcert" data-app="${p.id}">
    Start Certification</button>`;
  const labels = subs.map(s => MODELS[s.model].label).join(', ');
  return `<button class="btn sm" data-act="viewcert" data-app="${p.id}"
    title="${esc(labels)}">View Certification</button>`;
}

/* Read-only application detail — mirrors the existing Admin App screen, with the
   certification action added alongside the page's own buttons. */
function vendorApplication(id){
  const p = product(id);
  if (!p || p.foreign) return placeholder('Application');
  const subs = APP.submissions.filter(s => s.productId === p.id);
  const f = (k, v) => `<div><div class="k">${k}</div><div class="v">${v || '&ndash;'}</div></div>`;

      ['Tenants', '#/env'], ['default', '#/env'], ['Applications', '#/applications'], [p.name]]) + `
    <div class="pagehead">
      <div><h1>${esc(p.name)}</h1></div>
      <div class="acts">
        ${certButton(p, subs)}
        <button class="btn ghost sm" data-act="viewartifact">&#9906; Manage creds</button>
        <button class="btn ghost sm" data-act="viewartifact">&#9998; Edit</button>
        <button class="btn ghost sm" data-act="viewartifact">&#9003; Delete</button>
      </div>
    </div>
    <div class="card">
      <div class="summary" style="border-bottom:0;padding-bottom:0;margin-bottom:0;gap:40px">
        ${f('Application name', esc(p.name))}
        ${f('ODS', '<span class="tag">' + esc(p.ods) + '</span>')}
        ${f('Vendor', esc(p.vendor))}
        ${f('Profiles', '')}
        ${f('Claimset', esc(p.claimset))}
        ${f('Ed-org', esc(p.edorg))}

      </div>

    <div class="card"><h2>Certification<span class="hint">D26 &mdash; this application is the
