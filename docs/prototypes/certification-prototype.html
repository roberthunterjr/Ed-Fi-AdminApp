        <thead><tr><th>Model</th><th>Status</th><th class="act"></th></tr></thead>
        <tbody>${subs.map(s => `<tr><td>${esc(MODELS[s.model].label)}</td>
          <td>${badge(s.status)}</td>
          <td class="act"><a href="#/submission/${s.id}">Open submission</a></td></tr>`).join('')}
        </tbody></table>`
      : `<div class="empty">No certification started for this application yet.</div>`}
    </div>`;
}

function vendorRunHistory(){
  const rows = APP.runs.filter(r => !product(r.productId).foreign)
    .sort((a,b) => new Date(b.started) - new Date(a.started));
  return crumbs([['Home', '#/products'], ['Run history']]) + `
    <div class="pagehead"><div><h1>Run history</h1>
      <div class="sub">Every run across every product. Immutable (FR11).</div></div></div>
    <div class="card">${runTable(rows, {showProduct:true, sub:null})}</div>`;
}

function vendorSubmission(id){
  const sub = submission(id);
  if (!sub) return placeholder('Submission');
  const p = product(sub.productId), g = gate(sub), m = MODELS[sub.model];
  const runs = runsFor(sub);
  const busy = busyEnv(product(sub.productId).env);
  return crumbs([['Home', '#/products'], ['My products', '#/products'],
      [p.name, '#/application/' + p.id], [m.label]]) + `
    <div class="pagehead">
      <div><h1>${esc(m.label)} certification</h1>
        <div class="sub"><a href="#/application/${p.id}">${esc(p.name)}</a> &middot; ${esc(p.vendor)}
          &middot; <span class="tag">${esc(p.env)}</span>
          &middot; <span class="tag">${esc(p.ods)}</span></div></div>
      <div class="acts">
        <button class="btn ghost sm" data-act="export">&#8682; Export</button>
        <button class="btn" data-act="gotorun" data-sub="${sub.id}">Start a certification run</button>
      </div>
    </div>
    ${statusBanner(sub, g, busy)}
    <div class="card">
      <div class="summary">
        <div><div class="k">Status</div><div class="v">${badge(sub.status)}</div></div>
        <div><div class="k">Cleared by</div><div class="v">${esc(STATUS[sub.status].who)}</div></div>
        <div><div class="k">Created</div><div class="v">${fmt(sub.created)}</div></div>
        <div><div class="k">Current qualifying run</div><div class="v">${
          g.qualifying ? `<a href="#/run/${g.qualifying.id}">${esc(g.qualifying.id)}</a>` : 'None'}</div></div>
        <div><div class="k">Scenario version</div><div class="v"><span class="tag">${esc(m.tag)}</span></div></div>
      </div>
      ${artifactCard(sub, false)}
    </div>
    ${sub.comments.length ? `<div class="card"><h2>Reviewer comments</h2>${
      sub.comments.map(c => `<div class="banner orange" style="border-left-color:var(--amber);background:var(--amber-bg)">
        <h3>${esc(c.by)} <span class="muted" style="font-weight:400">${fmt(c.at)}</span></h3>
        <p>${esc(c.text)}</p></div>`).join('')}</div>` : ''}
    <div class="card">
      <div class="cardhead"><h2>Certification runs</h2>
        <div class="right">
          <label class="muted" style="font-size:12.5px">
            <input type="checkbox" id="showTrial" ${APP.showTrial ? 'checked' : ''} /> Show trial runs
          </label>
        </div>
      </div>
      ${runTable(APP.showTrial ? runs : runs.filter(r => r.completeness === 'Complete'), {sub})}
      ${!APP.showTrial && runs.some(r => r.completeness === 'Incomplete')
        ? `<div class="muted" style="margin-top:12px;font-size:12.5px">${
            runs.filter(r => r.completeness === 'Incomplete').length} trial run(s) hidden.
            Trial runs show the same result detail; they are simply not admissible for review (§8.1).</div>` : ''}
    </div>
    ${historyCard(sub)}`;
}

function statusBanner(sub, g, busy){
  if (sub.status === 'approved' || sub.status === 'rejected'){
    const ok = sub.status === 'approved';
    return `<div class="banner ${ok ? 'green' : 'red'}">
      <h3>${badge(sub.status)} ${ok ? 'Certification approved' : 'Certification rejected'}</h3>
      <p>${esc(sub.decision.by)} on ${fmt(sub.decision.at)}.${
        sub.decision.reason ? ' Reason: ' + esc(sub.decision.reason) : ''}
        This submission is terminal.</p></div>`;
  }
  if (sub.status === 'changes'){
    return `<div class="banner amber"><h3>${badge('changes')} The reviewer has asked for changes</h3>
      <p>Replace the artifacts named in the comment below, then start a new run. No intermediate
      approval step is needed (FR14).</p></div>`;
  }
  if (sub.status === 'inreview'){
    return `<div class="banner indigo"><h3>${badge('inreview')} A reviewer is looking at this now</h3>
      <p>You may still replace artifacts. The reviewer will see an indicator that something changed
      since they last looked (FR16).</p></div>`;
  }
  if (g.met){
    const qFailed = g.qualifying.outcome !== 'passed';
    return `<div class="banner green"><h3>${badge('ready')} All gate conditions met</h3>
      <p>All three required artifact types are present and run
      <a href="#/run/${g.qualifying.id}">${esc(g.qualifying.id)}</a> is a finished run stamped
      <strong>Complete</strong>. Waiting on an Ed-Fi reviewer to pick it up.</p>
      ${qFailed ? `<p><strong>Note:</strong> that run reported failures. The gate asks only whether a
        finished Complete run exists, not whether it passed (D25) — so this submission is visible to a
        reviewer, and the reviewer decides whether the failures are disqualifying. You may keep fixing and
        re-running in the meantime.</p>` : ''}</div>`;
  }
  const bullets = [];
  g.missing.forEach(a => bullets.push('<strong>Missing artifact:</strong> ' + esc(a.label) +
    ' <span class="muted">— ' + esc(a.validation) + '</span>'));
  if (g.artifactsComplete && !g.qualifying){
    bullets.push('<strong>No qualifying run:</strong> artifacts are complete, but no finished run stamped ' +
      '<em>Complete</em> exists yet. Start one more run — earlier runs stay <em>Incomplete</em> ' +
      'because they did not execute against the package as it now stands (D14).');
  }
  return `<div class="banner amber">
    <h3>${badge(sub.status)} ${sub.status === 'draft' ? 'Assembling artifacts' : 'Not yet ready for review'}</h3>
    <p>The readiness gate is a deterministic rules check (FR13). Unmet conditions:</p>
    <ul>${bullets.map(b => '<li>' + b + '</li>').join('')}</ul>
    ${busy ? `<p class="muted">Run ${esc(busy.id)} is executing now and holds this product’s
      single execution slot (D22).</p>` : ''}
  </div>`;
}

function artifactCard(sub, reviewerView){
  return `<h2>Required artifacts <span class="hint">All three gate <em>review</em>, not execution (§9).</span></h2>
    <table class="t">
      <thead><tr><th>Artifact</th><th>Current version</th><th>Uploaded by</th><th>Uploaded</th>
        <th>Validated on upload</th><th class="act">Action</th></tr></thead>
      <tbody>${ARTIFACTS.map(a => {
        const cur = currentVersion(sub, a.id);
        const versions = sub.artifacts[a.id].length;
        return `<tr>
          <td><strong>${esc(a.label)}</strong><div class="muted" style="font-size:12px">${esc(a.note)}</div></td>
          <td>${cur ? `v${cur.v} <span class="muted">${esc(cur.name)}</span>${
              versions > 1 ? `<div class="muted" style="font-size:12px">${versions} versions — prior versions retained in audit history</div>` : ''}`
            : '<span class="badge b-amber">Missing</span>'}</td>
          <td class="muted">${cur ? esc(cur.by) : '—'}</td>
          <td class="muted nowrap">${cur ? fmtShort(cur.at) : '—'}</td>
          <td class="muted">${esc(a.validation)}</td>
          <td class="act">${reviewerView
            ? (cur ? '<button class="btn ghost sm" data-act="viewartifact">View</button>' : '<span class="muted">—</span>')
            : `<button class="btn sm" data-act="upload" data-sub="${sub.id}" data-type="${a.id}">${
                cur ? 'Replace' : 'Upload'}</button>`}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    ${reviewerView ? `<div class="muted" style="margin-top:12px;font-size:12.5px">
      Reviewers do not upload artifacts on a vendor’s behalf (§8).</div>` : ''}`;
}

function runTable(rows, opts){
  opts = opts || {};
  if (!rows.length) return '<div class="empty">No runs yet.</div>';
  return `<table class="t">
    <thead><tr>
      ${opts.showProduct ? '<th>Product</th>' : ''}
      <th>Run</th><th>Scenario set</th><th>Completeness</th><th>State / outcome</th>
      <th>Pinned artifacts</th><th>Tag &middot; SHA</th><th>Started by</th><th class="act"></th>
    </tr></thead>
    <tbody>${rows.map(r => {
      const sub = submission(r.submissionId);
      const stale = opts.sub ? isStale(opts.sub, r) : isStale(sub, r);
      return `<tr>
        ${opts.showProduct ? `<td>${esc(product(r.productId).name)}</td>` : ''}
        <td><a href="#/run/${r.id}" class="mono">${esc(r.id)}</a>
          ${stale && isFinished(r) ? '<div class="badge b-gray stale">Stale — artifacts have changed since</div>' : ''}</td>
        <td>${esc(MODELS[r.model].label)}</td>
        <td>${completenessBadge(r.completeness)}</td>
        <td>${runStateHTML(r)}${(() => {
          if (!r.results || r.results.kind !== 'bruno') return '';
          const t2 = resultTally(r.results);
          return `<div class="muted" style="font-size:12px">${t2.pass} passed, ${t2.fail} failed` +
            (t2.notAttempted ? `, ${t2.notAttempted} not attempted` : '') + '</div>';
        })()}</td>
        <td class="mono muted">${ARTIFACTS.map(a =>
          a.id + ':' + (r.pinned && r.pinned[a.id] ? 'v' + r.pinned[a.id] : '—')).join('<br/>')}</td>
        <td><span class="tag">${esc(r.tag)}</span><div class="mono muted">${esc(r.sha)}</div></td>
        <td class="muted">${esc(r.initiator)}<div style="font-size:12px">${fmtShort(r.started)}
          ${r.ended ? ' · ' + dur(r.started, r.ended) : ''}</div></td>
        <td class="act"><a href="#/run/${r.id}">Results</a></td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  <div class="pager"><button>&laquo;</button><button>&lsaquo;</button>
    <span>1 of 1</span><button>&rsaquo;</button><button>&raquo;</button>
    <select><option>Show 10</option><option>Show 25</option></select></div>
  <div class="legend">
    <span class="badge b-green">Complete</span>
    <span class="badge b-amber">Incomplete &middot; trial run</span>
    <span class="badge b-gray">Stale — pinned versions superseded</span>
    <span class="muted" style="font-size:12.5px">Designations are fixed at run start and never recalculated (D14).</span>
  </div>`;
}

function runStateHTML(r){
  if (r.state === 'queued')  return '<span class="dotstate">Queued</span>';
  if (r.state === 'running') return '<span class="dotstate run"><i></i>Running…</span>';
  if (r.state === 'open')    return '<span class="dotstate run"><i></i>Open — checking in progress</span>';
  if (r.state === 'abandoned') return '<span class="dotstate">Abandoned</span>';
  const map = {
    passed:['ok','All checks passed'],
    failed:['bad','Checks failed'],
    'infra-error':['warn','Infrastructure error'],
    'auth-error':['warn','Authentication failure']
  }[r.outcome] || ['','Completed'];
  return `<span class="dotstate ${map[0]}"><i></i>${esc(map[1])}</span>`;
}

function historyCard(sub){
  return `<div class="card"><h2>Audit history
    <span class="hint">Append-only; actor and timestamp on every entry (FR17).</span></h2>
    <ul class="hist">${sub.history.map(h => `<li>
      <span class="when">${fmtShort(h.at)}</span>
      <span>${esc(h.what)}</span>
      <span class="who">${esc(h.who)}</span></li>`).join('')}</ul></div>`;
}

/* ---- start-a-run screen: keeps the existing Request Certification layout ---- */
function vendorNewRun(id){
  const sub = submission(id);
  if (!sub) return placeholder('Start a run');
  const p = product(sub.productId), m = MODELS[sub.model], g = gate(sub);
  const busy = busyEnv(product(sub.productId).env);
  const mapping = currentVersion(sub, 'mapping');
  const assessmentsBlocked = m.kind === 'assessments' && !mapping;
  const stamp = wouldStamp(sub);
  const blocked = !!busy || assessmentsBlocked;

  let precondition = '';
  if (busy){
    precondition = `<div class="banner red"><h3>Another run is holding this product’s execution slot</h3>
      <p>Run <a href="#/run/${busy.id}">${esc(busy.id)}</a> (${esc(MODELS[busy.model].label)}, started by
      ${esc(busy.initiator)} at ${fmtShort(busy.started)}) is ${esc(busy.state)}. Only one run per product may
      execute at a time, across all certification models (D22). Submissions may still be open concurrently.</p></div>`;
  } else if (assessmentsBlocked){
    precondition = `<div class="banner red"><h3>Assessments validation needs a mapping CSV first</h3>
      <p>This is not the generic artifact gate. The mapping CSV is the input that tells the validator
      <em>which resources and elements to check</em>, so without it there is nothing to validate against (D15).
      Sample data and product documentation are <strong>not</strong> required to start an Assessments run.</p>
      <p><button class="btn sm" data-act="upload" data-sub="${sub.id}" data-type="mapping">Upload mapping CSV</button></p></div>`;
  } else {
    precondition = `<div class="banner ${stamp === 'Complete' ? 'green' : 'amber'}">
      <h3>This run will be stamped ${completenessBadge(stamp)}</h3>
      <p>${stamp === 'Complete'
        ? 'All required artifact types are present, so the run qualifies for the readiness gate (FR13).'
        : 'Missing at start: <strong>' + g.missing.map(a => esc(a.label)).join(', ') +
          '</strong>. Results will be real and fully displayed, but the run cannot make this submission ' +
          'Ready for Review. Uploading the missing artifacts later does not upgrade it (§8.1).'}</p>
      <p class="muted">The designation is assigned once, at start, and pinned to the artifact versions present
      right now: ${ARTIFACTS.map(a => { const c = currentVersion(sub, a.id);
        return esc(a.label) + ' ' + (c ? 'v' + c.v : '—'); }).join(' · ')}</p></div>`;
  }

  /* The Prepare panel is where a vendor actually works a scenario, so it needs an
     open run to record checks against. */
  const openRun = runsFor(sub).find(r => r.state === 'open');
  const scenarioTable = m.kind === 'bruno' ? `
    <div class="card">
      <div class="cardhead"><h2>Scenarios</h2>
        <div class="right muted" style="font-size:12.5px">${COLLECTION[sub.model].length} scenarios in
          <span class="tag">${esc(m.tag)}</span></div></div>
      <div class="tools">
        <div class="search"><input placeholder="Search" id="scenSearch" /></div>
        <button class="linkish">More options</button>
        <span class="chip">Area or group filter
          <select id="areaFilter">
            <option value="">All area or group values</option>
            ${[...new Set(COLLECTION[sub.model].map(s => s[0]))].map(a =>
              `<option ${APP.areaFilter === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select></span>
      </div>
      <table class="t">
        <thead><tr><th>Area or group</th><th>Scenario</th><th>Steps</th><th>Verified</th>
          <th class="act">Action</th></tr></thead>
        <tbody>${COLLECTION[sub.model]
          .filter(s => !APP.areaFilter || s[0] === APP.areaFilter)
          .map(([area, scenario, steps]) => {
            const key = area + '/' + scenario;
            const scen = openRun ? scenarioOf(openRun, key) : null;
            const checkable = scen ? scen.tasks.filter(x => x.step && !x.outOfScope).length : 0;
            const done = scen ? scen.tasks.filter(x => x.check && x.check.st === 'pass').length : 0;
            return `<tr>
            <td>${esc(area)}</td><td>${esc(scenario)}</td>
            <td class="muted">${steps.length}</td>
            <td class="muted">${scen ? done + ' of ' + checkable : '—'}</td>
            <td class="act">${openRun
              ? `<button class="btn sm" data-act="openprepare" data-run="${esc(openRun.id)}"
                   data-key="${esc(key)}">Prepare</button>`
              : `<button class="btn sm" disabled title="Start a run to begin checking">Prepare</button>`}
            </td></tr>`;
          }).join('')}</tbody>
      </table>
      <div class="pager"><button>&laquo;</button><button>&lsaquo;</button><span>1 of 1</span>
        <button>&rsaquo;</button><button>&raquo;</button>
        <select><option>Show 10</option><option>Show 25</option></select></div>
    </div>` : `
    <div class="card">
      <h2>In-scope resources <span class="hint">Read from the mapping CSV — the platform does not derive the mapping (§5).</span></h2>
      ${mapping ? `<div class="muted" style="margin-bottom:12px">From
        <strong>${esc(mapping.name)}</strong> (v${mapping.v}, uploaded ${fmtShort(mapping.at)} by ${esc(mapping.by)}).</div>
      <table class="t"><thead><tr><th>Domain</th><th>Resource</th><th>Declared elements</th><th>Checks</th></tr></thead>
        <tbody>${ASSESSMENT_RESULTS.map(g2 => `<tr>
          <td>${esc(g2.domain)}</td><td class="mono">${esc(g2.resource)}</td>
          <td>${g2.elements.length}</td>
          <td class="muted">presence &middot; descriptor validity &middot; value reconciliation</td></tr>`).join('')}</tbody>
      </table>
      <div class="muted" style="margin-top:12px;font-size:12.5px">GET requests only; no writes or updates (§5).
        A declared resource the environment returns nothing for is a run <em>failure</em>, not a refusal to
        run (D24).</div>`
      : '<div class="empty">No mapping CSV uploaded, so no resources are in scope.</div>'}
    </div>`;

  return crumbs([['Home', '#/products'], ['My products', '#/products'],
                 [p.name, '#/submission/' + sub.id], ['Start a run']]) + `
    <div class="pagehead">
      <div><h1>Request Certification</h1>
        <div class="sub">${esc(p.name)} &middot; ${esc(m.label)} &middot;
          environment <span class="tag">${esc(p.env)}</span></div></div>
      <div class="acts"><a class="btn ghost sm" href="#/submission/${sub.id}">Back to submission</a></div>
    </div>
    ${precondition}
    <div class="card">
      <div class="field"><label>Scenario set</label>
        <select id="modelSel">${Object.values(MODELS).map(x =>
          `<option value="${x.id}" ${x.id === sub.model ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</select>
        <div class="help">This submission is a ${esc(m.label)} submission. Switching the set here is
          illustrative only — in the product you would open that model’s submission.</div></div>
      <div class="field"><label>Environment credentials</label>
        <div class="muted">Resolved automatically from Admin App’s existing tenant-environment mechanism
          for <span class="tag">${esc(p.env)}</span> and handed to the executor out-of-band (D20, FR8).
          Client ID and secret are never displayed here, written to run logs, or included in run output.</div></div>
      <div class="field"><label>Scenarios version</label>
        <div>Tag <span class="tag">${esc(m.tag)}</span> &rarr; resolves to commit
          <span class="mono">${esc(m.sha)}</span></div>
        <div class="help">Runs execute a named tag promoted by the Product Owner; the resolved SHA is recorded
          on the run so it stays reproducible to an exact commit (D21).</div></div>
      <div class="field"><label>Simulated outcome <span class="muted">(prototype only)</span></label>
        <select id="outcomeSel">
          <option value="realistic">Realistic first run — some checks fail</option>
          <option value="pass">All checks pass</option>
          <option value="infra">Infrastructure error — executor cannot reach the environment</option>
          <option value="auth">Authentication failure — 401 from the environment</option>
        </select>
        <div class="help">Real runs have no such switch. It is here because FR8 requires scenario
          failures, infrastructure failures and authentication failures to be told apart. For a SIS
          or MTSS run the setting applies to every check in the run, so you can drive one open run
          down a single branch.</div></div>
      <div class="btnrow">
        <button class="btn" data-act="startrun" data-sub="${sub.id}" ${blocked ? 'disabled' : ''}>
          Start ${esc(m.label)} run</button>
        ${blocked ? `<span class="muted">${busy ? 'Blocked: run ' + esc(busy.id) + ' is still executing.'
          : 'Blocked: a valid mapping CSV is required.'}</span>` : ''}
      </div>
    </div>
    ${APP.prepare && openRun && APP.prepare.run === openRun.id
        ? preparePanelHTML(openRun, APP.prepare.key) +
          `<div style="margin:-6px 0 18px"><button class="linkish"
             data-act="closeprepare">Back to all scenarios</button></div>`
        : scenarioTable}`;
}

/* ---- run results ---- */
function runResults(id, reviewerView){
  const r = run(id);
  if (!r) return placeholder('Run');
  const sub = submission(r.submissionId), p = product(r.productId), m = MODELS[r.model];
  const t = resultTally(r.results);
  const stale = isStale(sub, r);
  const home = reviewerView ? '#/queue' : '#/products';
  const back = reviewerView ? '#/review/' + sub.id : '#/submission/' + sub.id;

  let body;
  if (r.state === 'abandoned'){
    body = `<div class="card"><h2>Execution result</h2>
      <div class="banner amber"><h3>Run abandoned</h3>
      <p>The vendor discarded this run, so its checks were not kept. Abandoning is the
      honest option when a run has gone the wrong way — forcing a seal would push a
      meaningless record into the review queue (ID5).</p></div></div>`;
  } else if (!isFinished(r) && r.state !== 'open'){
    body = `<div class="card"><h2>Execution</h2>
      <div class="banner blue"><h3>${runStateHTML(r)}</h3>
        <p>${r.state === 'queued'
          ? 'Queued — waiting for the executor. This product’s single execution slot is held by this run (D22).'
          : 'The executor is running ' + esc(m.tag) + ' against ' + esc(r.env) + '. Output is ingested and persisted, not just streamed (FR8).'}</p></div>
      <div class="muted">This page refreshes itself; no need to reload.</div></div>`;
  } else if (r.outcome === 'infra-error'){
    body = `<div class="card"><h2>Execution result</h2>
      <div class="banner red"><h3><span class="badge b-amber">Infrastructure error</span></h3>
      <p>The executor could not reach environment <span class="tag">${esc(r.env)}</span>
      (connection timed out after 30s). <strong>No scenarios were executed</strong>, so this is not a
      statement about the vendor’s integration. FR8 requires this to be distinguishable from a
      scenario failure and from an authentication failure.</p></div>
      <div class="muted">Recorded in run history like any other run. Nothing is deleted or retried silently.</div></div>`;
  } else if (r.outcome === 'auth-error'){
    body = `<div class="card"><h2>Execution result</h2>
      <div class="banner red"><h3><span class="badge b-amber">Authentication failure</span></h3>
      <p>The environment returned <strong>401 Unauthorized</strong> for the credentials resolved for
      <span class="tag">${esc(r.env)}</span>. Scenarios did not run. If the application credentials were
      regenerated, that rotation is recorded in audit history (FR5) so a failure after a rotation is explicable.</p>
      <p class="muted">Credential values are never shown here or written to run output (§13).</p></div></div>`;
  } else if (r.results && r.results.kind === 'bruno'){
    body = brunoResultsHTML(r);
  } else {
    body = assessmentResultsHTML(r);
  }

  return crumbs([['Home', home], [p.name, back], ['Run ' + r.id]]) + `
    <div class="pagehead">
      <div><h1>Run results</h1>
        <div class="sub">${esc(p.name)} &middot; ${esc(m.label)} &middot; run
          <span class="mono">${esc(r.id)}</span></div></div>
      <div class="acts"><a class="btn ghost sm" href="${back}">Back to submission</a></div>
    </div>
    ${r.completeness === 'Incomplete' ? `<div class="banner amber">
      <h3>${completenessBadge('Incomplete')} Trial run — not admissible as certification evidence</h3>
      <p>Artifacts missing when this run started: <strong>${ARTIFACTS.filter(a => !r.pinned[a.id])
        .map(a => esc(a.label)).join(', ') || 'none recorded'}</strong>.
      Results below carry the same level of detail as a qualifying run — they simply cannot satisfy the
      readiness gate (§8.1).</p></div>` : ''}
    ${stale ? `<div class="banner"><h3><span class="badge b-gray">Stale</span> Artifacts have changed since this run</h3>
      <p>This run pinned ${ARTIFACTS.map(a => esc(a.label) + ' ' +
        (r.pinned[a.id] ? 'v' + r.pinned[a.id] : '—')).join(', ')}. The submission now carries
        ${ARTIFACTS.map(a => { const c = currentVersion(sub, a.id);
          return esc(a.label) + ' ' + (c ? 'v' + c.v : '—'); }).join(', ')}.
        A reviewer should not treat it as evidence for artifacts it never saw (FR11).</p></div>` : ''}
    <div class="card">
      <div class="summary">
        <div><div class="k">Completeness</div><div class="v">${completenessBadge(r.completeness)}</div></div>
        <div><div class="k">Outcome</div><div class="v">${runStateHTML(r)}</div></div>
        <div><div class="k">Started by</div><div class="v">${esc(r.initiator)}</div></div>
        <div><div class="k">Started / ended</div><div class="v">${fmtShort(r.started)} →
          ${r.ended ? fmtShort(r.ended) : 'running'} <span class="muted">(${dur(r.started, r.ended)})</span></div></div>
        <div><div class="k">Environment</div><div class="v"><span class="tag">${esc(r.env)}</span></div></div>
        <div><div class="k">Tag &rarr; commit</div><div class="v"><span class="tag">${esc(r.tag)}</span>
          <span class="mono muted">${esc(r.sha)}</span></div></div>
        ${r.results ? `<div><div class="k">Checks</div><div class="v">${t.pass} passed,
          ${t.fail} failed <span class="muted">of ${t.total} ${esc(t.unit)}</span></div></div>` : ''}
      </div>
      <div class="muted" style="font-size:12.5px">${r.state === 'open'
        ? 'Determinism: each recorded check is reproducible against an unchanged environment (§13). ' +
          'A sealed run is not re-executed as a whole — its checks are the evidence (ID2).'
        : 'Determinism: re-running this submission against an unchanged environment produces the same ' +
          'result (§13). Run records are immutable (FR11).'}</div>
    </div>
    ${r.state === 'open' ? `<div class="banner amber"><h3>This run is open</h3>
      <p>Work through the scenarios and check each task as its data lands. Sealing freezes the
      latest check per task as the evidence for review — nothing re-executes (ID2).</p>
      <div class="btnrow">
        <button class="btn" data-act="sealrun" data-run="${esc(r.id)}">Seal and submit</button>
        <button class="btn ghost" data-act="abandonrun" data-run="${esc(r.id)}">Abandon run</button>
        <span class="muted" style="font-size:12.5px">${esc(sealSummary(r))}</span>
      </div></div>` : ''}
    ${body}`;
}

/* The expanded element detail for one step. Every step in the collection is a
   GET, so the columns read as constraint-and-observation rather than the
   expected-versus-observed pair the Assessments view uses (§9.1 applies only
   there — Bruno asserts shape and presence, not values). */
function stepElementsHTML(scen, s, span){
  const statusOk = s.observedStatus === s.status;
  const rows = s.elements.map(e => `<tr>
    <td class="mono">${esc(e.el)}</td>
    <td class="muted">${esc(e.type)}</td>
    <td class="mono muted">${esc(e.assertions)}</td>
    <td class="mono ${e.st === 'pass' ? '' : 'err'}">${esc(e.observed)}</td>
    <td><span class="dotstate ${ST_LABEL[e.st][0]}"><i></i>${esc(ST_LABEL[e.st][1])}</span>
      ${e.why ? `<div class="muted" style="font-size:12px">${esc(e.why)}</div>` : ''}</td>
  </tr>`).join('');
  return `<tr><td colspan="${span || 3}" style="background:#f8f9fa;padding:14px 16px">
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">
      <span class="mono">GET</span> &middot; <span class="mono">${esc(scen.scenario)}</span> &mdash;
      asserted on the response the vendor's API returned for data they loaded themselves.</div>
    <table class="t">
      <thead><tr><th>Element</th><th>Ed-Fi type</th><th>Assertions</th>
        <th>Observed (API response)</th><th>Result</th></tr></thead>
      <tbody><tr>
        <td class="mono">res.status</td><td class="muted">Integer</td>
        <td class="mono muted">eq ${s.status}</td>
        <td class="mono ${statusOk ? '' : 'err'}">${s.observedStatus}</td>
        <td><span class="dotstate ${statusOk ? 'ok' : 'bad'}"><i></i>${statusOk
          ? 'Pass' : esc(ST_LABEL['fail-status'][1])}</span>
          ${statusOk ? '' : `<div class="muted" style="font-size:12px">${esc(s.msg)}</div>`}</td>
      </tr>${rows}</tbody>
    </table>
    ${s.elements.length ? '' : `<p class="muted" style="font-size:12.5px;margin:8px 0 0">
      ${statusOk ? 'This step asserts on the status alone — a Delete scenario confirms the resource is gone, so there is no body to check.'
                 : 'No body was returned, so no element assertions ran.'}</p>`}
  </td></tr>`;
}

/* The vendor's working surface. Tasks are the rows because tasks are the work;
   the verification steps only check it. Prerequisites are shown but do not block
   — a check against missing prerequisite data fails on its own with a better
   message than a pre-emptive block could give (D24). */
function preparePanelHTML(run, scenarioKey){
  const scen = scenarioOf(run, scenarioKey);
  if (!scen) return '';
  const sealed = run.state !== 'open';
  const defs = scenarioParamDefs(scenarioKey);
  const checkable = scen.tasks.filter(t => t.step && !t.outOfScope).length;
  const done = scen.tasks.filter(t => t.check && t.check.st === 'pass').length;

  return `<div class="card">
    <div class="cardhead"><h2>${esc(scen.area)} <span class="hint">/
      <span class="mono">${esc(scen.scenario)}</span></span></h2>
      <div class="right muted" style="font-size:12.5px">load order ${scen.seq} of
        ${COLLECTION[run.model].length} &middot; ${done} of ${checkable} verified</div></div>

    ${sealed ? `<div class="banner amber"><h3>This run is ${esc(run.state)}</h3>
      <p>Its checks are frozen as the evidence for review. Start a new run to check
      tasks again (ID2).</p></div>` : ''}

    ${scen.prereqs.length ? `<div class="muted" style="margin-bottom:12px">
      <strong>Prerequisites:</strong> ${scen.prereqs.map(esc).join(' &middot; ')}
      <div class="hint" style="margin-top:4px">Load these first. The platform does not block on
      them — a check against missing data fails with a clearer message than a block would
      give (D24).</div></div>` : ''}

    ${defs.length ? `<div class="card" style="box-shadow:none;border:1px solid #e3e6e8;margin-bottom:14px">
      <h3 style="margin-top:0">Parameters</h3>
      <div class="hint" style="margin:-6px 0 10px">The identifiers you used when loading this
        scenario's data. Shared by every step in it (ID4).</div>
      <div class="paramgrid">${defs.map(d => `<div class="field">
        <label>${esc(d.label)}</label>
        <input data-act="setparam" data-run="${esc(run.id)}" data-key="${esc(scenarioKey)}"
          data-param="${esc(d.key)}" value="${esc(scen.params[d.key] || '')}"
          ${sealed ? 'disabled' : ''} /></div>`).join('')}</div>
      ${scenarioParamsComplete(scen) ? '' :
        '<div class="muted" style="font-size:12.5px">Some parameters are still blank.</div>'}
    </div>` : ''}

    <table class="t">
      <thead><tr><th>#</th><th>Task</th><th>Result</th><th class="act">Action</th></tr></thead>
      <tbody>${scen.tasks.map(t => {
        const open = APP.openSteps[scenarioKey + '@' + t.n];
        const c = t.check;
        let result;
        if (t.outOfScope) result = '<span class="muted">Out of scope</span>';
        else if (!t.step) result = '<span class="muted">No verification step &mdash; asserted indirectly</span>';
        else if (!c) result = '<span class="dotstate">Not attempted</span>';
        else if (c.st === 'pass') result = '<span class="dotstate ok"><i></i>Verified</span>' +
          (c.attempts > 1 ? `<div class="muted" style="font-size:12px">after ${c.attempts} attempts</div>` : '');
        else result = `<span class="dotstate ${ST_LABEL[c.kind][0]}"><i></i>${esc(ST_LABEL[c.kind][1])}</span>
          <div class="muted" style="font-size:12px">${esc(c.msg)}${c.attempts > 1
            ? ' (still failing after ' + c.attempts + ' attempts)' : ''}</div>`;

        return `<tr>
          <td class="muted">${t.n}</td>
          <td${t.outOfScope ? ' style="text-decoration:line-through;opacity:.55"' : ''}>${esc(t.text)}</td>
          <td>${result}</td>
          <td class="act">${t.step && !t.outOfScope && !sealed
            ? `<button class="btn ghost sm" data-act="runcheck" data-run="${esc(run.id)}"
                 data-key="${esc(scenarioKey)}" data-task="${t.n}">${c ? 'Re-check' : 'Check'}</button>`
            : ''}
            ${c ? `<button class="linkish" data-act="togglestepels"
                 data-key="${esc(scenarioKey + '@' + t.n)}">${open
                   ? 'Hide elements &#9652;' : 'View elements &#9662;'}</button>` : ''}</td>
        </tr>${open && c ? stepElementsHTML(scen, Object.assign({}, t.step, c), 4) : ''}`;
      }).join('')}</tbody>
    </table>

    ${sealed ? '' : `<div class="btnrow" style="margin-top:14px">
      <button class="btn" data-act="checkall" data-run="${esc(run.id)}"
        data-key="${esc(scenarioKey)}">Check all tasks</button>
      <span class="muted" style="font-size:12.5px">Runs them in order and stops at the first
        failure, as the collection's own dependencies do.</span></div>`}
  </div>`;
}

function brunoResultsHTML(r){
  /* While a run is open the vendor works a scenario in the Prepare panel, which
     takes over the card rather than sitting beside the scenario list. */
  if (APP.prepare && APP.prepare.run === r.id && r.state === 'open'){
    return preparePanelHTML(r, APP.prepare.key) +
      `<div style="margin:-6px 0 18px"><button class="linkish"
         data-act="closeprepare">Back to all scenarios</button></div>`;
  }
  const sel = APP.openScenario || null;
  const scen = sel ? r.results.scenarios.find(s => s.area + '/' + s.scenario === sel) : null;
  if (scen){
    return `<div class="card">
      <div class="scenariohead">
        <div><div class="k">Group or area</div><div class="v">${esc(scen.area)}</div></div>
        <div><div class="k">Scenario</div><div class="v">${esc(scen.scenario)}</div></div>
        <div style="margin-left:auto"><div class="k">Result</div>
          <div class="v">${scen.st === 'pass'
            ? '<span class="dotstate ok"><i></i>Passed</span>'
            : '<span class="dotstate bad"><i></i>Failed</span>'}</div></div>
      </div>
      <table class="t">
        <thead><tr><th>Step</th><th>Status</th><th>Detail</th></tr></thead>
        <tbody>${scen.tasks.filter(t => t.step).map((t, i) => {
          const open = APP.openSteps[sel + '#' + i];
          const c = t.check;
          return `<tr>
          <td>${esc(t.step.name)}</td>
          <td>${!c ? '<span class="dotstate">Not attempted</span>'
              : c.st === 'pass' ? '<span class="dotstate ok"><i></i>Passed</span>'
              : '<span class="dotstate bad"><i></i>Failed</span>'}</td>
          <td class="muted">${c ? esc(c.msg) : 'No check has been recorded for this task.'}
            ${c ? `<div style="margin-top:4px"><button class="linkish"
              data-act="togglestepels" data-key="${esc(sel + '#' + i)}">${open
                ? 'Hide elements &#9652;' : 'View elements &#9662;'}</button></div>` : ''}</td>
        </tr>${open && c ? stepElementsHTML(scen, Object.assign({}, t.step, c)) : ''}`;
        }).join('')}</tbody>
      </table>
      <div style="margin-top:16px"><button class="linkish" data-act="closescenario">Back to all scenarios</button></div>
      <div class="summary" style="margin-top:18px;border-bottom:0;padding-bottom:0">
        <div><div class="k">Execution result</div><div class="v">${scen.st === 'pass' ? 'Passed' : 'Failed'}</div></div>
      </div>
    </div>`;
  }
  /* A scenario fails if any checked task failed, passes if something was checked
     and nothing failed, and is not attempted only when no task in it was checked
     (ID9) — "never tried" and "tried and broke" call for different responses. */
  const scenState = s => {
    const checked = s.tasks.filter(t => t.check);
    if (!checked.length) return 'none';
    return checked.some(t => t.check.st === 'fail') ? 'fail' : 'pass';
  };
  const failed = r.results.scenarios.filter(s => scenState(s) === 'fail');
  const t = resultTally(r.results);
  return `<div class="card">
    <div class="cardhead"><h2>Scenario results <span class="hint">Bruno-based results are shown by scenario (FR10).</span></h2>
      <div class="right muted" style="font-size:12.5px">${t.pass} passed
        &middot; ${t.fail} failed &middot; ${t.notAttempted} not attempted</div></div>
    ${failed.length ? `<div class="banner red"><h3>${failed.length} scenario(s) failed</h3>
      <ul>${failed.map(s => `<li><strong>${esc(s.area)}/${esc(s.scenario)}</strong> —
        ${esc((s.tasks.find(x => x.check && x.check.st === 'fail') || {check:{}}).check.msg || '')}</li>`).join('')}</ul></div>` : ''}
    <table class="t">
      <thead><tr><th>Area or group</th><th>Scenario</th><th>Tasks verified</th><th>Status</th><th class="act">Action</th></tr></thead>
      <tbody>${r.results.scenarios.map(s => {
        const st = scenState(s);
        const okCount = s.tasks.filter(x => x.check && x.check.st === 'pass').length;
        return `<tr>
          <td>${esc(s.area)}</td><td>${esc(s.scenario)}</td>
          <td class="muted">${okCount} of ${s.tasks.filter(x => x.step).length}</td>
          <td>${st === 'pass' ? '<span class="dotstate ok"><i></i>Passed</span>'
               : st === 'fail' ? '<span class="dotstate bad"><i></i>Failed</span>'
               : '<span class="dotstate">Not attempted</span>'}</td>
          <td class="act">${r.state === 'open'
            ? `<button class="btn sm" data-act="openprepare" data-run="${esc(r.id)}"
                 data-key="${esc(s.area + '/' + s.scenario)}">Prepare</button>`
            : `<button class="btn ghost sm" data-act="openscenario"
                 data-key="${esc(s.area + '/' + s.scenario)}">View steps</button>`}</td></tr>`;
      }).join('')}</tbody>
    </table>
    <div class="pager"><button>&laquo;</button><button>&lsaquo;</button><span>1 of 1</span>
      <button>&rsaquo;</button><button>&raquo;</button>
      <select><option>Show 25</option></select></div>
  </div>`;
}

function assessmentResultsHTML(r){
  const kinds = {};
  r.results.groups.forEach(g => g.elements.forEach(e => {
    if (e.st !== 'pass') kinds[e.st] = (kinds[e.st] || 0) + 1; }));
  return `<div class="card">
    <div class="cardhead"><h2>Validation results
      <span class="hint">By domain, resource and element (FR10). GET requests only.</span></h2></div>
    ${Object.keys(kinds).length ? `<div class="banner red"><h3>Failures by kind</h3>
      <ul>${Object.entries(kinds).map(([k, n]) =>
        `<li><strong>${esc(ST_LABEL[k][1])}</strong> &mdash; ${n}</li>`).join('')}</ul>
      <p class="muted">A type error and a value mismatch mean different things to a vendor fixing them, so they
      are reported separately (§9.1).</p></div>`
      : `<div class="banner green"><h3>All element checks passed</h3>
         <p>Every element declared in the mapping CSV was present and populated, every descriptor resolved to a
         legitimate Ed-Fi URI, and every value reconciled to the submitted sample data (D8).</p></div>`}
    ${r.results.groups.map(g => `
      <h2 style="margin-top:22px">${esc(g.domain)} <span class="hint">/ <span class="mono">${esc(g.resource)}</span></span></h2>
      ${g.emptyResource ? `<div class="banner amber"><h3>Declared resource returned no data</h3>
        <p><span class="mono">GET /ed-fi/${esc(g.resource)}</span> returned <strong>200 with an empty
        collection</strong>. The mapping declares this resource, so the run <em>fails loudly</em> rather than
        refusing to start — "this resource returned nothing" is the actionable feedback (D24).</p></div>` : ''}
      <table class="t">
        <thead><tr><th>Element</th><th>Ed-Fi type</th><th>Expected (sample data)</th>
          <th>Observed (API response)</th><th>Result</th></tr></thead>
        <tbody>${g.elements.map(e => `<tr>
          <td class="mono">${esc(e.el)}</td>
          <td class="muted">${esc(e.type)}</td>
          <td class="mono">${esc(e.expected)}</td>
          <td class="mono ${e.st === 'pass' ? '' : 'err'}">${esc(e.observed)}</td>
          <td><span class="dotstate ${ST_LABEL[e.st][0]}"><i></i>${esc(ST_LABEL[e.st][1])}</span>
            ${e.why ? `<div class="muted" style="font-size:12px">${esc(e.why)}</div>` : ''}</td>
        </tr>`).join('')}</tbody>
      </table>`).join('')}
    <div class="legend">
      <span class="badge b-green">Pass</span><span class="badge b-red">Missing element</span>
      <span class="badge b-red">Invalid descriptor</span><span class="badge b-red">Value mismatch</span>
      <span class="badge b-red">Type error</span><span class="badge b-red">No data returned</span>
      <span class="muted" style="font-size:12.5px">Normalization is applied symmetrically to both sides and is
        versioned with the validator — never configurable per vendor (§9.1).</span>
    </div>
  </div>`;
}

/* ---------------- REVIEWER ---------------- */
function reviewerScreen(route){
  switch (route.name){
    case 'dashboard': return reviewerDashboard();
    case 'queue':     return reviewerQueue();
    case 'review':    return reviewerSubmission(route.args[0]);
    case 'run':       return runResults(route.args[0], true);
    default:          return placeholder(route.name.charAt(0).toUpperCase() + route.name.slice(1));
  }
}

function reviewerDashboard(){
  const newlyReady = APP.submissions.filter(s => s.status === 'ready');
  const changed = APP.submissions.filter(hasUnseenChanges);
  const inflight = APP.runs.filter(r => r.state === 'queued' || r.state === 'running');
  const recentFail = APP.runs.filter(r => isFinished(r) && r.outcome !== 'passed')
    .sort((a,b) => new Date(b.ended) - new Date(a.ended)).slice(0, 6);
  const rowLink = s => `<a href="#/review/${s.id}">${esc(product(s.productId).name)}</a>`;

  return crumbs([['Home', '#/dashboard'], ['Certification dashboard']]) + `
    <div class="pagehead">
      <div><h1>Certification dashboard</h1>
        <div class="sub">No outbound email in the MVP (D12), so pending work has to be discoverable here (FR12).</div></div>
      <div class="acts"><a class="btn ghost sm" href="#/queue">Open review queue</a></div>
    </div>
    <div class="asof">Accurate as of page load &mdash; ${fmt(APP.loadedAt)}. This surface is not required to
      update live; the operating assumption is a same-business-day check as part of a normal workday (D23).</div>
    <div class="kpis">
      <div class="kpi ${newlyReady.length ? 'hot' : ''}"><div class="n">${newlyReady.length}</div>
        <div class="l">Newly Ready for Review</div></div>
      <div class="kpi ${changed.length ? 'hot' : ''}"><div class="n">${changed.length}</div>
        <div class="l">Artifacts changed during review</div></div>

function reviewerQueue(){
  const q = (APP.queueSearch || '').toLowerCase();
  let rows = APP.submissions.filter(s => {
    if (APP.queueStatus && s.status !== APP.queueStatus) return false;
    if (!q) return true;
    const p = product(s.productId);
    return (p.name + ' ' + p.vendor + ' ' + MODELS[s.model].label).toLowerCase().includes(q);
  });
  const order = {ready:0, inreview:1, changes:2, incomplete:3, draft:4, approved:5, rejected:6};
  rows.sort((a, b) => order[a.status] - order[b.status]);

  return crumbs([['Home', '#/dashboard'], ['Review queue']]) + `
    <div class="pagehead">
      <div><h1>Certification management</h1>
        <div class="sub">Work through a queue rather than chase vendors (FR12).</div></div>
      <div class="acts"><button class="btn ghost sm" data-act="export">&#8682; Export</button></div>
    </div>
    <div class="card">
      <div class="tools">
        <div class="search"><input id="queueSearch" placeholder="Search" value="${esc(APP.queueSearch || '')}" /></div>
        <button class="linkish">Hide options</button>
        <span class="chip">Add sort +</span>
        <span class="chip">Status
          <select id="queueStatus">
            <option value="">All statuses</option>
            ${Object.keys(STATUS).map(k => `<option value="${k}" ${APP.queueStatus === k ? 'selected' : ''}>${
              esc(STATUS[k].label)}</option>`).join('')}
          </select></span>
      </div>
      ${rows.length ? `<table class="t">
        <thead><tr><th>Product</th><th>Vendor</th><th>Model</th><th>Status</th><th>Qualifying run</th>
          <th>Artifacts</th><th>Last activity</th><th class="act">Action</th></tr></thead>
        <tbody>${rows.map(s => {
          const g = gate(s), p = product(s.productId);
          return `<tr>
            <td><a href="#/review/${s.id}">${esc(p.name)}</a>
              ${hasUnseenChanges(s) ? '<div class="badge b-orange stale">Changed since you last looked</div>' : ''}</td>
            <td>${esc(p.vendor)}</td>
            <td>${esc(MODELS[s.model].label)}</td>
            <td>${badge(s.status)}</td>
            <td>${g.qualifying ? `<a href="#/run/${g.qualifying.id}" class="mono">${esc(g.qualifying.id)}</a>${
                isStale(s, g.qualifying) ? ' <span class="badge b-gray stale">Stale</span>' : ''}`
              : '<span class="muted">None</span>'}</td>
            <td>${g.artifactsComplete ? '<span class="badge b-green">3 of 3</span>'
              : `<span class="badge b-amber">${3 - g.missing.length} of 3</span>`}</td>
            <td class="muted nowrap">${fmtShort(s.history[0] ? s.history[0].at : s.created)}</td>

        }).join('')}</tbody></table>
      <div class="pager"><button>&laquo;</button><button>&lsaquo;</button><span>1 of 1</span>
        <button>&rsaquo;</button><button>&raquo;</button>
        <select><option>Show 10</option><option>Show 25</option></select></div>
      <div class="legend">${Object.keys(STATUS).map(k => badge(k)).join('')}</div>`
      : '<div class="empty">No submissions match this filter.</div>'}

function reviewerSubmission(id){
  const sub = submission(id);
  if (!sub) return placeholder('Submission');
  const p = product(sub.productId), m = MODELS[sub.model], g = gate(sub);
  const runs = runsFor(sub);
  /* Sealed by default; a reviewer opts into open runs to unblock someone
     mid-flight rather than waiting for a seal (ID8). */
  const visible = reviewerRuns(sub, APP.showOpenRuns);
  const shown = APP.showTrial ? visible : visible.filter(r => r.completeness === 'Complete');
  const terminal = ['approved','rejected'].includes(sub.status);
  const changedFlag = hasUnseenChanges(sub);

  return crumbs([['Home', '#/dashboard'], ['Review queue', '#/queue'], [p.name], [m.label]]) + `
    <div class="pagehead">
      <div><h1>${esc(p.name)}</h1>
        <div class="sub">${esc(p.vendor)} &middot; ${esc(m.label)} &middot;
          environment <span class="tag">${esc(p.env)}</span></div></div>
      <div class="acts">
        <button class="btn ghost sm" data-act="export">&#8682; Export</button>
        ${terminal ? '' : `
        <button class="btn ghost sm" data-act="changes" data-sub="${sub.id}">Request changes</button>
        <button class="btn red sm" data-act="reject" data-sub="${sub.id}">Reject</button>
        <button class="btn sm" data-act="approve" data-sub="${sub.id}">Approve</button>`}
      </div>
    </div>
    ${changedFlag ? `<div class="banner amber"><h3><span class="badge b-orange">Changed</span>
      Artifacts changed since your last review action</h3>
      <p>You last looked at this submission on ${fmt(sub.reviewerSeenAt)}; artifacts were replaced on
      ${fmt(sub.artifactsChangedAt)}. Check whether the qualifying run still reflects what is attached now.</p></div>` : ''}
    ${terminal ? `<div class="banner ${sub.status === 'approved' ? 'green' : 'red'}">
      <h3>${badge(sub.status)} Decision recorded</h3>
      <p>${esc(sub.decision.by)} on ${fmt(sub.decision.at)}.${
        sub.decision.reason ? ' Reason: ' + esc(sub.decision.reason) : ''} Terminal for this submission (FR15).</p></div>` : ''}
    ${!terminal && g.met && g.qualifying.outcome !== 'passed' ? `<div class="banner amber">
      <h3><span class="badge b-red">Qualifying run failed</span> Yours to judge</h3>
      <p>Run <a href="#/run/${g.qualifying.id}" class="mono">${esc(g.qualifying.id)}</a> is a finished run
      stamped <strong>Complete</strong>, so it satisfies the readiness gate — but its checks
      <strong>failed</strong>. The gate does not evaluate outcomes, and the platform never withholds a
      submission from review because its results look bad (D25). Whether these failures are disqualifying,
      warrant a re-run, or are acceptable for this certification is your determination (§12).</p></div>` : ''}
    ${!terminal && !g.met ? `<div class="banner amber"><h3>${badge(sub.status)} Not admissible yet</h3>
      <p>The readiness gate is unmet: ${g.missing.length
        ? 'missing ' + g.missing.map(a => esc(a.label)).join(', ') + '.'
        : 'artifacts are complete but no finished run stamped <em>Complete</em> exists.'}
      Reviewers never spend time on an incomplete package (FR13).</p></div>` : ''}

    <div class="card">
      <div class="summary">
        <div><div class="k">Status</div><div class="v">${badge(sub.status)}</div></div>
        <div><div class="k">Cleared by</div><div class="v">${esc(STATUS[sub.status].who)}</div></div>
        <div><div class="k">Qualifying run</div><div class="v">${g.qualifying
          ? `<a href="#/run/${g.qualifying.id}">${esc(g.qualifying.id)}</a>` : 'None'}</div></div>
        <div><div class="k">Runs recorded</div><div class="v">${runs.length}
          <span class="muted">(${runs.filter(r => r.completeness === 'Complete').length} qualifying)</span></div></div>
        <div><div class="k">Submitted</div><div class="v">${fmt(sub.created)}</div></div>
      </div>
      ${artifactCard(sub, true)}
      <div class="banner" style="margin:18px 0 0">
        <h3>Reviewer judgment, not platform judgment</h3>
        <p>The platform has checked what it can check. Semantic alignment &mdash; whether this mapping is a
        defensible representation of the product &mdash; is human judgment and is deliberately not automated
        (§10.3, §12). Spot-check the results; the platform is trusted to have executed the checks
        correctly. The platform never approves or rejects a certification.</p>
      </div>
    </div>

    ${sub.comments.length ? `<div class="card"><h2>Review comments</h2>
      <ul class="hist">${sub.comments.map(c => `<li><span class="when">${fmtShort(c.at)}</span>
        <span>${esc(c.text)}</span><span class="who">${esc(c.by)}</span></li>`).join('')}</ul></div>` : ''}

    <div class="card">
      <div class="cardhead"><h2>Runs <span class="hint">Defaults to sealed, qualifying runs (FR12).</span></h2>
        <div class="right"><label class="muted" style="font-size:12.5px">
          <input type="checkbox" id="showTrial" ${APP.showTrial ? 'checked' : ''} /> Include trial runs</label>
          <label class="muted" style="font-size:12.5px;margin-left:14px">
          <input type="checkbox" data-act="toggleopenruns" ${APP.showOpenRuns ? 'checked' : ''} />
          Include open runs</label></div>
      </div>
      <div class="muted" style="font-size:12.5px;margin-bottom:10px">An open run is a vendor's
        working record, not submitted evidence. Include them to give feedback in progress.</div>
      ${runTable(shown, {sub})}
    </div>
    ${historyCard(sub)}`;
}

/* ==============================================================
   Modals, toasts, event binding
   ============================================================== */
function closeModal(){ $('#overlay').innerHTML = ''; }
function modal(title, bodyHTML, footerHTML){
  $('#overlay').innerHTML = `<div class="veil" data-veil="1"><div class="modal">
    <div class="mh">${title}</div><div class="mb">${bodyHTML}</div>
    <div class="mf">${footerHTML}</div></div></div>`;
  $('#overlay').querySelector('[data-veil]').addEventListener('click', e => {
    if (e.target.dataset.veil) closeModal();
  });
  bindOverlay();
}
let toastTimer = null;
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4200);
}

function uploadModal(sub, type){
  const a = ARTIFACTS.find(x => x.id === type);
  const cur = currentVersion(sub, type);
  const isMapping = type === 'mapping';
  modal((cur ? 'Replace ' : 'Upload ') + esc(a.label), `
    <div class="drop">Drag a file here, or</div>
    <div class="field"><label>File</label><input type="text" id="fileName"
      value="${esc(suggestName(sub, type, cur))}" /></div>
    <div class="field"><label>Validation on upload</label>
      <div class="muted">${esc(a.validation)}. ${esc(a.note)}</div></div>
    ${isMapping ? `<div class="field radios"><label style="font-weight:700;display:block;margin-bottom:8px">
      Simulate <span class="muted" style="font-weight:400">(prototype only — no file is really parsed)</span></label>
      <label><input type="radio" name="sim" value="ok" checked /> A file that conforms to the published
        mapping CSV template</label>
      <label><input type="radio" name="sim" value="bad" /> A malformed file — to see structural
        validation reject it (D9, FR6)</label></div>` : ''}
    ${cur ? `<div class="banner"><h3>This creates version ${cur.v + 1}</h3>
      <p>Prior versions remain visible in audit history, and any run that pinned v${cur.v} keeps pointing at
      v${cur.v} — it will simply be marked stale (D14, FR11).</p></div>` : ''}
  `, `<button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn" data-act="douploadconfirm" data-sub="${sub.id}" data-type="${type}">
        ${cur ? 'Replace artifact' : 'Upload artifact'}</button>`);
}
function suggestName(sub, type, cur){
  const slug = MODELS[sub.model].id;
  const n = (sub.artifacts[type].length + 1);
  return {mapping:'vendorb-' + slug + '-mapping-v' + n + '.csv',
          sample:'vendorb-' + slug + '-sample-data.json',
          docs:'VendorB-' + slug.toUpperCase() + '-Score-Report.pdf'}[type];
}

function bind(){
  const main = $('#main');

  /* Most actions are clicks, but a typed parameter fires input and a filter
     checkbox fires change, so the event is chosen per action. */
  const ACTION_EVENT = {setparam:'input', toggleopenruns:'change'};
  main.querySelectorAll('[data-act]').forEach(node => {
    node.addEventListener(ACTION_EVENT[node.dataset.act] || 'click', ev => {
      const act = node.dataset.act;
      const sub = node.dataset.sub ? submission(node.dataset.sub) : null;
      switch (act){
        case 'upload': ev.preventDefault(); uploadModal(sub, node.dataset.type); break;
        case 'gotorun': go('#/newrun/' + sub.id); break;
        case 'startrun': {
          const mode = $('#outcomeSel') ? $('#outcomeSel').value : 'realistic';
          const r = startRun(sub, mode);
          toast('Run <strong>' + r.id + '</strong> queued and stamped <strong>' + r.completeness +
            '</strong>. Completeness is fixed now and never recalculated.');
          go('#/run/' + r.id);
          render();
          break;
        }
        case 'setparam': {
          const run = APP.runs.find(x => x.id === node.dataset.run);
          const scen = scenarioOf(run, node.dataset.key);
          scen.params[node.dataset.param] = node.value;
          break;
        }
        case 'sealrun': {
          const run = APP.runs.find(x => x.id === node.dataset.run);
          const summary = sealSummary(run);
          sealRun(run);
          APP.prepare = null;
          toast('Run <strong>' + run.id + '</strong> sealed — ' + esc(summary) +
            '. Its checks are now immutable evidence.');
          render();
          break;
        }
        case 'abandonrun': {
          const run = APP.runs.find(x => x.id === node.dataset.run);
          abandonRun(run);
          APP.prepare = null;
          toast('Run <strong>' + run.id + '</strong> abandoned — its checks were discarded.');
          render();
          break;
        }
        case 'toggleopenruns': APP.showOpenRuns = !APP.showOpenRuns; render(); break;
        case 'openprepare':
          APP.prepare = {run: node.dataset.run, key: node.dataset.key};
          APP.openSteps = {};
          render();
          break;
        case 'closeprepare': APP.prepare = null; APP.openSteps = {}; render(); break;
        case 'runcheck': {
          const run = APP.runs.find(x => x.id === node.dataset.run);
          const c = runCheck(run, node.dataset.key, +node.dataset.task);
          toast(c.st === 'pass'
            ? 'Task <strong>' + node.dataset.task + '</strong> verified.'
            : 'Task <strong>' + node.dataset.task + '</strong> failed — ' + esc(c.msg));
          render();
          break;
        }
        case 'checkall': {
          const run = APP.runs.find(x => x.id === node.dataset.run);
          const n = checkAll(run, node.dataset.key);
          const scen = scenarioOf(run, node.dataset.key);
          const stopped = scen.tasks.some(x => x.check && x.check.st === 'fail');
          toast('Checked ' + n + ' task(s)' + (stopped
            ? ' — stopped at the first failure.' : '. All verified.'));
          render();
          break;
        }
        case 'openscenario': APP.openScenario = node.dataset.key; APP.openSteps = {}; render(); break;
        case 'closescenario': APP.openScenario = null; APP.openSteps = {}; render(); break;
        case 'togglestepels': {
          const k = node.dataset.key;
          if (APP.openSteps[k]) delete APP.openSteps[k]; else APP.openSteps[k] = true;
          render();
          break;
        }
        case 'onescenario':
          toast('In the product this runs the single scenario and loads its dynamic parameters. ' +
                'The prototype only simulates whole runs.');
          break;
        case 'pickup':
          reviewerOpen(sub);
          go('#/review/' + sub.id);
          render();
          toast('Submission moved to <strong>In Review</strong> and is now visible to the vendor as such.');
          break;
        case 'changes': changesModal(sub); break;
        case 'approve': decisionModal(sub, 'approved'); break;
        case 'reject': decisionModal(sub, 'rejected'); break;
        case 'newsub': newSubmissionModal(); break;
        case 'startcert': ev.preventDefault(); startCertModal(node.dataset.app); break;
        case 'viewcert': go('#/products/' + node.dataset.app); break;
        case 'export':
        case 'viewartifact':
          toast('Not implemented in the prototype — the button is here because the existing Admin App ' +
                'page furniture has it.');
          break;
      }
    });
  });

  const st = $('#showTrial');
  if (st) st.addEventListener('change', e => { APP.showTrial = e.target.checked; render(); });
  const af = $('#areaFilter');
  if (af) af.addEventListener('change', e => { APP.areaFilter = e.target.value; render(); });
  const qs = $('#queueSearch');
  if (qs) qs.addEventListener('input', e => {
    APP.queueSearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const nx = $('#queueSearch');
    if (nx){ nx.focus(); nx.setSelectionRange(pos, pos); }
  });
  const qst = $('#queueStatus');
  if (qst) qst.addEventListener('change', e => { APP.queueStatus = e.target.value; render(); });

  /* auto-refresh while a run is in flight */
  if (APP.runs.some(r => r.state === 'queued' || r.state === 'running')){
    clearTimeout(APP.poll);
    APP.poll = setTimeout(render, 1200);
  }
}

function bindOverlay(){
  $('#overlay').querySelectorAll('[data-act]').forEach(node => {
    node.addEventListener('click', () => {
      const act = node.dataset.act;
      const sub = node.dataset.sub ? submission(node.dataset.sub) : null;
      if (act === 'cancel'){ closeModal(); return; }
      if (act === 'douploadconfirm'){
        const type = node.dataset.type;
        const name = ($('#fileName') && $('#fileName').value.trim()) || 'upload.dat';
        const simBad = !!$('#overlay').querySelector('input[name=sim][value=bad]:checked');
        const res = uploadArtifact(sub, type, name, simBad);
        if (!res.ok){
          modal('Mapping CSV rejected', `
            <div class="banner red"><h3>Structural validation failed — ${esc(name)}</h3>
              <p>The file was <strong>not stored</strong> as the active mapping, and no run can be started
              against it. Malformed files are rejected on upload (D9, FR6).</p>
              <ul>${res.errors.map(e => '<li>' + esc(e) + '</li>').join('')}</ul></div>
            <div class="muted">The rejection itself is recorded in audit history, so a vendor asking
              "did my upload land?" has an answer.</div>`,
            `<button class="btn ghost" data-act="cancel">Close</button>
             <button class="btn" data-act="retryupload" data-sub="${sub.id}" data-type="${type}">Try another file</button>`);
          render();
          return;
        }
        closeModal();
        render();
        const g = gate(sub);
        toast(g.met
          ? 'Artifact stored. Readiness gate now <strong>met</strong> — status moved to Ready for Review.'
          : (g.artifactsComplete
            ? 'Artifact stored. All three artifacts present, but the gate still needs a finished run stamped <strong>Complete</strong>.'
            : 'Artifact stored. Still missing: ' + g.missing.map(a => a.label).join(', ') + '.'));
        return;
      }
      if (act === 'retryupload'){ uploadModal(sub, node.dataset.type); return; }
      if (act === 'dochanges'){
        const text = ($('#commentBox') && $('#commentBox').value.trim()) || '';
        if (!text){ $('#commentErr').textContent = 'A comment is required to request changes (FR14).'; return; }
        requestChanges(sub, text);
        closeModal(); render();
        toast('Moved to <strong>Changes Requested</strong>. The vendor can replace artifacts or start a new run without an intermediate approval step.');
        return;
      }
      if (act === 'dodecide'){
        const kind = node.dataset.kind;
        const reason = ($('#reasonBox') && $('#reasonBox').value.trim()) || '';
        if (kind === 'rejected' && !reason){
          $('#reasonErr').textContent = 'A rejection requires a reason (FR15).'; return;
        }
        decide(sub, kind, reason);
        closeModal(); render();
        toast('Decision recorded: <strong>' + STATUS[kind].label + '</strong>. Terminal for this submission.');
        return;
      }
      if (act === 'pickapp'){
        const appId = $('#certApp').value;
        closeModal();
        startCertModal(appId);
        return;
      }
      if (act === 'dostartcert'){
        const appId = node.dataset.app;
        const model = $('#certModel').value;
        const s = startCertification(appId, model);
        closeModal();
        go('#/submission/' + s.id);
        render();
        toast('Certification started for <strong>' + esc(product(appId).name) + '</strong> — ' +
          esc(MODELS[model].label) + '. It now appears under <strong>My products</strong> in ' +
          '<strong>Draft</strong>; upload artifacts to move it forward (FR6, FR13).');
        return;
      }
    });
  });
}

function changesModal(sub){
  modal('Request changes', `
    <div class="field wide"><label>Comment <span class="muted" style="font-weight:400">(required)</span></label>
      <textarea id="commentBox" rows="5" placeholder="Name the artifact or run that needs to change and why."></textarea>
      <div class="help err" id="commentErr"></div>
      <div class="help">The vendor sees this comment, and it is retained in the submission history (FR14).</div></div>
  `, `<button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn" data-act="dochanges" data-sub="${sub.id}">Request changes</button>`);
}
function decisionModal(sub, kind){
  const g = gate(sub);
  modal(kind === 'approved' ? 'Approve submission' : 'Reject submission', `
    ${!g.met ? `<div class="banner amber"><h3>The readiness gate is not met</h3>
      <p>${g.missing.length ? 'Missing ' + g.missing.map(a => esc(a.label)).join(', ') + '.'
        : 'No finished run stamped Complete.'} The platform surfaces this; the decision is still yours (§12).</p></div>` : ''}
    <p>${kind === 'approved'
      ? 'Approval is terminal for this submission and is recorded with your identity and a timestamp (FR15, FR17).'
      : 'Rejection is terminal for this submission and requires a reason.'}</p>
    <div class="field wide"><label>Reason ${kind === 'rejected'
      ? '<span class="muted" style="font-weight:400">(required)</span>'
      : '<span class="muted" style="font-weight:400">(optional)</span>'}</label>
      <textarea id="reasonBox" rows="4"></textarea>
      <div class="help err" id="reasonErr"></div></div>
  `, `<button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn ${kind === 'rejected' ? 'red' : ''}" data-act="dodecide"
        data-kind="${kind}" data-sub="${sub.id}">${kind === 'approved' ? 'Approve' : 'Reject'}</button>`);
}
/* FR5 / D26 — start certification for one application. Everything that identifies
   the product is inherited from the application and shown locked; the only decision
   is which certification model. */
function startCertModal(appId){
  const p = product(appId);
  const startable = startableModels(appId);
  const taken = openModels(appId);
  const locked = (k, v) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;
  modal('Start certification &mdash; ' + esc(p.name), `
    <div class="summary" style="gap:36px;padding-bottom:14px;margin-bottom:16px">
      ${locked('Application', p.name)}
      ${locked('Vendor', p.vendor)}
      ${locked('Environment', p.env)}
      ${locked('ODS', p.ods)}
    </div>
    <div class="field"><label>Certification model</label>
      <select id="certModel">${Object.values(MODELS).map(m => {
        const used = taken.includes(m.id);
        return `<option value="${m.id}"${used ? ' disabled' : ''}>${esc(m.label)}${
          used ? ' — already in progress' : ''}</option>`;
      }).join('')}</select>
      <div class="help">A product may hold concurrent open submissions across different models — SIS,
        Assessments and MTSS are distinct certification models (§8). Only one <em>run</em> executes at a
        time (D22).</div></div>
    <div class="banner"><h3>The product is this application</h3>
      <p>Name, vendor, environment and ODS come from the application record and are not re-entered
        (D26). Ed-Fi provisions and operates the certification environment on the vendor's behalf, so a
        certification cannot be pointed at a self-hosted ODS/API instance (D6, FR4).</p></div>
  `, `<button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn" data-act="dostartcert" data-app="${appId}"${
        startable.length ? '' : ' disabled'}>Start certification</button>`);
}

function newSubmissionModal(){
  const candidates = APP.applications.filter(p => !p.foreign && startableModels(p.id).length);
  modal('Create new', `
    <div class="field"><label>Application</label>
      <select id="certApp">${candidates.map(p =>
        `<option value="${p.id}">${esc(p.name)} &mdash; ${esc(p.env)} / ${esc(p.ods)}</option>`
      ).join('')}</select>
      <div class="help">A certification is granted to a product, and a product is one of your registered
        applications (D26). Applications with every model already in progress are not listed.</div></div>
  `, `<button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn red" data-act="pickapp"${candidates.length ? '' : ' disabled'}>Continue</button>`);
}

/* boot */
if (!location.hash) location.hash = '#/products';
render();
</script>
</body>
</html>
