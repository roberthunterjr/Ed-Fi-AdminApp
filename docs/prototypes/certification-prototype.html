<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ed-Fi Admin App &mdash; Certification Automation Platform (MVP prototype)</title>
<style>
/* ============================================================
   Ed-Fi Admin App shell — visual vocabulary lifted from the
   existing application screenshots. Prototype only.
   ============================================================ */
:root{
  --teal:#2e7d6a; --teal-dark:#246455; --teal-soft:#a9cfc5; --teal-bg:#eef6f3;
  --red:#e5342a; --red-dark:#c42b22; --red-bg:#fdeeed;
  --ink:#1f2a37; --ink-2:#39424e; --muted:#6b7480; --muted-2:#8b929c;
  --line:#e3e6ea; --line-2:#eceef1; --page:#f4f5f7; --thead:#eef0f3;
  --amber:#b7791f; --amber-bg:#fdf6e6; --blue:#2b6cb0; --blue-bg:#ebf3fb;
  --indigo:#5a4b9e; --indigo-bg:#f0edf9; --green:#2f7d54; --green-bg:#ecf6f0;
  --accent:var(--teal); --accent-dark:var(--teal-dark); --accent-bg:var(--teal-bg);
  --radius:6px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
body.scope-global{ --accent:var(--red); --accent-dark:var(--red-dark); --accent-bg:var(--red-bg); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:14px;line-height:1.45}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit}

/* ---------- header ---------- */
.appbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:16px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.3px;font-size:15px}
.logo .dot{width:22px;height:22px;border-radius:50%;
  background:conic-gradient(#e5342a,#f6a623,#7ab800,#00a3b5,#5a4b9e,#e5342a);
  box-shadow:inset 0 0 0 6px #fff}
.logo small{display:block;font-size:7px;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.appbar .divider{width:1px;height:26px;background:var(--line)}
.scope-title{font-weight:700;font-size:16px}
.appbar .spacer{flex:1}
.proto-pill{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:#8a5a00;background:#fff4d6;border:1px solid #f0dca8;border-radius:999px;padding:3px 9px}
.persona{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.persona select{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;color:var(--ink)}
.help{color:var(--muted);font-size:17px;cursor:default}
.avatar{width:28px;height:28px;border-radius:50%;background:#d7dae0;color:#4a5460;display:grid;
  place-items:center;font-size:12px;font-weight:700}

/* ---------- layout ---------- */
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:252px;flex:0 0 252px;background:#fff;border-right:1px solid var(--line);padding:16px 0 28px}
.main{flex:1;min-width:0;padding:18px 26px 60px}
.scopepick{margin:0 14px 14px}
.scopepick select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink)}
.navsec{font-size:12px;font-weight:700;color:var(--muted);padding:14px 18px 6px;letter-spacing:.2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 18px;color:var(--ink-2);font-size:13.5px;
  border-left:3px solid transparent}
.nav a:hover{background:#f7f8f9;text-decoration:none}
.nav a.on{color:var(--accent);font-weight:700;background:var(--accent-bg);border-left-color:var(--accent)}
.nav a .ic{width:17px;text-align:center;opacity:.75;font-size:13px}
.nav .sub a{padding-left:42px;font-size:13px}
.navsearch{margin:0 14px 8px;position:relative}
.navsearch input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:999px;
  font-family:inherit;font-size:13px}
.navsearch:before{content:"\1F50D";position:absolute;left:10px;top:7px;font-size:11px;opacity:.5}
.sidenote{margin:22px 16px 0;padding-top:12px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted-2)}

/* ---------- page furniture ---------- */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs span{margin:0 6px;color:#c3c8cf}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin:0 0 16px}
.pagehead h1{font-size:26px;margin:0;letter-spacing:-.4px}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:15.5px;margin:0 0 14px}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.cardhead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.cardhead h2{margin:0}
.cardhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.summary{display:flex;gap:56px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.summary div{min-width:120px}
.summary .k{color:var(--muted);font-size:13px}
.summary .v{font-size:14.5px;margin-top:2px}
.tools{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:0 1 360px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:999px;
  font-family:inherit;font-size:13px}
.search:before{content:"\1F50D";position:absolute;left:12px;top:8px;font-size:11px;opacity:.5}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.chip{border:1px solid var(--teal-soft);background:var(--teal-bg);color:var(--teal-dark);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip select{border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--teal-dark);outline:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius);
  border:1px solid transparent;background:var(--teal);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--teal-dark)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:#f7f8f9}
.btn.quiet{background:var(--teal-soft);color:#fff;cursor:not-allowed}
.btn[disabled]{background:var(--teal-soft);color:#fff;cursor:not-allowed;border-color:transparent}
body.scope-global .btn[disabled]{background:#f0b3ae}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--thead);color:#5a6472;font-size:11px;letter-spacing:.7px;text-transform:uppercase;
  text-align:left;padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.group td{background:#fafbfc;font-weight:700;font-size:13px;color:var(--ink-2)}
table.t td.num,table.t th.num{text-align:right}
table.t td.act{text-align:right;white-space:nowrap}
.t .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.empty{padding:22px 14px;color:var(--muted);font-style:italic}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 0 2px;color:var(--muted);font-size:13px}
.pager button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px}
.pager select{border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px;font-family:inherit;font-size:12.5px}

/* ---------- badges / pills ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:#eef0f3;color:#5a6472}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-indigo{background:var(--indigo-bg);color:var(--indigo)}
.b-orange{background:#fdf0e6;color:#b45309}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red-dark)}
.dotstate{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.dotstate i{width:8px;height:8px;border-radius:50%;background:#c3c8cf;display:inline-block}
.dotstate.run i{background:var(--blue);animation:pulse 1s infinite}
.dotstate.ok i{background:var(--green)} .dotstate.bad i{background:var(--red)}
.dotstate.warn i{background:var(--amber)}
@keyframes pulse{50%{opacity:.25}}
.sidebyside{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:10px}
@media (max-width:760px){.sidebyside{grid-template-columns:1fr}}
pre.json{background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;overflow:auto;max-height:420px;margin:8px 0}
ul.findings{margin:4px 0 8px 18px;padding:0}
ul.findings li{margin:2px 0}
.infoline{margin-top:8px}
.infobody{margin:6px 0 0 18px;display:grid;gap:6px}
.legend{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap}
.legend .badge{font-weight:600}
.tag{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f2f4f6;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2)}

/* ---------- banners ---------- */
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:#fbfcfd;border-radius:var(--radius);
  padding:14px 18px;margin-bottom:18px}
.banner h3{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:10px}
.banner p{margin:4px 0 0;color:var(--ink-2)}
.banner ul{margin:8px 0 0 18px;padding:0;color:var(--ink-2)}
.banner li{margin:3px 0}
.banner.amber{border-left-color:var(--amber);background:var(--amber-bg)}
.banner.blue{border-left-color:var(--blue);background:var(--blue-bg)}
.banner.green{border-left-color:var(--green);background:var(--green-bg)}
.banner.red{border-left-color:var(--red);background:var(--red-bg)}
.banner.indigo{border-left-color:var(--indigo);background:var(--indigo-bg)}
.scenariohead{border:1px solid var(--line);border-left:4px solid var(--blue);background:#f7fafd;
  border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;gap:56px}
.scenariohead .k{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
.scenariohead .v{font-size:17px;font-weight:700;margin-top:2px}

/* ---------- product / dashboard cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.tile.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.tile h3{margin:0 0 2px;font-size:15px}
.tile .meta{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.tile .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.tile .row .mdl{font-weight:600}
.tile .row .sp{margin-left:auto}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.hot .n{color:var(--red)}
.asof{color:var(--muted-2);font-size:12px;margin:-6px 0 16px}

/* ---------- forms ---------- */
.paramgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.paramgrid .field{margin-bottom:0;max-width:none}
.field{margin-bottom:16px;max-width:520px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:13.5px}
.field input[type=text],.field input[type=password],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;font-size:13.5px}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:#2b6cb0;box-shadow:0 0 0 2px #dbe8f6}
.field .help{color:var(--muted);font-size:12.5px;margin-top:5px}
.field.wide{max-width:none}
.radios label{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:0 0 9px;font-size:13.5px}
.radios input{margin-top:3px}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);
  background:#fafbfc;margin-bottom:14px;font-size:13px}

/* ---------- history ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted);width:130px;flex:0 0 130px;font-size:12.5px}
.hist .who{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}

/* ---------- modal / toast ---------- */
.veil{position:fixed;inset:0;background:rgba(24,32,41,.42);display:grid;place-items:center;z-index:100;padding:24px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:580px;max-height:88vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.24)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:20px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#1f2a37;color:#fff;padding:12px 16px;
  border-radius:var(--radius);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px}
.err{color:var(--red-dark)}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.stale{font-size:11.5px}
</style>
</head>
<body class="scope-team">
<div class="appbar">
  <div class="logo"><span class="dot"></span><span>ed&middot;fi<small>ALLIANCE</small></span></div>
  <div class="divider"></div>
  <div class="scope-title" id="scopeTitle">Test Vendor Dev Team</div>
  <span class="proto-pill">Prototype</span>
  <div class="spacer"></div>
  <div class="persona">
    <label for="personaSel">Viewing as</label>
    <select id="personaSel">
      <option value="vendor">Vendor &mdash; Test Vendor Dev Team</option>
      <option value="reviewer">Ed-Fi Alliance staff &mdash; global scope</option>
    </select>
  </div>
  <span class="help">?</span>
  <div class="avatar" id="avatar">A</div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>

<script>
/* ==============================================================
   Certification Automation Platform — MVP clickable prototype
   Mock data only. No network calls, no persistence.
   Behaviours traceable to docs/PRD-Platform-Automation-MVP.md:
     §8 status model, §8.1 run completeness, §9 artifacts,
     §9.1 value reconciliation, FR7/FR8/FR9/FR10/FR11/FR12/FR13/FR14/FR15/FR17
   ============================================================== */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW = new Date('2026-09-15T14:20:00');
let clock = new Date(NOW);
const tick = () => { clock = new Date(clock.getTime() + 61000); return new Date(clock); };
const fmt = d => d ? new Date(d).toLocaleString('en-US',
  {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const fmtShort = d => d ? new Date(d).toLocaleString('en-US',
  {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const dur = (a,b) => !a||!b ? '—' : Math.max(1, Math.round((new Date(b)-new Date(a))/1000)) + 's';
let seq = 100; const uid = p => p + '-' + (++seq);

/* ---------- reference data ---------- */
const MODELS = {
  sis: {id:'sis', label:'SIS v5', kind:'bruno', tag:'sis-v5.0.3', sha:'a7f3c19d'},
  assessments: {id:'assessments', label:'Assessments v5', kind:'assessments', tag:'assessments-v5.1.0', sha:'6c02b4ae'},
  mtss: {id:'mtss', label:'MTSS / Interventions v5', kind:'bruno', tag:'mtss-v1.0.0', sha:'4b1e08d2'}
};
const ARTIFACTS = [
  {id:'mapping', label:'Vendor mapping CSV', validation:'Structural / schema validation on upload',
   note:'Source of truth for Assessments scope (D2).'},
  {id:'sample',  label:'Sample data', validation:'Parseable and non-empty',
   note:'Expected-result set for value reconciliation — not a load source (D17).'},
  {id:'docs',    label:'Product documentation', validation:'Not validated — human review',
   note:'For Assessments: an example score report from the vendor’s application.'}
];
const STATUS = {
  draft:      {label:'Draft',                 cls:'b-gray',   who:'Vendor'},
  incomplete: {label:'Submission Incomplete',  cls:'b-amber',  who:'Vendor'},
  ready:      {label:'Ready for Review',       cls:'b-blue',   who:'Reviewer picks it up'},
  inreview:   {label:'In Review',              cls:'b-indigo', who:'Reviewer'},
  changes:    {label:'Changes Requested',      cls:'b-orange', who:'Vendor'},
  approved:   {label:'Approved',               cls:'b-green',  who:'Terminal'},
  rejected:   {label:'Rejected',               cls:'b-red',    who:'Terminal'}
};
const badge = k => `<span class="badge ${STATUS[k].cls}">${esc(STATUS[k].label)}</span>`;
const completenessBadge = c => c === 'Complete'
  ? '<span class="badge b-green">Complete</span>'
  : '<span class="badge b-amber">Incomplete &middot; trial run</span>';

/* ------------------------------------------------------------------
   Bruno scenario content.

   SIS is the real v5 collection: areas, scenarios, step names, step counts and
   element assertions are parsed from Ed-Fi-Alliance-OSS/certification-testing at
   bruno/SIS/v5. Every step there is a GET — the vendor loads the data into their
   own SIS by hand first, and the suite reads it back and asserts on it.

   A step's element spec is a ';'-separated list of "path:type" tokens. The type
   letter implies the canonical assertion pair the collection uses almost
   everywhere; a '?' suffix carries an unusual operator set verbatim.
     S -> String   isString, isNotEmpty      A -> Array    isArray, isNotEmpty
     N -> Number   isNumber, neq 0           O -> Object   isDefined
     B -> Boolean  isBoolean
   '=' reuses the previous step's spec (steps in a scenario mostly assert the
   same shape); '' means the step asserts on status alone, as Delete steps do.

   Each step is [name, expectedStatus, changedField, elementSpec]. changedField
   is the one real value check in the collection — expectChanged() in the
   post-response script of an Update step.
   ------------------------------------------------------------------ */
const ASSERT_TYPE = {
  S:['String',  'isString, isNotEmpty'],
  N:['Number',  'isNumber, neq 0'],
  A:['Array',   'isArray, isNotEmpty'],
  O:['Object',  'isDefined'],
  B:['Boolean', 'isBoolean']
};
const SIS_V5 = [
 ['Contact','Contacts',[
  ['01 - 1st Contact is valid',200,'','id:S;contactUniqueId:S;firstName:S;lastSurname:S;sexDescriptor:S;addresses:A;addresses[0].addressTypeDescriptor:S;addresses[0].city:S;addresses[0].postalCode:S;addresses[0].stateAbbreviationDescriptor:S;addresses[0].streetNumberName:S;addresses[0].apartmentRoomSuiteNumber:S;addresses[0].nameOfCounty:S;addresses[0].doNotPublishIndicator:B;electronicMails:A;electronicMails[0].electronicMailAddress:S;electronicMails[0].electronicMailTypeDescriptor:S;electronicMails[0].primaryEmailAddressIndicator:B'],

/* Lowercase, no whitespace or punctuation: the key objectives are matched on (§4.5). */
function normKey(s){ return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function editDistance(a, b){
  const d = Array.from({length:a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* The candidate nearest to target, or null when none is close. Distance is on
   normKey forms, relative to the longer one; a candidate containing the target
   (or the reverse) counts as close, more so the nearer its length. Ties go to
   the earlier candidate. */
function closest(target, candidates){
  const t = normKey(target);
  if (!t) return null;
  let best = null, bestScore = Infinity;
  (candidates || []).forEach(c => {
    const k = normKey(c);
    if (!k) return;
    const contains = k.includes(t) || t.includes(k);
    const longer = Math.max(t.length, k.length);
    const score = contains ? 0.3 * Math.abs(t.length - k.length) / longer : editDistance(t, k) / longer;
    if (score < bestScore){ best = c; bestScore = score; }
  });
  return bestScore <= 0.4 ? best : null;
}

/* Same semantics as tools/build-fixture.mjs renameAll: every string, keys too. */
function renameFixture(value, pairs){
  if (typeof value === 'string') return pairs.reduce((s, [from, to]) => s.split(from).join(to), value);
  if (Array.isArray(value)) return value.map(v => renameFixture(v, pairs));
  if (value && typeof value === 'object'){
    const o = {};
    Object.keys(value).forEach(k => { o[renameFixture(k, pairs)] = renameFixture(value[k], pairs); });
    return o;
  }
  return value;
}

function fixtureVariant(id){
  if (FIXTURES[id]) return Object.assign(cloneFixture(FIXTURES[id]), {name:id});
  const [vendor, kind] = id.split(/-(?=[^-]+$)/);
  const base = FIXTURES[vendor + '-original'];
  if (!base) return null;
  const fx = cloneFixture(base);
  fx.name = id;
  if (kind === 'corrected'){
    CORRECTIONS.workbook.forEach(c => c.apply(fx.workbook));
    Object.values(fx.samples).forEach(s => CORRECTIONS.sample.forEach(c => c.apply(s)));
  } else if (kind === 'malformed') delete fx.workbook.EnumerationItems;
  else if (kind !== 'original') return null;
  return fx;
}
/* Seeded Northwind and Acme submissions use the same files under their names. */
FIXTURES['northwind-original'] = renameFixture(FIXTURES['vendorb-original'],
  [['Vendor B', 'Northwind'], ['vendorb', 'northwind'], ['VENDORB', 'NORTHWIND']]);
FIXTURES['acme-original'] = renameFixture(FIXTURES['vendorb-original'],
  [['Vendor B', 'Acme'], ['vendorb', 'acme'], ['VENDORB', 'ACME']]);
/* The variants each slot of a fixture set offers in the upload modal. */
const fixtureSet = (id, label) => ({label,
  workbook:[id + '-original', id + '-corrected', id + '-malformed'],
  samples:[id + '-original', id + '-corrected']});
const FIXTURE_SETS = {
  vendorb:fixtureSet('vendorb', 'Vendor B (fictitious test files)'),
  northwind:fixtureSet('northwind', 'Northwind (the Vendor B files, renamed)'),
  acme:fixtureSet('acme', 'Acme (the Vendor B files, renamed)'),
  vendorc:fixtureSet('vendorc', 'Vendor C (small fictitious test files)'),
  vendord:fixtureSet('vendord', 'Vendor D (a real submission shape, fictitious data)')
};
/* Other vendors' files any Assessments submission can try in one click. */
const TRY_OTHER_SETS = [['vendorc', 'Vendor C'], ['vendord', 'Vendor D']];

/* ---------- mapping validation (design §3–§4) ----------
   validateMapping(workbook, samples) reads a vendor's Data Mapping Template
   tabs and the per-assessment samples and returns a report: a verdict, findings
   with fix locations, per-category status and, unless the workbook is malformed,
   the model the expected payloads are built from. Nothing is corrected silently. */
const MAPPING_CATEGORIES = [
  {id:'assessments', label:'Assessments'},
  {id:'links',       label:'Element ↔ column links'},
  {id:'targets',     label:'Ed-Fi targets'},
  {id:'values',      label:'Values'},
  {id:'prearranged', label:'Pre-arranged columns'},
  {id:'objectives',  label:'Objectives'}
];
const didYouMean = s => s == null ? null : 'Did you mean `' + s + '`?';
const closestHint = s => s == null ? null : 'Closest: `' + s + '`';
const sameText = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

/* A tab's rows with trimmed keys and values; rows with nothing in them are
   dropped, but each row keeps its workbook row number (header is row 1). */
function tabRows(workbook, name){
  return (workbook[name] || []).map((r, i) => {
    const o = {__row:i + 2};
    Object.keys(r).forEach(k => { o[k.trim()] = String(r[k] == null ? '' : r[k]).trim(); });
    return o;
  }).filter(o => Object.keys(o).some(k => k !== '__row' && o[k] !== ''));
}
/* Closest allowed code for a failing value. Grade numbers map to grade names. */
function closestCode(value, codes, descriptorType){
  if (descriptorType === 'GradeLevelDescriptor'){
    const v = String(value).trim().toUpperCase();
    const n = v === 'K' || v === 'KG' ? 0 : /^\d{1,2}$/.test(v) ? +v : -1;
    if (n >= 0 && n < GRADE_NAMES.length && codes.includes(GRADE_NAMES[n])) return GRADE_NAMES[n];
  }
  return closest(value, codes);
}
const RESULT_RULES = {
  Boolean:   {ok:v => /^(true|false)$/i.test(v), what:'a Boolean (true or false)'},
  Integer:   {ok:v => /^-?\d+$/.test(v), what:'an Integer'},
  Decimal:   {ok:v => /^-?\d+(\.\d+)?$/.test(v), what:'a Decimal'},
  Percentage:{ok:v => /^-?\d+(\.\d+)?$/.test(v), what:'a Percentage (a number)'},
  Percentile:{ok:v => /^\d+(\.\d+)?$/.test(v), what:'a Percentile (a number)'}
};
const ISO_DATE = v => /^\d{4}-\d{2}-\d{2}(T[\d:.]+(Z|[+-]\d{2}:?\d{2})?)?$/.test(v) && !isNaN(new Date(v));

function validateMapping(workbook, samples){
  const findings = [];
  /* A finding with no row that repeats one already made (the same missing
     enumeration needed by two assessments) is reported once. */
  const add = f => {
    const o = Object.assign({severity:'error', row:null, hint:null, count:null}, f);
    const dup = o.row == null && o.file === 'Workbook' && findings.find(x => x.row == null && x.file === o.file &&
      x.where === o.where && x.message === o.message);
    if (dup) return dup;
    findings.push(o);
    return o;
  };
  workbook = workbook || {};
  samples = samples || {};

  /* Malformed: a required tab or header is missing (§3.1). */
  Object.keys(REQUIRED_TABS).forEach(tab => {
    if (!Array.isArray(workbook[tab])){
      add({category:'assessments', file:'Workbook', where:tab, message:'Required tab `' + tab + '` is missing'});
      return;
    }
    const rows = tabRows(workbook, tab);
    if (!rows.length) return;
    const headers = new Set();
    rows.forEach(r => Object.keys(r).forEach(k => headers.add(k)));
    REQUIRED_TABS[tab].forEach(h => {
      if (!headers.has(h)) add({category:'assessments', file:'Workbook', where:tab,
        message:'Required column `' + h + '` is missing from `' + tab + '`'});
    });
  });
  if (findings.length) return finishReport(findings, null, {}, {});

  const product = tabRows(workbook, 'Product')[0] || {};
  const namespace = product.Namespace || '';
  const model = {product:{name:product['Vendor Product'] || '', namespace}, assessments:[]};

  /* Enumerations: vendor ones from the workbook, by name (ignoring case). */
  const items = tabRows(workbook, 'EnumerationItems');
  const enumNames = [];
  tabRows(workbook, 'EnumerationDefinitions').concat(items).forEach(r => {
    if (r.Enumeration && !enumNames.some(n => sameText(n, r.Enumeration))) enumNames.push(r.Enumeration);
  });
  const enumCodes = name => items.filter(r => sameText(r.Enumeration, name) && r['Code Value']).map(r => r['Code Value']);
  /* §4.3a — which allowed values a descriptor type has. */
  function resolveEnumeration(descriptorType){
    const base = descriptorType.replace(/Descriptor$/, '');
    const vendor = enumNames.find(n => sameText(n, base));
    if (vendor) return {source:'vendor', name:vendor, codes:enumCodes(vendor)};
    if (STANDARD_DESCRIPTORS[descriptorType]) return {source:'standard', name:descriptorType, codes:STANDARD_DESCRIPTORS[descriptorType]};
    return {source:null, name:base, codes:null, hint:closest(base, enumNames)};
  }
  /* A descriptor URI resolves when it names a known value in the vendor
     namespace or a standard Ed-Fi value. */
  function resolveUri(uri){
    const m = String(uri || '').match(/^(.*\/)([A-Za-z]+Descriptor)#(.+)$/);
    if (!m) return {ok:false, hint:null};
    const [, ns, type, code] = m;
    if (ns === 'uri://ed-fi.org/'){
      const codes = STANDARD_DESCRIPTORS[type] || [];
      const hit = codes.find(c => sameText(c, code));
      return hit ? {ok:true, source:'standard', type, code:hit} : {ok:false, hint:closest(code, codes)};
    }
    if (namespace && ns === namespace){
      const en = resolveEnumeration(type);
      if (en.source !== 'vendor') return {ok:false, hint:null};
      const hit = en.codes.find(c => sameText(c, code));
      return hit ? {ok:true, source:'vendor', type, code:hit} : {ok:false, hint:closest(code, en.codes)};
    }
    return {ok:false, hint:null};
  }

  /* §4.1 — assessments. */
  tabRows(workbook, 'Assessments').forEach(r => {
    const a = {type:r['Assessment Type'], identifier:r.assessmentIdentifier, title:r.assessmentTitle,
      category:r.assessmentCategoryDescriptor, adaptive:/^(1|true|y|yes)$/i.test(r.adaptiveAssessment || ''),
      family:r.assessmentFamily || '', maxRawScore:r.maxRawScore || '', row:r.__row,
      sample:null, elements:[], idColumns:{student:-1, activity:-1}};
    ['Assessment Type', 'assessmentIdentifier', 'assessmentTitle', 'assessmentCategoryDescriptor'].forEach(h => {
      if (!r[h]) add({category:'assessments', file:'Workbook', where:'Assessments', row:r.__row,
        message:'`' + h + '` is blank'});
    });
    if (a.category && !resolveUri(a.category).ok)
      add({category:'assessments', file:'Workbook', where:'Assessments', row:r.__row,
        message:'`' + a.category + '` isn\'t a known AssessmentCategoryDescriptor'});
    if (a.type) model.assessments.push(a);
  });
  if (!namespace) add({category:'assessments', file:'Workbook', where:'Product', row:2, message:'`Namespace` is blank'});

  /* An unmatched Assessment Type is one error per distinct name. Its rows are
     still checked against the suggested assessment, so one misnamed type does not
     hide every other finding; the error alone keeps the report not ready. */
  const types = model.assessments.map(a => a.type);
  const unmatched = new Map();
  tabRows(workbook, 'ElementDefinitions').forEach(r => {
    let a = model.assessments.find(x => sameText(x.type, r['Assessment Type']));
    if (!a){
      const name = r['Assessment Type'];
      const guess = closest(name, types);
      const u = unmatched.get(name);
      if (u) u.count++;
      else {
        const f = {category:'assessments', file:'Workbook', where:'ElementDefinitions', row:r.__row,
          message:'Assessment Type `' + name + '` isn\'t in the Assessments tab', hint:didYouMean(guess), count:1};
        unmatched.set(name, add(f));
      }
      a = guess ? model.assessments.find(x => x.type === guess) : null;
      if (!a) return;
    }
    a.elements.push({row:r.__row, name:r.Element || '', dataType:r['Data Type'] || '',
      completeName:r['Ed-Fi ODS/API Element Complete Name'] || '', snippet:r.H || '',
      targets:[], column:-1, reportingMethod:null, resultDatatype:null, resultDatatypeUri:null,
      descriptorType:null, descriptorSource:null, enumeration:null, codes:null, objective:null});
  });

  model.assessments.forEach(a => {
    const sampleKey = Object.keys(samples).find(k => sameText(k, a.type));
    const raw = sampleKey ? samples[sampleKey] : null;
    if (!a.elements.length)
      add({category:'assessments', file:'Workbook', where:'ElementDefinitions',
        message:'`' + a.type + '` has no elements in ElementDefinitions'});
    if (!raw)
      add({category:'assessments', file:'Sample', where:'Sample data — ' + a.type,
        message:'No sample uploaded for `' + a.type + '`, so it can\'t be validated'});
    else {
      a.sample = {name:raw.name, columns:raw.columns.map(c => String(c).trim()), rows:raw.rows};
      if (!a.sample.rows.length)
        add({category:'assessments', file:'Sample', where:'Sample data — ' + a.type,
          message:'The sample for `' + a.type + '` has no rows'});
    }

    /* §4.3 — Ed-Fi targets and the score snippet; §4.3a — enumerations. */
    a.elements.forEach(e => {
      const parts = e.completeName.split('/').map(s => s.trim()).filter(Boolean);
      if (!parts.length)
        add({category:'targets', file:'Workbook', where:'ElementDefinitions', row:e.row,
          message:'`' + e.name + '` has no Ed-Fi target'});
      parts.forEach(part => {
        if (targetByPath(part)) e.targets.push(part);
        else add({category:'targets', file:'Workbook', where:'ElementDefinitions', row:e.row,
          message:'`' + part + '` isn\'t a known Ed-Fi v5 target',
          hint:didYouMean(closest(part, EDFI_V5_TARGETS.map(t => t.path)))});
      });
      if (e.targets.some(t => SCORE_COLLECTIONS.includes(t))){
        const rm = (e.snippet.match(/"assessmentReportingMethodDescriptor"\s*:\s*"([^"]+)"/) || [])[1];
        const dt = (e.snippet.match(/"resultDatatypeTypeDescriptor"\s*:\s*"([^"]+)"/) || [])[1];
        if (!rm || !dt)
          add({category:'targets', file:'Workbook', where:'ElementDefinitions column H', row:e.row,
            message:'`' + e.name + '` needs both assessmentReportingMethodDescriptor and resultDatatypeTypeDescriptor'});
        [rm, dt].filter(Boolean).forEach(uri => {
          const res = resolveUri(uri);
          if (!res.ok) add({category:'targets', file:'Workbook', where:'ElementDefinitions column H', row:e.row,
            message:'`' + uri + '` doesn\'t resolve to a known descriptor value', hint:closestHint(res.hint)});
        });
        if (rm && resolveUri(rm).ok) e.reportingMethod = rm;
        if (dt){ const res = resolveUri(dt); if (res.ok){ e.resultDatatype = res.code; e.resultDatatypeUri = dt; } }
      }
      const dtarget = e.targets.map(targetByPath).find(t => t.type === 'Descriptor' && t.descriptor);
      if (dtarget){
        e.descriptorType = dtarget.descriptor;
        const en = resolveEnumeration(dtarget.descriptor);
        if (en.source){ e.descriptorSource = en.source; e.enumeration = en.name; e.codes = en.codes; }
        else add({category:'targets', file:'Workbook', where:'EnumerationDefinitions',
          message:'No enumeration for `' + dtarget.descriptor + '` (needed by `' + e.name + '`)',
          hint:didYouMean(en.hint)});
      }
    });

    if (!a.sample) return;
    const s = a.sample;

    /* Duplicate headers: the first one is used (§3.3). */
    const seen = new Set();
    s.columns.forEach(c => {
      const k = c.toLowerCase();
      if (seen.has(k)){
        if (!findings.some(f => f.severity === 'warning' && f.where === a.type + ' › column `' + c + '`' && f.file === 'Sample'))
          add({severity:'warning', category:PREARRANGED_COLUMNS.some(p => sameText(p.column, c)) ? 'prearranged' : 'links',
            file:'Sample', where:a.type + ' › column `' + c + '`',
            message:'`' + c + '` appears more than once; the first one is used'});
      } else seen.add(k);
    });
    const colOf = name => s.columns.findIndex(c => sameText(c, name));

    /* §3.3 — pre-arranged identity columns. */
    PREARRANGED_COLUMNS.forEach(pc => {
      const i = colOf(pc.column);
      if (i < 0){
        add({category:'prearranged', file:'Sample', where:'Sample data — ' + a.type,
          message:'Required sample column `' + pc.column + '` is missing',
          hint:didYouMean(closest(pc.column, s.columns))});
        return;
      }
      if (pc.path === 'studentAssessment.studentReference') a.idColumns.student = i;
      else a.idColumns.activity = i;
      const blanks = s.rows.filter(row => !String(row[i] == null ? '' : row[i]).trim()).length;
      if (blanks) add({category:'prearranged', file:'Sample', where:a.type + ' › column `' + pc.column + '`',
        message:'`' + pc.column + '` is blank', count:blanks});
    });

    /* §4.2 — links. */
    const preCols = PREARRANGED_COLUMNS.map(pc => pc.column.toLowerCase());
    a.elements.forEach(e => { e.column = colOf(e.name); });
    const claimed = new Set(a.elements.map(e => e.column).filter(i => i >= 0));
    const unclaimed = s.columns.filter((c, i) => !claimed.has(i) && !preCols.includes(c.toLowerCase()));
    a.elements.filter(e => e.column < 0).forEach(e => add({category:'links', file:'Workbook',
      where:'ElementDefinitions', row:e.row, message:'`' + e.name + '` has no sample column',
      hint:didYouMean(closest(e.name, unclaimed))}));

    /* §4.4 — values, once per distinct failing value. */
    a.elements.filter(e => e.column >= 0 && e.targets.length).forEach(e => {
      const header = s.columns[e.column];
      const counts = new Map();
      s.rows.forEach(row => {
        const v = String(row[e.column] == null ? '' : row[e.column]).trim();
        if (v) counts.set(v, (counts.get(v) || 0) + 1);
      });
      const isScore = e.targets.some(t => SCORE_COLLECTIONS.includes(t));
      const isDate = e.targets.some(t => targetByPath(t).type === 'Date');
      counts.forEach((count, v) => {
        if (isScore){
          const rule = RESULT_RULES[e.resultDatatype];
          if (rule && !rule.ok(v)) add({category:'values', file:'Sample', where:a.type + ' › column `' + header + '`',
            message:'`' + v + '` isn\'t ' + rule.what, count});
        } else if (isDate){
          if (!ISO_DATE(v)) add({category:'values', file:'Sample', where:a.type + ' › column `' + header + '`',
            message:'`' + v + '` isn\'t an ISO 8601 date', hint:'expected YYYY-MM-DD', count});
        } else if (e.codes){
          if (!e.codes.some(c => sameText(c, v))){
            const vendor = e.descriptorSource === 'vendor';
            add({category:'values', file:vendor ? 'Workbook' : 'Sample',
              where:vendor ? 'EnumerationItems (' + e.enumeration + ')' : a.type + ' › column `' + header + '`',
              message:vendor
                ? 'sample value `' + v + '` in `' + header + '` (' + a.type + ') isn\'t a code value'
                : '`' + v + '` isn\'t a ' + e.descriptorType,
              hint:closestHint(closestCode(v, e.codes, e.descriptorType)), count});
          }
        }
      });
    });
  });

  const objectives = {};
  model.assessments.forEach(a => { objectives[a.type] = deriveObjectives(a, add); });

  const notChecked = {};
  model.assessments.filter(a => a.sample).forEach(a => {
    const used = new Set(a.elements.map(e => e.column).filter(i => i >= 0));
    if (a.idColumns.student >= 0) used.add(a.idColumns.student);
    if (a.idColumns.activity >= 0) used.add(a.idColumns.activity);
    notChecked[a.type] = a.sample.columns.filter((c, i) => !used.has(i) &&
      !(a.sample.columns.findIndex(x => sameText(x, c)) !== i));
  });
  return finishReport(findings, model, notChecked, objectives);
}

/* §4.5 — objective codes. An objective element's code is its name less the
   name of the assessment-level element reporting the same method ("Phonics
   Scale Score" less "Scale Score"). Without such an element, the suffix is the
   longest run of trailing words shared by the objective elements of that
   method. Codes are matched on normKey; the first spelling of a key wins. */
const OBJECTIVE_TARGETS = ['objectiveAssessment.scores', 'studentObjectiveAssessment.scoreResults'];
const ASSESSMENT_SCORE_TARGETS = ['assessment.scores', 'studentAssessment.scoreResults'];
const words = s => String(s).trim().split(/\s+/).filter(Boolean);
function stripSuffix(name, suffixWords){
  const w = words(name);
  const n = suffixWords.length;
  if (!n || w.length <= n) return '';
  const tail = w.slice(-n).map(x => x.toLowerCase());
  if (tail.join(' ') !== suffixWords.map(x => x.toLowerCase()).join(' ')) return '';
  return w.slice(0, -n).join(' ').replace(/[\s:–—-]+$/, '');
}
function commonTrailingWords(names){
  const ws = names.map(words);
  const out = [];
  for (let i = 1; ws.every(w => w.length >= i); i++){
    const x = ws[0][ws[0].length - i].toLowerCase();
    if (!ws.every(w => w[w.length - i].toLowerCase() === x)) break;
    out.unshift(ws[0][ws[0].length - i]);
  }
  return out;
}
function deriveObjectives(a, add){
  const objEls = a.elements.filter(e => e.targets.some(t => OBJECTIVE_TARGETS.includes(t)));
  const asmEls = a.elements.filter(e => e.reportingMethod && e.targets.some(t => ASSESSMENT_SCORE_TARGETS.includes(t)));
  const byKey = new Map();
  objEls.forEach(e => {
    let suffix = [];
    const base = e.reportingMethod && asmEls.find(x => x.reportingMethod === e.reportingMethod);
    if (base) suffix = words(base.name);
    else if (e.reportingMethod){
      const peers = objEls.filter(x => x.reportingMethod === e.reportingMethod);
      if (peers.length > 1) suffix = commonTrailingWords(peers.map(x => x.name));
    }
    const code = stripSuffix(e.name, suffix);
    if (!code){
      add({category:'objectives', file:'Workbook', where:'ElementDefinitions', row:e.row,
        message:'`' + e.name + '` doesn\'t end in the name of its score' +
          (suffix.length ? ' (`' + suffix.join(' ') + '`)' : '') + ', so its objective can\'t be derived'});
      return;
    }
    const key = normKey(code);
    const first = byKey.get(key);
    if (!first){ byKey.set(key, code); e.objective = code; return; }
    e.objective = first;
    if (first !== code)
      add({severity:'warning', category:'objectives', file:'Workbook', where:'ElementDefinitions', row:e.row,
        message:'`' + e.name + '` names objective `' + code + '`, the same as `' + first + '`; `' + first + '` is used'});
  });
  return [...byKey.entries()].map(([key, code]) => ({code, key}));
}

/* ---------- expected payloads (design §5) ----------
   Built only from a ready report's model; callers guard. */
function descriptorUri(model, source, type, code){
  return (source === 'standard' ? 'uri://ed-fi.org/' : model.product.namespace) + type + '#' + code;
}
const canonicalCode = (codes, v) => (codes || []).find(c => sameText(c, v)) || v;
const assessmentRef = (model, a) => ({assessmentIdentifier:a.identifier, namespace:model.product.namespace});
function scoreEntry(e){
  return {assessmentReportingMethodDescriptor:e.reportingMethod, resultDatatypeTypeDescriptor:e.resultDatatypeUri};
}
function scoreDefs(els){
  const out = [];
  els.forEach(e => {
    if (e.reportingMethod && !out.some(s => s.assessmentReportingMethodDescriptor === e.reportingMethod)) out.push(scoreEntry(e));
  });
  return out;
}
function expectedAssessment(model, a){
  const out = {assessmentIdentifier:a.identifier, namespace:model.product.namespace, assessmentTitle:a.title,
    assessmentCategoryDescriptor:a.category, adaptiveAssessment:a.adaptive};
  if (a.family) out.assessmentFamily = a.family;
  if (a.maxRawScore !== '') out.maxRawScore = isNaN(+a.maxRawScore) ? a.maxRawScore : +a.maxRawScore;
  const scores = scoreDefs(a.elements.filter(e => e.targets.some(t => ASSESSMENT_SCORE_TARGETS.includes(t))));
  if (scores.length) out.scores = scores;
  return out;
}
function objectiveCodes(a){
  const seen = [];
  a.elements.forEach(e => { if (e.objective && !seen.includes(e.objective)) seen.push(e.objective); });
  return seen;
}
function expectedObjectives(model, a){
  return objectiveCodes(a).map(code => {
    const payload = {assessmentReference:assessmentRef(model, a), identificationCode:code};
    const scores = scoreDefs(a.elements.filter(e => e.objective === code));
    if (scores.length) payload.scores = scores;
    return {code, key:normKey(code), payload};
  });
}
const cell = (row, i) => i < 0 ? '' : String(row[i] == null ? '' : row[i]).trim();
function expectedStudentAssessment(model, a, rowIndex){
  const row = a.sample.rows[rowIndex];
  const payload = {studentAssessmentIdentifier:cell(row, a.idColumns.activity),
    assessmentReference:assessmentRef(model, a),
    studentReference:{studentUniqueId:cell(row, a.idColumns.student)}};
  const objectives = new Map();
  a.elements.filter(e => e.column >= 0).forEach(e => {
    const v = cell(row, e.column);
    if (!v) return;
    e.targets.filter(t => t.startsWith('studentAssessment.') || t.startsWith('studentObjectiveAssessment.')).forEach(t => {
      if (t === 'studentAssessment.scoreResults')
        (payload.scoreResults = payload.scoreResults || []).push(Object.assign(scoreEntry(e), {result:v}));
      else if (t === 'studentObjectiveAssessment.scoreResults'){
        if (!e.objective) return;
        if (!objectives.has(e.objective)) objectives.set(e.objective, {objectiveAssessmentReference:
          {assessmentIdentifier:a.identifier, identificationCode:e.objective, namespace:model.product.namespace},
          scoreResults:[]});
        objectives.get(e.objective).scoreResults.push(Object.assign(scoreEntry(e), {result:v}));
      } else if (e.codes && targetByPath(t).type === 'Descriptor'){
        const uri = descriptorUri(model, e.descriptorSource, e.descriptorType, canonicalCode(e.codes, v));
        if (t === 'studentAssessment.accommodations')
          (payload.accommodations = payload.accommodations || []).push({accommodationDescriptor:uri});
        else if (t === 'studentAssessment.period') payload.period = {assessmentPeriodDescriptor:uri};
        else if (STUDENT_FIELD[t]) payload[STUDENT_FIELD[t]] = uri;
      } else if (STUDENT_FIELD[t] && !STUDENT_FIELD[t].includes('.')) payload[STUDENT_FIELD[t]] = v;
    });
  });
  if (objectives.size) payload.studentObjectiveAssessments = [...objectives.values()];
  return payload;
}

/* Greedy set cover (design §5): the fewest rows that show every distinct
   descriptor or Boolean value and every objective with a score. Ties go to the
   earlier row. Each pick says why: the first feature it was chosen for. */
function selectRows(model, a){
  if (!a.sample || a.idColumns.student < 0 || a.idColumns.activity < 0) return [];
  const enumEls = a.elements.filter(e => e.column >= 0 && (e.codes || e.resultDatatype === 'Boolean'));
  const objEls = a.elements.filter(e => e.column >= 0 && e.objective);
  const features = a.sample.rows.map(row => {
    const f = new Map();
    enumEls.forEach(e => {
      const v = cell(row, e.column);
      if (v) f.set(e.name + ': ' + canonicalCode(e.codes, v), e.codes ? canonicalCode(e.codes, v) : e.name + ' ' + v);
    });
    objEls.forEach(e => { if (cell(row, e.column)) f.set('Objective: ' + e.objective, e.objective + ' score'); });
    return f;
  });
  const uncovered = new Set();
  features.forEach(f => f.forEach((_, k) => uncovered.add(k)));
  const out = [];
  while (uncovered.size){
    let best = -1, bestN = 0;
    features.forEach((f, i) => {
      let n = 0;
      f.forEach((_, k) => { if (uncovered.has(k)) n++; });
      if (n > bestN){ best = i; bestN = n; }
    });
    if (best < 0) break;
    const covers = [...features[best].keys()].filter(k => uncovered.has(k));
    covers.forEach(k => uncovered.delete(k));
    const row = a.sample.rows[best];
    out.push({index:best, key:{studentId:cell(row, a.idColumns.student), activityId:cell(row, a.idColumns.activity)},
      why:'first ' + features[best].get(covers[0]), covers});
  }
  return out.sort((x, y) => x.index - y.index);
}

/* Endpoints the run turns on (design §5), in a fixed order. */
function deriveEndpoints(model){
  const withSample = model.assessments.filter(a => a.sample);
  const eps = [];
  const typesIn = obj => [...new Set((JSON.stringify(obj).match(/uri:\/\/[^"#]*?\/(\w+Descriptor)#/g) || [])
    .map(u => u.match(/\/(\w+Descriptor)#$/)[1]))];
  const asm = model.assessments.map(a => expectedAssessment(model, a));
  eps.push({id:'assessments', resource:'assessments', recordCount:asm.length,
    fieldCount:asm.reduce((n, x) => Math.max(n, Object.keys(x).length), 0), descriptors:typesIn(asm)});
  const objs = [].concat(...model.assessments.map(a => expectedObjectives(model, a).map(o => o.payload)));
  if (objs.length)
    eps.push({id:'objectiveAssessments', resource:'objectiveAssessments', recordCount:objs.length,
      fieldCount:objs.reduce((n, x) => Math.max(n, Object.keys(x).length), 0), descriptors:typesIn(objs)});
  const students = [].concat(...withSample.map(a => selectRows(model, a).map(r => expectedStudentAssessment(model, a, r.index))));
  if (students.length){
    const paths = new Set();
    students.forEach(s => Object.keys(s).forEach(k => paths.add(k)));
    eps.push({id:'studentAssessments', resource:'studentAssessments', recordCount:students.length,
      fieldCount:paths.size, descriptors:typesIn(students)});
  }
  const all = [...new Set([].concat(...eps.map(e => e.descriptors)))];
  all.forEach(type => {
    const values = new Set();
    (JSON.stringify([asm, objs, students]).match(new RegExp('uri://[^"]*?/' + type + '#[^"]+', 'g')) || []).forEach(u => values.add(u));
    eps.push({id:'descriptor:' + type, resource:type.charAt(0).toLowerCase() + type.slice(1) + 's',
      recordCount:values.size, fieldCount:3, descriptors:[type]});
  });
  return eps;
}

function finishReport(findings, model, notChecked, objectives){
  const errors = findings.filter(f => f.severity === 'error').length;
  const warnings = findings.length - errors;
  const categories = MAPPING_CATEGORIES.map(c => {
    const fs = findings.filter(f => f.category === c.id);
    const e = fs.filter(f => f.severity === 'error').length;
    return {id:c.id, label:c.label, errors:e, warnings:fs.length - e,
      status:e ? 'error' : fs.length ? 'warning' : 'ok'};
  });
  return {verdict:!model ? 'malformed' : errors ? 'not-ready' : 'ready',
    errors, warnings, findings, categories, model, notChecked, objectives};
}


/* ---------- assessments artifacts: workbook and per-assessment sample slots ----------
   An Assessments submission holds a Mapping workbook and one Sample data slot per
   assessment the workbook names (design §3.2). Entries carry the fixture variant
   they were "uploaded" from; sample versions count per assessment. */
function isAssessments(sub){ return !!sub && MODELS[sub.model].kind === 'assessments'; }
function currentSample(sub, assessmentType){
  const list = (sub.artifacts.sample || []).filter(x => x.assessment && sameText(x.assessment, assessmentType));
  return list.length ? list[list.length - 1] : null;
}
function workbookFixture(sub){
  const cur = currentVersion(sub, 'mapping');
  return cur && cur.fixture ? fixtureVariant(cur.fixture) : null;
}
function sampleSlots(sub){
  const fx = workbookFixture(sub);
  if (!fx || !Array.isArray(fx.workbook.Assessments)) return [];
  return fx.workbook.Assessments.map(r => String(r['Assessment Type'] || '').trim()).filter(Boolean);
}
const artifactLabel = (sub, type, assessment) => isAssessments(sub)
  ? (type === 'mapping' ? 'Mapping workbook' : type === 'sample' ? 'Sample data' + (assessment ? ' — ' + assessment : '')
    : ARTIFACTS.find(a => a.id === type).label)
  : ARTIFACTS.find(a => a.id === type).label;
/* The mapping validation report for a submission's current artifacts, cached
   on their versions. Null when there is no workbook. */
function reportFor(sub){
  if (!isAssessments(sub)) return null;
  const cur = currentVersion(sub, 'mapping');
  if (!cur || !cur.fixture) return null;
  const slots = sampleSlots(sub);
  const sig = cur.v + ':' + cur.fixture + '|' + slots.map(s => {
    const c = currentSample(sub, s);
    return s + '=' + (c ? c.v + ':' + c.fixture : '');
  }).join('|');
  if (sub.reportCache && sub.reportCache.sig === sig) return sub.reportCache.report;
  const fx = workbookFixture(sub);
  const samples = {};
  slots.forEach(s => {
    const c = currentSample(sub, s);
    if (!c) return;
    const sfx = fixtureVariant(c.fixture);
    const key = sfx && Object.keys(sfx.samples).find(k => sameText(k, s));
    if (key) samples[s] = sfx.samples[key];
  });
  const report = validateMapping(fx.workbook, samples);
  sub.reportCache = {sig, report};
  return report;
}
