/* ---------- result builders ---------- */
function mockObserved(path, letter, key){
  const leaf = path.split('.').pop().replace(/\[\d+\]$/, '');
  if (SAMPLE_VALUES[leaf]) return SAMPLE_VALUES[leaf];
  const h = seedOf(key + '|' + path);
  if (letter === 'B') return h % 2 ? 'true' : 'false';
  if (letter === 'N') return String(h % 40 + 1);
  if (letter === 'O') return '{ … }';
  if (letter === 'A') return '[ ' + (h % 3 + 1) + ' item(s) ]';
  if (/Descriptor$/.test(leaf)) return 'uri://ed-fi.org/' + leaf.charAt(0).toUpperCase() + leaf.slice(1) +
    '#' + (DESCRIPTOR_VALUES[leaf] || leaf.replace(/Descriptor$/, '').replace(/([A-Z])/g, ' $1')
      .trim().replace(/^./, c => c.toUpperCase()));
  if (/Date$/.test(leaf)) return '2016-09-' + String(h % 28 + 1).padStart(2, '0');
  if (/Time$/.test(leaf)) return String(h % 12 + 8).padStart(2, '0') + ':00:00';
  if (leaf === 'id') return h.toString(16).padStart(8, '0') + '-4a1c-9f2e-' + (h % 9999);
  return leaf.replace(/([A-Z])/g, ' $1').trim().replace(/^./, c => c.toUpperCase()) + ' ' + (h % 90 + 10);
}
/* Decode one "path:type[?ops]" token into a displayable element row. */
function decodeElement(token, key, changedField, f, isFailStep){
  const [path, rest] = token.split(':');
  const letter = rest.charAt(0);
  const explicit = rest.indexOf('?') >= 0 ? rest.slice(rest.indexOf('?') + 1) : null;
  const meta = ASSERT_TYPE[letter] || ASSERT_TYPE.S;
  const leaf = path.split('.').pop().replace(/\[\d+\]$/, '');
  const type = /Descriptor$/.test(leaf) && letter === 'S' ? 'Descriptor' : meta[0];
  const el = {el:path, type, assertions: explicit ? explicit.split(',').join(', ') : meta[1],
              observed: mockObserved(path, letter, key), st:'pass'};
  /* The one real value check the collection makes. */
  if (changedField && path === changedField){
    const before = seedOf(key + path) % 5 + 1;
    el.assertions = 'changed from ' + before;
    el.observed = String(before + 1);
  }
  if (isFailStep && f.el === path){
    el.st = f.kind;
    el.why = f.msg;
    if (f.kind === 'fail-absent') el.observed = '(absent)';
    if (f.kind === 'fail-unchanged') el.observed = (el.assertions.match(/\d+$/) || ['1'])[0];
    if (f.kind === 'fail-assert') el.observed = '"' + el.observed + '"';
  }
  return el;
}
/* A Bruno run materializes its whole scenario tree at start with every task
   unchecked, and runCheck() fills one task's slot in place. That keeps "latest
   check per task" structurally true — there is one slot per task, and
   re-checking overwrites it. */
function brunoRunState(model){
  return {kind:'bruno', scenarios: COLLECTION[model].map(([area, scenario, rawSteps, meta]) => {
    let spec = '';
    const steps = rawSteps.map(([name, status, changed, elementSpec]) => {
      if (elementSpec && elementSpec !== '=') spec = elementSpec;
      return {name, status, changed, spec: elementSpec === '' ? '' : spec};
    });
    return {
      area, scenario, seq: meta.seq, prereqs: meta.prereqs, params: {},
      tasks: scenarioTasks(rawSteps, meta).map(t => ({
        n: t.n, text: t.text, outOfScope: t.outOfScope,
        step: t.stepIndex >= 0 ? steps[t.stepIndex] : null,
        check: null
      }))
    };
  })};
}
/* A function declaration, not a const arrow: seed() runs at load and reaches
   this through runCheck, before a const in this position would initialize. */
function scenarioOf(run, key){
  return run.results.scenarios.find(s => s.area + '/' + s.scenario === key);
}

/* Executes one task's verification step and records the result. The run keeps
   only the latest check per task plus a count of attempts (ID3) — enough for a
   reviewer to see that a passing task took five tries, without retaining a
   history we have decided not to show. */
function runCheck(run, scenarioKey, taskNo){
  const scen = scenarioOf(run, scenarioKey);
  if (!scen) return null;
  const task = scen.tasks.find(t => t.n === taskNo);
  if (!task || !task.step) return null;

  /* The prototype's outcome switch reaches a single check as well as a whole run;
     without it an interactive run could never demonstrate the distinction FR8
     exists for, because it never executes as a batch. */
  if (run.mode === 'infra' || run.mode === 'auth'){
    const infra = run.mode === 'infra';
    task.check = {
      st:'fail', kind: infra ? 'fail-infra' : 'fail-auth',
      msg: infra ? 'Executor could not reach the environment ' + run.env
                 : '401 from the environment ' + run.env,
      observedStatus: infra ? 0 : 401, elements: [],
      params: Object.assign({}, scen.params), at: tick(), by: me(),
      attempts: (task.check ? task.check.attempts : 0) + 1
    };
    return task.check;
  }

  const fails = run.mode === 'pass' ? {} : (BRUNO_FAILS[run.model] || {});
  const f = fails[scenarioKey];
  const isFail = !!f && f.step === taskNo;
  const statusFailed = isFail && f.kind === 'fail-status';

  task.check = {
    st: isFail ? 'fail' : 'pass',
    kind: isFail ? f.kind : 'pass',
    msg: isFail ? f.msg : '',
    observedStatus: statusFailed ? 404 : task.step.status,
    elements: statusFailed || !task.step.spec ? []
      : task.step.spec.split(';').map(tok =>
          decodeElement(tok, scenarioKey, task.step.changed, f, isFail)),
    params: Object.assign({}, scen.params),
    at: tick(), by: me(),
    attempts: (task.check ? task.check.attempts : 0) + 1
  };
  return task.check;
}

/* Runs a scenario's tasks in order and stops at the first failure, matching the
   collection's own dependency behaviour — 03 calls validateDependency() against
   variables 01 sets, so continuing past a failure would only produce noise. */
function checkAll(run, scenarioKey){
  const scen = scenarioOf(run, scenarioKey);
  if (!scen) return 0;
  let n = 0;
  for (const task of scen.tasks){
    if (!task.step || task.outOfScope) continue;
    const check = runCheck(run, scenarioKey, task.n);
    n++;
    if (check && check.st === 'fail') break;
  }
  return n;
}

/* Sealing a partial run is allowed (ID9), so the action says plainly what is
   being frozen rather than letting it happen by accident. */
function sealSummary(run){
  const t = resultTally(run.results);
  const checked = t.pass + t.fail;
  return checked + ' of ' + t.total + ' scenarios checked' +
    (t.notAttempted ? ', ' + t.notAttempted + ' not attempted' : '');
}

/* Sealing freezes the latest check per task and re-executes nothing (ID2). The
   accumulated checks are the evidence. A run may be sealed with tasks never
   checked (ID9) — whether partial evidence suffices is the reviewer's call, not
   the platform's (§12, D25). */
function sealRun(run){
  if (run.state !== 'open') return run;
  const sub = submission(run.submissionId);
  run.state = 'sealed';
  run.ended = tick();
  const t = resultTally(run.results);
  run.outcome = t.fail > 0 ? 'failed' : (t.pass > 0 ? 'passed' : 'not-attempted');
  hist(sub, 'Run ' + run.id + ' sealed — ' + run.completeness + ' — ' +
    t.pass + ' passed, ' + t.fail + ' failed, ' + t.notAttempted + ' not attempted');
  recomputeStatus(sub);
  return run;
}
/* Abandoning is the honest option when a run has gone the wrong way. Forcing a
   seal instead would push a meaningless record into the review queue (ID5). */
function abandonRun(run){
  if (run.state !== 'open') return run;
  const sub = submission(run.submissionId);
  run.state = 'abandoned';
  run.ended = tick();
  run.results = null;
  run.outcome = 'abandoned';
  hist(sub, 'Run ' + run.id + ' abandoned — its checks were discarded');
  recomputeStatus(sub);
  return run;
}

/* Builds the run state a vendor would have arrived at by working every scenario
   through to the end. Used only to seed the prototype's run history, so the
   sealed runs on screen have real checks behind them. */
function seededBrunoResults(model, mode){
  const run = {model, mode, results: brunoRunState(model)};
  run.results.scenarios.forEach(s => {
    const key = s.area + '/' + s.scenario;
    for (const task of s.tasks){
      if (!task.step || task.outOfScope) continue;
      const c = runCheck(run, key, task.n);
      if (c && c.st === 'fail') break;   /* the collection's own dependency behaviour */
    }
  });
  return run.results;
}
function resultTally(r){
  if (!r) return {pass:0, fail:0, notAttempted:0, total:0, unit:'scenarios'};
  if (r.kind === 'bruno'){
    let pass = 0, fail = 0, notAttempted = 0;
    r.scenarios.forEach(s => {
      const checked = s.tasks.filter(t => t.check);
      if (!checked.length) notAttempted++;
      else if (checked.some(t => t.check.st === 'fail')) fail++;
      else pass++;
    });
    return {pass, fail, notAttempted, total:r.scenarios.length, unit:'scenarios'};
  }
  let pass = 0, fail = 0, excluded = 0;
  (r.endpoints || []).forEach(e => e.records.forEach(rec => rec.fields.forEach(f =>
    f.st === 'pass' ? pass++ : f.st === 'excluded' ? excluded++ : fail++)));
  return {pass, fail, excluded, notAttempted:0, total:pass + fail, unit:'field checks'};
}

/* ---------- derived state ---------- */
/* D26 — product identity is the application record, so a product lookup is an
   application lookup. `productId` on a submission or run is an application id. */
const product = id => APP.applications.find(p => p.id === id);
const certStarted = appId => APP.submissions.some(s => s.productId === appId);
/* §8 / D22 — a product may hold one open submission per certification model. */
const openModels = appId => APP.submissions.filter(s => s.productId === appId &&
  !['approved','rejected'].includes(s.status)).map(s => s.model);
const startableModels = appId => Object.values(MODELS)
  .filter(m => !openModels(appId).includes(m.id));
const submission = id => APP.submissions.find(s => s.id === id);
const run = id => APP.runs.find(r => r.id === id);
const runsFor = sub => APP.runs.filter(r => r.submissionId === sub.id)
  .sort((a,b) => new Date(b.started) - new Date(a.started));
/* An open run is the vendor's workspace, so the queue holds sealed ones. A
   reviewer may opt in to give feedback on work in progress (ID8). An abandoned
   run has no results and is never shown. */
function reviewerRuns(sub, includeOpen){
  return runsFor(sub).filter(r => r.state !== 'abandoned' &&
    (includeOpen || r.state === 'sealed' || r.state === 'completed'));
}
/* A Bruno run is open until sealed; Assessments keeps queued/running/completed. */
const runStateBadge = r =>
  r.state === 'open'      ? '<span class="badge b-amber">Open</span>' :
  r.state === 'sealed'    ? '<span class="badge b-green">Sealed</span>' :
  r.state === 'abandoned' ? '<span class="badge b-red">Abandoned</span>' :
  '<span class="badge">' + esc(r.state.charAt(0).toUpperCase() + r.state.slice(1)) + '</span>';
function currentVersion(sub, type){
  const list = sub.artifacts[type];
  return list && list.length ? list[list.length - 1] : null;
}
const mySubmissions = () => APP.submissions.filter(s => !product(s.productId).foreign);

/* FR13 — deterministic readiness gate. */
/* A finished run stamped Complete. Bruno models finish by sealing; Assessments
   finishes on its own. An open run is still being worked and an abandoned one
   has no results, so neither qualifies. */
const isFinished = r => r.state === 'sealed' || r.state === 'completed';
const isQualifying = r => r.completeness === 'Complete' &&
  (r.state === 'sealed' || r.state === 'completed');
function gate(sub){
  const missing = isAssessments(sub) ? assessmentsMissing(sub) : ARTIFACTS.filter(a => !currentVersion(sub, a.id));
  const qualifying = runsFor(sub).find(isQualifying);
  return {missing, qualifying, artifactsComplete: missing.length === 0,
          met: missing.length === 0 && !!qualifying};
}
/* Assessments: the workbook, one sample per workbook assessment, and product
   documentation (design §3.2). Without a workbook the slots are unknown. */
function assessmentsMissing(sub){
  const missing = [];
  if (!currentVersion(sub, 'mapping')) missing.push({id:'mapping', label:'Mapping workbook'});
  const slots = sampleSlots(sub);
  if (!slots.length && !currentVersion(sub, 'mapping')) missing.push({id:'sample', label:'Sample data'});
  slots.forEach(s => { if (!currentSample(sub, s)) missing.push({id:'sample', assessment:s, label:'Sample data — ' + s}); });
  if (!currentVersion(sub, 'docs')) missing.push(ARTIFACTS.find(a => a.id === 'docs'));
  return missing;
}
/* §8.1 — completeness is decided from artifacts alone, at run start. */
const wouldStamp = sub => gate(sub).artifactsComplete ? 'Complete' : 'Incomplete';
/* D22 as revised (ID6) — one check executing per environment at a time. An open
   run is idle between checks, so it does not hold the slot; blocking a product
   for the days a SIS run takes would serialize independent certifications for no
   benefit. A prototype check is synchronous, so no Bruno run is ever mid-check
   when this is read; a real executor would also test for that. */
const busyEnv = env => APP.runs.find(r => r.env === env &&
  (r.state === 'queued' || r.state === 'running'));
/* FR11 — a run is stale when its pinned versions are no longer current. */
function isStale(sub, r){
  if (isAssessments(sub) && r.pinned && r.pinned.samples){
    const now = pinSamples(sub), was = r.pinned.samples;
    const keys = new Set(Object.keys(now).concat(Object.keys(was)));
    if ([...keys].some(k => now[k] !== was[k])) return true;
    if (r.pinned.scope !== undefined && r.pinned.scope !== scopeSignature(effectiveScope(sub))) return true;
    return ['mapping', 'docs'].some(id => {
      const cur = currentVersion(sub, id);
      return (cur ? cur.v : null) !== (r.pinned[id] == null ? null : r.pinned[id]);
    });
  }
  return ARTIFACTS.some(a => {
    const cur = currentVersion(sub, a.id);
    return (cur ? cur.v : null) !== (r.pinned ? r.pinned[a.id] : null);
  });
}
function pinSamples(sub){
  const out = {};
  sampleSlots(sub).forEach(s => { const c = currentSample(sub, s); out[s] = c ? c.v : null; });
  return out;
}
const hasUnseenChanges = sub => !!(sub.artifactsChangedAt && sub.reviewerSeenAt &&
  new Date(sub.artifactsChangedAt) > new Date(sub.reviewerSeenAt));

function recomputeStatus(sub){
  if (['inreview','changes','approved','rejected'].includes(sub.status)) return;
  const g = gate(sub);
  const anything = ARTIFACTS.some(a => currentVersion(sub, a.id)) || runsFor(sub).length > 0;
  const next = g.met ? 'ready' : (anything ? 'incomplete' : 'draft');
  if (next !== sub.status){
    sub.status = next;
    hist(sub, next === 'ready'
      ? 'Status changed to Ready for Review (readiness gate met)'
      : 'Status changed to ' + STATUS[next].label + ' (readiness gate not met)', 'Platform');
  }
}

/* ---------- actions ---------- */

/* FR5 — starting certification from an application registers it as a product and
   opens a Draft submission for the chosen model (§8). Nothing about the
   application is copied or re-entered; the submission points at it. */
function startCertification(appId, model){
  const sub = mkSubmission({productId:appId, model, status:'draft',
    artifacts:artifactSet([]), created:tick()});
  hist(sub, 'Submission created — certification started from application ' +
    product(appId).name + ' (' + MODELS[model].label + ')');
  return sub;
}

function uploadArtifact(sub, type, name, malformed, opts){
  if (isAssessments(sub) && (type === 'mapping' || type === 'sample'))
    return uploadAssessmentsArtifact(sub, type, name, opts || {});
  if (type === 'mapping' && malformed){
    hist(sub, 'Vendor mapping CSV upload rejected — structural validation failed (' + name + ')');
    return {ok:false, errors:[
      'Row 1: required column "EdFiResource" is missing.',
      'Row 1: unexpected column "Resource Name" — not in the published template.',
      'Row 14: "EdFiElement" is empty but "VendorField" is populated.',
      'Row 22: "IsRequired" must be TRUE or FALSE; found "yes".'
    ]};
  }
  const list = sub.artifacts[type];
  const replacing = list.length > 0;
  list.push({v:list.length + 1, name, by:me(), at:tick()});
  const label = ARTIFACTS.find(a => a.id === type).label;
  hist(sub, (replacing
    ? 'Artifact replaced: ' + label + ' → v' + list.length + ' (' + name + ')'
    : 'Artifact uploaded: ' + label + ' v1 (' + name + ')') +
    (type === 'mapping' ? ' — structural validation passed' : ''));
  sub.artifactsChangedAt = tick();
  recomputeStatus(sub);
  return {ok:true};
}

/* Assessments workbook and sample uploads are fixture variants (design §8). A
   malformed workbook is rejected and not stored; every accepted upload's history
   line ends with the report verdict it produces. */
function uploadAssessmentsArtifact(sub, type, name, opts){
  const fixture = opts.fixture || fixtureSetOf(sub) + '-original';
  const fx = fixtureVariant(fixture);
  if (type === 'mapping'){
    const check = validateMapping(fx.workbook, {});
    if (check.verdict === 'malformed'){
      const missing = check.findings.map(f => f.message.replace(/^Required (tab|column) /, '').replace(/ is missing.*$/, ''));
      hist(sub, 'Mapping workbook upload rejected — malformed workbook (' + missing.join(', ') + ' missing)');
      return {ok:false, errors:check.findings.map(f => f.message + '.')};
    }
  }
  const assessment = type === 'sample' ? (opts.assessment || sampleSlots(sub)[0]) : null;
  if (type === 'sample' && !assessment) return {ok:false, errors:['Upload the mapping workbook first: it names the sample slots.']};
  const list = sub.artifacts[type];
  const prior = type === 'sample' ? list.filter(x => sameText(x.assessment, assessment)).length : list.length;
  const entry = {v:prior + 1, name, by:me(), at:tick(), fixture};
  if (assessment) entry.assessment = assessment;
  list.push(entry);
  const label = artifactLabel(sub, type, assessment);
  hist(sub, (prior ? 'Artifact replaced: ' + label + ' → v' + entry.v + ' (' + name + ')'
    : 'Artifact uploaded: ' + label + ' v1 (' + name + ')') + ' — report: ' + verdictText(reportFor(sub)));
  sub.artifactsChangedAt = tick();
  dropUnimpliedExclusions(sub);
  recomputeStatus(sub);
  return {ok:true};
}
/* "Load fixture set": the workbook and every slot's sample in one step. Loading
   another set switches the submission to it, so later uploads offer its files;
   a rejected workbook leaves the submission as it was. */
function loadFixtureSet(sub, setId, variant){
  const id = setId + '-' + (variant || 'original');
  const res = uploadArtifact(sub, 'mapping', setId + '-mapping-workbook.xlsx', false, {fixture:id});
  if (!res.ok) return res;
  sub.fixtureSet = setId;
  const sampleId = variant === 'malformed' ? setId + '-original' : id;
  sampleSlots(sub).forEach(s => {
    const sfx = fixtureVariant(sampleId);
    if (sfx && Object.keys(sfx.samples).some(k => sameText(k, s)))
      uploadArtifact(sub, 'sample', setId + '-' + s.toLowerCase().replace(/\W+/g, '-') + '-sample.csv', false,
        {assessment:s, fixture:sampleId});
  });
  return {ok:true};
}

/* ---------- run scope: reviewer-owned, per submission (design §7) ----------
   Derived from the report's model: the endpoints the mapping implies and the
   coverage rows. The reviewer can only narrow it — exclude endpoints, remove or
   add rows — each with a reason that lands in history. A run pins the scope it
   started with; changing the scope stales earlier runs. Ported from v1. */
function runScopeOf(sub){
  return sub.runScope || (sub.runScope = {excluded:{}, rowAdds:[], rowRemoves:[]});
}
function sameKey(a, b){ return a.studentId === b.studentId && a.activityId === b.activityId; }
function keyLabel(key){ return key.studentId + ' (' + key.activityId + ')'; }
function rowKeyAt(a, i){
  const row = a.sample.rows[i];
  return {studentId:cell(row, a.idColumns.student), activityId:cell(row, a.idColumns.activity)};
}
function effectiveScope(sub){
  const rep = reportFor(sub);
  const cur = currentVersion(sub, 'mapping');
  const scope = {mapping:cur ? cur.v : null, samples:pinSamples(sub), endpoints:[], rows:{}, orphans:[]};
  if (!rep || rep.verdict !== 'ready') return scope;
  const rs = runScopeOf(sub);
  scope.endpoints = deriveEndpoints(rep.model).map(e => rs.excluded[e.id]
    ? {id:e.id, on:false, reason:rs.excluded[e.id].reason} : {id:e.id, on:true});
  rep.model.assessments.filter(a => a.sample).forEach(a => {
    const find = key => a.sample.rows.findIndex((_, i) => sameKey(rowKeyAt(a, i), key));
    const removed = rs.rowRemoves.filter(x => x.assessment === a.type);
    const list = selectRows(rep.model, a)
      .map(r => ({index:r.index, key:r.key, why:r.why, origin:'coverage'}))
      .filter(r => !removed.some(x => sameKey(x.key, r.key)));
    rs.rowAdds.filter(x => x.assessment === a.type).forEach(x => {
      const i = find(x.key);
      if (i < 0) scope.orphans.push({assessment:a.type, key:x.key, kind:'add', reason:x.reason});
      else if (!list.some(r => r.index === i))
        list.push({index:i, key:x.key, why:'added by reviewer: ' + x.reason, origin:'added', reason:x.reason});
    });
    removed.forEach(x => { if (find(x.key) < 0) scope.orphans.push({assessment:a.type, key:x.key, kind:'remove', reason:x.reason}); });
    scope.rows[a.type] = list.sort((x, y) => x.index - y.index);
  });
  return scope;
}
/* An exclusion goes with its endpoint: when a ready report no longer implies
   it, it is dropped (and audited). A not-ready report implies nothing yet, so
   exclusions wait for the next ready one. */
function dropUnimpliedExclusions(sub){
  const rs = runScopeOf(sub);
  const rep = reportFor(sub);
  if (!rep || rep.verdict !== 'ready') return;
  const ids = deriveEndpoints(rep.model).map(e => e.id);
  Object.keys(rs.excluded).forEach(id => {
    if (ids.includes(id)) return;
    delete rs.excluded[id];
    hist(sub, 'Run scope: ' + id + ' is no longer implied by the mapping; exclusion dropped', 'Platform');
  });
}
function scopeSignature(scope){
  if (!scope) return '';
  return JSON.stringify({e:scope.endpoints.map(e => [e.id, e.on]),
    r:Object.keys(scope.rows).sort().map(k => [k, scope.rows[k].map(x => x.key.studentId + '|' + x.key.activityId)])});
}
function scopeChanged(sub, what){
  sub.scopeChangedAt = tick();
  hist(sub, 'Run scope: ' + what);
}
function setEndpointIncluded(sub, id, on, reason){
  const rs = runScopeOf(sub);
  if (!effectiveScope(sub).endpoints.some(e => e.id === id)) return {ok:false, error:'Unknown endpoint.'};
  if (!on){
    if (!String(reason || '').trim()) return {ok:false, error:'A reason is required.'};
    rs.excluded[id] = {reason:String(reason).trim(), by:me(), at:tick()};
    scopeChanged(sub, 'excluded ' + id + ' — "' + rs.excluded[id].reason + '"');
  } else {
    if (!rs.excluded[id]) return {ok:true};
    delete rs.excluded[id];
    scopeChanged(sub, 'included ' + id + ' again');
  }
  return {ok:true};
}
function addScopeRow(sub, assessment, key, reason){
  if (!String(reason || '').trim()) return {ok:false, error:'A reason is required.'};
  if ((effectiveScope(sub).rows[assessment] || []).some(r => sameKey(r.key, key)))
    return {ok:false, error:'That row is already in scope.'};
  const rs = runScopeOf(sub);
  rs.rowRemoves = rs.rowRemoves.filter(x => !(x.assessment === assessment && sameKey(x.key, key)));
  rs.rowAdds.push({key, assessment, reason:String(reason).trim(), by:me(), at:tick()});
  scopeChanged(sub, 'added row ' + keyLabel(key) + ' — "' + String(reason).trim() + '"');
  return {ok:true};
}
function removeScopeRow(sub, assessment, key, reason){
  if (!String(reason || '').trim()) return {ok:false, error:'A reason is required.'};
  const rs = runScopeOf(sub);
  const wasAdded = rs.rowAdds.some(x => x.assessment === assessment && sameKey(x.key, key));
  rs.rowAdds = rs.rowAdds.filter(x => !(x.assessment === assessment && sameKey(x.key, key)));
  if (!wasAdded) rs.rowRemoves.push({key, assessment, reason:String(reason).trim(), by:me(), at:tick()});
  scopeChanged(sub, 'removed row ' + keyLabel(key) + ' — "' + String(reason).trim() + '"');
  return {ok:true};
}
function undoScopeRow(sub, assessment, key){
  const rs = runScopeOf(sub);
  const match = x => x.assessment === assessment && sameKey(x.key, key);
  if (!rs.rowAdds.some(match) && !rs.rowRemoves.some(match)) return {ok:true};
  rs.rowAdds = rs.rowAdds.filter(x => !match(x));
  rs.rowRemoves = rs.rowRemoves.filter(x => !match(x));
  scopeChanged(sub, 'undid the change to row ' + keyLabel(key));
  return {ok:true};
}

/* ---------- runs: simulated GETs compared with expected responses (design §7) ----------
   The prototype has no Ed-Fi API, so the "response" is the expected payload with
   harmless formatting differences and, for a realistic run, one fault of each
   kind in endpoints the reviewer kept. Comparison applies the §9.1
   normalization; objectives match on the normalized key. */
function compareValue(type, expected, observed){
  if (observed === undefined || observed === null)
    return {st:'fail', kind:'value', why:'Present in the expected response but absent from the API response.'};
  const e = String(expected), o = String(observed);
  if (['Integer', 'Decimal', 'Percentile', 'Percentage'].includes(type)){
    const en = Number(e.trim()), on = Number(o.trim());
    if (o.trim() === '' || isNaN(on)) return {st:'fail', kind:'value', why:'Observed value isn\'t a ' + type + ' (§9.1).'};
    if (en === on) return e.trim() === o.trim() ? {st:'pass'} : {st:'pass', why:'Parsed as numbers before comparing (§9.1).'};
    return {st:'fail', kind:'value', why:'Different value after normalization — a real difference, not formatting.'};
  }
  if (type === 'Date'){
    const at = s => Date.parse(s.length === 10 ? s + 'T00:00:00Z' : s);
    if (isNaN(at(o))) return {st:'fail', kind:'value', why:'Observed value isn\'t a date (§9.1).'};
    if (at(e) === at(o)) return e === o ? {st:'pass'} : {st:'pass', why:'Both sides compared as instants (§9.1).'};
    return {st:'fail', kind:'value', why:'Different date after normalization.'};
  }
  if (type === 'Descriptor'){
    const [ens, ecode] = e.split('#'), [ons, ocode] = o.split('#');
    if (ocode === undefined || ens !== ons)
      return {st:'fail', kind:'value', why:'Descriptor namespace or type differs from the expected one (D8).'};
    if (sameText(ecode, ocode)) return ecode === ocode ? {st:'pass'} : {st:'pass', why:'Descriptor codes compare ignoring case.'};
    return {st:'fail', kind:'value', why:'Descriptor resolves, but to a different value than the sample.'};
  }
  if (type === 'Code'){
    if (normKey(e) === normKey(o)) return e === o ? {st:'pass'}
      : {st:'pass', why:'Objective codes match on the normalized key (case, spacing and punctuation ignored).'};
    return {st:'fail', kind:'value', why:'Objective code differs after normalization.'};
  }
  if (type === 'Boolean') return sameText(e, o) ? {st:'pass'} : {st:'fail', kind:'value', why:'Boolean differs.'};
  if (e.trim() === o.trim()) return e === o ? {st:'pass'} : {st:'pass', why:'Whitespace trimmed before comparing (§9.1).'};
  return {st:'fail', kind:'value', why:'Different value after normalization.'};
}
function leafType(key, siblings){
  if (/Descriptor$/.test(key)) return 'Descriptor';
  if (key === 'administrationDate') return 'Date';
  if (key === 'identificationCode') return 'Code';
  if (key === 'maxRawScore') return 'Decimal';
  if (key === 'adaptiveAssessment') return 'Boolean';
  if (key === 'result'){
    const dt = String((siblings || {}).resultDatatypeTypeDescriptor || '').split('#')[1] || '';
    if (['Integer', 'Decimal', 'Percentile', 'Percentage', 'Boolean'].includes(dt)) return dt;
  }
  return 'String';
}
/* Keyed collections are matched by key, not position. */
function entryKey(item){
  if (!item || typeof item !== 'object') return String(item);
  if (item.assessmentReportingMethodDescriptor) return item.assessmentReportingMethodDescriptor.toLowerCase();
  if (item.objectiveAssessmentReference) return normKey(item.objectiveAssessmentReference.identificationCode);
  if (item.accommodationDescriptor) return item.accommodationDescriptor.toLowerCase();
  return JSON.stringify(item);
}
function entryLabel(item){
  if (item.assessmentReportingMethodDescriptor) return item.assessmentReportingMethodDescriptor.split('#').pop();
  if (item.objectiveAssessmentReference) return item.objectiveAssessmentReference.identificationCode;
  if (item.accommodationDescriptor) return item.accommodationDescriptor.split('#').pop();
  return '?';
}
function compareRecord(expected, observed, prefix, out){
  out = out || [];
  Object.keys(expected).forEach(k => {
    const ev = expected[k], ov = observed ? observed[k] : undefined, path = (prefix ? prefix + '.' : '') + k;
    if (Array.isArray(ev)){
      ev.forEach(item => {
        const p2 = path + '[' + entryLabel(item) + ']';
        const match = Array.isArray(ov) ? ov.find(x => entryKey(x) === entryKey(item)) : undefined;
        if (!match){
          out.push({path:p2, expected:entryLabel(item), observed:'(absent)', st:'fail', kind:'value',
            why:'A collection entry in the expected response is missing from the API response.'});
          return;
        }
        compareRecord(item, match, p2, out);
      });
    } else if (ev && typeof ev === 'object'){
      compareRecord(ev, ov && typeof ov === 'object' ? ov : {}, path, out);
    } else {
      const c = compareValue(leafType(k, expected), ev, ov);
      out.push(Object.assign({path, expected:String(ev), observed:ov == null ? '(absent)' : String(ov)}, c));
    }
  });
  return out;
}
/* The report for the artifact versions a run pinned. */
function reportAt(sub, scope){
  const m = sub.artifacts.mapping.find(x => x.v === scope.mapping);
  if (!m || !m.fixture) return null;
  const fx = fixtureVariant(m.fixture);
  const samples = {};
  Object.keys(scope.samples || {}).forEach(type => {
    const s = sub.artifacts.sample.find(x => sameText(x.assessment, type) && x.v === scope.samples[type]);
    const sfx = s && fixtureVariant(s.fixture);
    const key = sfx && Object.keys(sfx.samples).find(k => sameText(k, type));
    if (key) samples[type] = sfx.samples[key];
  });
  return validateMapping(fx.workbook, samples);
}
function descriptorUrisIn(obj, type){
  return [...new Set(JSON.stringify(obj).match(new RegExp('uri://[^"]*?/' + type + '#[^"]+', 'g')) || [])];
}
function simulateResponses(expected, mode, isOn){
  const obs = JSON.parse(JSON.stringify(expected));
  const recode = c => String(c).replace(/: /g, ' - ');
  obs.assessments.forEach(r => {
    if (r.payload.assessmentTitle) r.payload.assessmentTitle += ' ';
    if (typeof r.payload.maxRawScore === 'number') r.payload.maxRawScore = r.payload.maxRawScore.toFixed(1);
  });
  obs.objectiveAssessments.forEach(r => { r.payload.identificationCode = recode(r.payload.identificationCode); });
  obs.studentAssessments.forEach(r => {
    if (r.payload.administrationDate) r.payload.administrationDate += 'T00:00:00Z';
    (r.payload.studentObjectiveAssessments || []).forEach(o => {
      o.objectiveAssessmentReference.identificationCode = recode(o.objectiveAssessmentReference.identificationCode);
    });
  });
  if (mode !== 'realistic') return obs;
  if (isOn('studentAssessments')){
    /* 1: one integer score off by one; 2: the next selected row isn't returned. */
    const i = obs.studentAssessments.findIndex(r => (r.payload.scoreResults || [])
      .some(s => /#Integer$/.test(s.resultDatatypeTypeDescriptor || '') && /^\d+$/.test(s.result)));
    if (i >= 0){
      const s = obs.studentAssessments[i].payload.scoreResults
        .find(x => /#Integer$/.test(x.resultDatatypeTypeDescriptor || '') && /^\d+$/.test(x.result));
      s.result = String(+s.result + 1);
      if (i + 1 < obs.studentAssessments.length) obs.studentAssessments[i + 1].missing = true;
    }
    obs.studentAssessments = obs.studentAssessments.filter(r => !r.missing);
  }
  /* 3: the last objective isn't loaded. */
  if (isOn('objectiveAssessments') && obs.objectiveAssessments.length) obs.objectiveAssessments.pop();
  /* 4: one vendor descriptor value isn't loaded, in an endpoint the reviewer kept. */
  const id = Object.keys(obs.descriptors).find(x => isOn(x) && obs.descriptors[x].some(u => !/^uri:\/\/ed-fi\.org\//.test(u)));
  if (id){
    const uri = obs.descriptors[id].find(u => !/^uri:\/\/ed-fi\.org\//.test(u));
    obs.descriptors[id] = obs.descriptors[id].filter(u => u !== uri);
  }
  return obs;
}
function runAssessmentChecks(sub, scope, mode){
  const rep = scope ? reportAt(sub, scope) : null;
  if (!rep || !rep.model) return {kind:'assessments', endpoints:[]};
  const model = rep.model;
  const eps = deriveEndpoints(model);
  const stateOf = id => scope.endpoints.find(x => x.id === id) || {on:true};
  const isOn = id => stateOf(id).on;
  const expected = {assessments:[], objectiveAssessments:[], studentAssessments:[], descriptors:{}};
  model.assessments.forEach(a => {
    expected.assessments.push({key:a.identifier, label:a.title || a.type, payload:expectedAssessment(model, a)});
    expectedObjectives(model, a).forEach(o => expected.objectiveAssessments.push({key:a.identifier + '/' + o.key,
      label:(a.title || a.type) + ' › ' + o.code, payload:o.payload}));
    if (!a.sample) return;
    (scope.rows[a.type] || []).forEach(row => {
      const i = a.sample.rows.findIndex((_, n) => sameKey(rowKeyAt(a, n), row.key));
      if (i < 0) return;
      expected.studentAssessments.push({key:row.key, label:keyLabel(row.key), why:row.why,
        payload:expectedStudentAssessment(model, a, i)});
    });
  });
  eps.filter(e => e.id.startsWith('descriptor:')).forEach(e => {
    expected.descriptors[e.id] = descriptorUrisIn([expected.assessments, expected.objectiveAssessments,
      expected.studentAssessments].map(l => l.map(x => x.payload)), e.descriptors[0]);
  });
  const observed = simulateResponses(expected, mode, isOn);
  const asEndpoint = (e, records) => {
    const st = stateOf(e.id);
    return {id:e.id, resource:e.resource, excluded:!st.on, reason:st.reason || null,
      records:st.on ? records : records.map(r => Object.assign({}, r, {fields:r.fields.map(f =>
        ({path:f.path, expected:f.expected, observed:'—', st:'excluded', why:'Excluded by reviewer: "' + st.reason + '"'}))}))};
  };
  return {kind:'assessments', endpoints:eps.map(e => {
    if (e.id === 'assessments') return asEndpoint(e, expected.assessments.map(x => ({label:x.label, key:x.key,
      fields:compareRecord(x.payload, (observed.assessments.find(o => o.key === x.key) || {}).payload)})));
    if (e.id === 'objectiveAssessments') return asEndpoint(e, expected.objectiveAssessments.map(x => {
      const o = observed.objectiveAssessments.find(y => y.payload.assessmentReference.assessmentIdentifier ===
        x.payload.assessmentReference.assessmentIdentifier && normKey(y.payload.identificationCode) === normKey(x.payload.identificationCode));
      if (!o) return {label:x.label, key:x.key, fields:[{path:'(record)', expected:x.payload.identificationCode,
        observed:'(not returned)', st:'fail', kind:'objective-notfound',
        why:'No objectiveAssessment matches this code on the normalized key. Live codes: ' +
          observed.objectiveAssessments.map(y => y.payload.identificationCode).join(', ') + '.'}]};
      return {label:x.label, key:x.key, fields:compareRecord(x.payload, o.payload)};
    }));
    if (e.id === 'studentAssessments') return asEndpoint(e, expected.studentAssessments.map(x => {
      const o = observed.studentAssessments.find(y => sameKey(y.key, x.key));
      if (!o) return {label:x.label, key:x.key, why:x.why, fields:[{path:'(record)', expected:x.label,
        observed:'(not returned)', st:'fail', kind:'notfound',
        why:'GET studentAssessments?studentUniqueId=' + x.key.studentId + ' returned no record with ' +
          'studentAssessmentIdentifier ' + x.key.activityId + '.'}]};
      return {label:x.label, key:x.key, why:x.why, fields:compareRecord(x.payload, o.payload)};
    }));
    return asEndpoint(e, (expected.descriptors[e.id] || []).map(uri => ({label:uri.split('#').pop(), key:uri, fields:[
      (observed.descriptors[e.id] || []).includes(uri)
        ? {path:'codeValue', expected:uri, observed:uri, st:'pass'}
        : {path:'codeValue', expected:uri, observed:'(not loaded)', st:'fail', kind:'notloaded',
           why:'GET /ed-fi/' + e.resource + ' has no value with this namespace and code.'}]})));
  })};
}

function startRun(sub, outcomeMode){
  if (isAssessments(sub)){
    const rep = reportFor(sub);
    if (!rep || rep.verdict !== 'ready') return null;   /* design §7: only from a Ready report */
  }
  const m = MODELS[sub.model];
  const r = {
    id:uid('run'), submissionId:sub.id, productId:sub.productId, model:sub.model,
    state:'queued', outcome:null, completeness:wouldStamp(sub),
    pinned:{}, tag:m.tag, sha:m.sha, initiator:me(), env:product(sub.productId).env,
    started:tick(), ended:null, results:null, mode:outcomeMode
  };
  ARTIFACTS.forEach(a => { const c = currentVersion(sub, a.id); r.pinned[a.id] = c ? c.v : null; });
  if (isAssessments(sub)){
    r.pinned.sample = null;
    r.pinned.samples = pinSamples(sub);
    r.scope = JSON.parse(JSON.stringify(effectiveScope(sub)));
    r.pinned.scope = scopeSignature(r.scope);
  }
  /* A Bruno run is worked through by the vendor, so it opens and waits. An
     Assessments run is a batch the platform executes, so it keeps its timers. */
  if (MODELS[sub.model].kind === 'bruno'){
    r.state = 'open';
    r.results = brunoRunState(sub.model);
    APP.runs.push(r);
    hist(sub, 'Run opened — ' + m.label + ' — stamped ' + r.completeness +
      '. Check each task as its data lands.');
    return r;
  }
  APP.runs.push(r);
  hist(sub, 'Run started — ' + m.label + ' — stamped ' + r.completeness +
    (r.completeness === 'Incomplete'
      ? ' (' + gate(sub).missing.map(a => a.label).join(', ') + ' missing)' : ''));
  setTimeout(() => { if (r.state === 'queued'){ r.state = 'running'; render(); } }, 1400);
  setTimeout(() => finishRun(r), 5200);
  return r;
}
function finishRun(r){
  if (r.state === 'completed') return;
  if (MODELS[r.model].kind === 'bruno') return;   /* Bruno runs seal, they do not finish */
  const sub = submission(r.submissionId);
  r.state = 'completed';
  r.ended = tick();
  if (r.mode === 'infra'){
    r.outcome = 'infra-error';
    hist(sub, 'Run ' + r.id + ' failed — infrastructure error (executor could not reach ' + r.env + ')', 'Platform');
  } else if (r.mode === 'auth'){
    r.outcome = 'auth-error';
    hist(sub, 'Run ' + r.id + ' failed — authentication error (401 from environment ' + r.env + ')', 'Platform');
  } else {
    const mode = r.mode === 'pass' ? 'pass' : 'realistic';
    r.results = runAssessmentChecks(sub, r.scope, mode);   /* Bruno runs returned above */
    const t = resultTally(r.results);
    r.outcome = t.fail === 0 ? 'passed' : 'failed';
    hist(sub, 'Run ' + r.id + ' completed — ' + r.completeness + ' — ' +
      (t.fail === 0 ? 'all ' + t.unit + ' passed' : t.fail + ' of ' + t.total + ' ' + t.unit + ' failed'), 'Platform');
  }
  recomputeStatus(sub);
  render();
}

function reviewerOpen(sub){
  sub.reviewerSeenAt = tick();
  if (sub.status === 'ready'){ sub.status = 'inreview'; hist(sub, 'Status changed to In Review'); }
}
function requestChanges(sub, text){
  sub.comments.push({by:me(), at:tick(), text});
  sub.status = 'changes';
  sub.reviewerSeenAt = tick();
  hist(sub, 'Changes requested with comment');
}
function decide(sub, kind, reason){
  sub.status = kind;
  sub.decision = {kind, by:me(), at:tick(), reason:reason || ''};
  hist(sub, (kind === 'approved' ? 'Approved' : 'Rejected') + (reason ? ' — ' + reason : ''));
}

      </table>
    </div>
    <div class="card"><h2>What the button does</h2>
      <div class="muted">Starting a certification registers this application as a product under
        <a href="#/products">My products</a> and opens a <strong>Draft</strong> submission for the
        certification model you pick. The product's name, vendor, environment and ODS are the
        application's own &mdash; they are never re-entered, and a certification cannot be pointed at an
        application Ed-Fi did not provision (D6, D26). A single application may certify against more than
        one model at a time (§8, D22).</div></div>`;
}

/* The green button in the Certification column. One button per application,
   regardless of how many models are in flight. */

  return `<button class="btn sm" data-act="viewcert" data-app="${p.id}"
    title="${esc(labels)}">View Certification</button>`;
}

function vendorRunHistory(){

  return crumbs([['Home', '#/products'], ['Run history']]) + `
    <div class="pagehead"><div><h1>Run history</h1>
      <div class="sub">Every run across every product. Immutable (FR11).</div></div></div>
    <div class="card">${runTable(rows, {showProduct:true, sub:null})}</div>`;

function vendorSubmission(id){
  const sub = submission(id);
  if (!sub) return placeholder('Submission');
  const p = product(sub.productId), g = gate(sub), m = MODELS[sub.model];
  const runs = runsFor(sub);
  const busy = busyEnv(product(sub.productId).env);
  return crumbs([['Home', '#/products'], ['My products', '#/products'],
      [p.name, '#/application/' + p.id], [m.label]]) + `
    <div class="pagehead">
      <div><h1>${esc(m.label)} certification</h1>
        <div class="sub"><a href="#/application/${p.id}">${esc(p.name)}</a> &middot; ${esc(p.vendor)}
          &middot; <span class="tag">${esc(p.env)}</span>
          &middot; <span class="tag">${esc(p.ods)}</span></div></div>
      <div class="acts">
        <button class="btn ghost sm" data-act="export">&#8682; Export</button>
        <button class="btn" data-act="gotorun" data-sub="${sub.id}">Start a certification run</button>
      </div>
    </div>
    ${statusBanner(sub, g, busy)}
    <div class="card">
      <div class="summary">
        <div><div class="k">Status</div><div class="v">${badge(sub.status)}</div></div>
        <div><div class="k">Cleared by</div><div class="v">${esc(STATUS[sub.status].who)}</div></div>
        <div><div class="k">Created</div><div class="v">${fmt(sub.created)}</div></div>
        <div><div class="k">Current qualifying run</div><div class="v">${

        <div><div class="k">Scenario version</div><div class="v"><span class="tag">${esc(m.tag)}</span></div></div>
      </div>

    </div>

      sub.comments.map(c => `<div class="banner orange" style="border-left-color:var(--amber);background:var(--amber-bg)">
        <h3>${esc(c.by)} <span class="muted" style="font-weight:400">${fmt(c.at)}</span></h3>
        <p>${esc(c.text)}</p></div>`).join('')}</div>` : ''}
    <div class="card">
      <div class="cardhead"><h2>Certification runs</h2>
        <div class="right">
          <label class="muted" style="font-size:12.5px">
            <input type="checkbox" id="showTrial" ${APP.showTrial ? 'checked' : ''} /> Show trial runs
          </label>
        </div>
      </div>
      ${runTable(APP.showTrial ? runs : runs.filter(r => r.completeness === 'Complete'), {sub})}
      ${!APP.showTrial && runs.some(r => r.completeness === 'Incomplete')
        ? `<div class="muted" style="margin-top:12px;font-size:12.5px">${
            runs.filter(r => r.completeness === 'Incomplete').length} trial run(s) hidden.
