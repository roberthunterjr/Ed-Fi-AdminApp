# This compose file defines the supporting services, Ed-Fi Admin App and Api.
# It is intended to be used in conjunction with the base edfi-docker-compose.yml file

name: edfiadminapp

services:
  edfiadminapp-keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.1}
    container_name: edfiadminapp-keycloak
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT_EXPOSED:-8080}:8080'
    volumes:
      - vol-edfiadminapp-keycloak:/opt/keycloak/data
      - ./adminapp/healthcheck.sh:/opt/keycloak/healthcheck.sh
      # Bind-mount realm template for sed-based rendering at startup
      - ${KEYCLOAK_REALM_CONFIG_TEMPLATE:-./adminapp/realm-config.json}:/tmp/realm-config.tmpl:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PROTOCOL: ${KEYCLOAK_HOSTNAME_PROTOCOL:-https}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: false
      KC_HOSTNAME_STRICT: false
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_CONSOLE_LEVEL: ${KC_LOG_CONSOLE_LEVEL:-error}
      KC_LOG: file,console
      KC_HEALTH_ENABLED: true
      # Variables used to render /tmp/realm-config.tmpl via sed
      BASE_URL: ${BASE_URL:-https://localhost}
      BASE_URL_DEV: ${BASE_URL_DEV:-http://localhost:3333}
      KEYCLOAK_REALM_CONFIG_TEMPLATE: ${KEYCLOAK_REALM_CONFIG_TEMPLATE:-./adminapp/realm-config.json}
      KEYCLOAK_EDFIADMINAPP_CLIENT_SECRET: ${KEYCLOAK_EDFIADMINAPP_CLIENT_SECRET:-adminapp-secret}
      KEYCLOAK_EDFIADMINAPP_DEV_CLIENT_SECRET: ${KEYCLOAK_EDFIADMINAPP_DEV_CLIENT_SECRET:-adminapp-dev-secret}
    entrypoint:
      - sh
      - -c
      - |
        cp /opt/keycloak/healthcheck.sh /tmp/healthcheck.sh && \
        chmod +x /tmp/healthcheck.sh && \
        sed \
          -e "s|{{BASE_URL}}|${BASE_URL}|g" \
          -e "s|{{BASE_URL_DEV}}|${BASE_URL_DEV}|g" \
          -e "s|{{KEYCLOAK_EDFIADMINAPP_CLIENT_SECRET}}|${KEYCLOAK_EDFIADMINAPP_CLIENT_SECRET}|g" \
          -e "s|{{KEYCLOAK_EDFIADMINAPP_DEV_CLIENT_SECRET}}|${KEYCLOAK_EDFIADMINAPP_DEV_CLIENT_SECRET}|g" \
          /tmp/realm-config.tmpl > /tmp/realm-config.json && \
        /opt/keycloak/bin/kc.sh import --file /tmp/realm-config.json --override true && \
        /opt/keycloak/bin/kc.sh start-dev
    networks:
      - edfiadminapp-network
    healthcheck:
      test: ['CMD-SHELL', '/tmp/healthcheck.sh']
      interval: 20s
      timeout: 10s
      retries: 5

  # Use edfiadminapp-postgres for the Admin App api's data store with PostgreSQL
  edfiadminapp-postgres:
    image: postgres:${POSTGRESQL_IMAGE_TAG:-16.2}
    profiles:
      - postgresql
    container_name: edfiadminapp-postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT_EXPOSED:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ADMIN_APP_DB_NAME:-sbaa}
    volumes:
      - vol-edfiadminapp-db:/var/lib/postgresql/data
    networks:
      - edfiadminapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Use edfiadminapp-mssql for the Admin App api's data store with SQL Server
  edfiadminapp-mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:-2022-latest}
    profiles:
      - mssql
    container_name: edfiadminapp-mssql
    ports:
      - '127.0.0.1:${MSSQL_PORT_EXPOSED:-1433}:1433'
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:-Y}
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DB: ${ADMIN_APP_DB_NAME:-sbaa}
      MSSQL_PID: ${MSSQL_PID:-Express}
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        sleep 30s
        /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P  ${MSSQL_SA_PASSWORD} -Q "IF DB_ID(N'${MSSQL_DB:-sbaa}') IS NULL CREATE DATABASE [${MSSQL_DB:-sbaa}];"
        wait
    volumes:
      - vol-edfiadminapp-mssql:/var/opt/mssql
    networks:
      - edfiadminapp-network
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -Q "SELECT 1" -b -l 10']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  memcached:
    image: memcached:1.6@sha256:d99136ed4c1cf2e3fceb498763f2b7fedec7c486a0fe8a57be19f2a0519ce1fa
    restart: always
    networks:
      - edfiadminapp-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'timeout 2 bash -ec "exec 3<>/dev/tcp/127.0.0.1/11211; echo version >&3; head -n 1 <&3 | grep -q ^VERSION"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  yopass:
    image: jhaals/yopass:12.5.0@sha256:916a1cf45d3665dd7e6a1a2157c7b81a06bfebd87947ace731bca0145418c5b5
    restart: always
    container_name: edfiadminapp-yopass
    ports:
      - '127.0.0.1:8082:80'
    command: '--memcached=host.docker.internal:31527 --port 80'
    networks:
      - edfiadminapp-network
    depends_on:
      memcached:
        condition: service_healthy

  edfiadminapp-api:
    build:
      context: ../
      dockerfile: packages/api/Dockerfile
    profiles:
      - adminapp
    container_name: edfiadminapp-api
    volumes:
      - api-logs:/app/logs
      - ./ssl/server.crt:/app/ssl/server.crt:ro
      - ./settings/e2e/oidc-http-patch.cjs:/app/e2e-hooks/oidc-http-patch.cjs:ro
    environment:
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-/app/ssl/server.crt}
      - NODE_OPTIONS=${API_NODE_OPTIONS:-}
      - DB_SSL=${DB_SSL:-true}
      - DB_ENGINE=${DB_ENGINE:-pgsql}
      - DB_SECRET_VALUE=${DB_SECRET_VALUE}
      - DB_TRUST_CERTIFICATE=${DB_TRUST_CERTIFICATE:-false}
      - DB_TTL_IN_MINUTES=${DB_TTL_IN_MINUTES:-120}
      - USE_YOPASS=${USE_YOPASS:-true}
      - SSL_VERIFICATION=${SSL_VERIFICATION:-true}
      - YOPASS_URL=${YOPASS_URL:-http://edfiadminapp-yopass:80}
      - CERT_BRUNO_SRC_REF=${CERT_BRUNO_SRC_REF:-'v2.1.0'}
      - CERT_BRUNO_SRC_CHECKSUM=${CERT_BRUNO_SRC_CHECKSUM:-'71840f51f464c60d7b90c7bbf08d9be039df291d51dd69085ffc4703b98f11e6'}
      - CERT_BRUNO_ON_DOWNLOAD_ERROR=${CERT_BRUNO_ON_DOWNLOAD_ERROR:-'warning'}
    extra_hosts:
      - 'localhost:host-gateway' # Allow container to access host's localhost
    restart: unless-stopped
    depends_on:
      edfiadminapp-postgres:
        condition: service_healthy
        required: false
      edfiadminapp-mssql:
        condition: service_healthy
        required: false
      edfiadminapp-keycloak:
        condition: service_healthy
      yopass:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/healthcheck || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - edfiadminapp-network

  edfiadminapp-fe:
    build:
      context: ../
      dockerfile: packages/fe/Dockerfile
    environment:
        # Change this to use the nginx proxy URL
        VITE_API_URL: ${VITE_API_URL:-https://localhost/adminapp-api}
        VITE_OIDC_ID: ${VITE_OIDC_ID:-1}
        VITE_BASE_PATH: '${VITE_BASE_PATH:-/adminapp/}'
        VITE_HELP_GUIDE: '${VITE_HELP_GUIDE:-https://docs.ed-fi.org/reference/admin-app-v4}'
        VITE_IDP_ACCOUNT_URL: '${VITE_IDP_ACCOUNT_URL:-https://localhost/auth/realms/edfi/account/}'
        VITE_STARTING_GUIDE: '${VITE_STARTING_GUIDE:-${VITE_HELP_GUIDE}/system-administrators/global-administration-tasks}'
        VITE_CONTACT: '${VITE_CONTACT:-https://community.ed-fi.org/}'
        VITE_APPLICATION_NAME: '${VITE_APPLICATION_NAME:-Ed-Fi Admin App}'
    profiles:
      - adminapp
    container_name: edfiadminapp-fe
    volumes:
      - ./adminapp/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      edfiadminapp-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4200/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - edfiadminapp-network

networks:
  edfiadminapp-network:
    external: true
    name: edfiadminapp-network

volumes:
  api-logs:
    driver: local
    name: vol-edfiadminapp-api-logs
  vol-edfiadminapp-db:
    driver: local
    name: vol-edfiadminapp-db
  vol-edfiadminapp-mssql:
    driver: local
    name: vol-edfiadminapp-mssql
  vol-edfiadminapp-keycloak:
    driver: local
    name: vol-edfiadminapp-keycloak
