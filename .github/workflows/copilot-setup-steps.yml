name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # services:
      # Disabling the SQL Server work for now, with the assumption that Copilot
      # would have trouble working on MSSQL scripts in this repo.
      # mssql:
      #   image: mcr.microsoft.com/mssql/server:2022-latest
      #   ports:
      #     - '1433:1433'
      #   options: >-
      #     --health-cmd "exit 0"
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 3
      #     --name mssql
      #     --user root
      #   env:
      #     ACCEPT_EULA: Y
      #     MSSQL_PID: Express
      #     MSSQL_SA_PASSWORD: ${{ env.DATABASE_PASSWORD }}

    steps:
      # DATABASE_USER/DATABASE_NAME/DATABASE_PASSWORD are inlined directly in the
      # commands below rather than passed through an `env:` block. Copilot code
      # review's dynamic setup-step runner voids `env:` values on this step
      # regardless of whether they come from a job-level block, a step-level
      # block, or repo secrets - they all resolved empty in that context, even
      # as plain literals - while the run script's own text is preserved as-is.
      # The Postgres role/database only exist on this ephemeral runner and are
      # never reachable outside it, so this credential is not a real secret.
      # See AC-606.
      - run: |
          sudo systemctl start postgresql.service
          pg_isready
          sudo -u postgres psql -c "CREATE ROLE sa WITH LOGIN PASSWORD 'postgres_ci_only';"
          sudo -u postgres psql -c "CREATE DATABASE sbaa"

      # - name: Install sqlcmd
